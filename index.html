{ q_title: "Câu 1", q_content: "Số liền trước của số bé nhất có ba chữ số là số nào?", options: ["A. $101$", "B. $99$", "C. $100$", "D. $98$"], correct_idx: 1, explain: "Số bé nhất có ba chữ số là $100$. Số liền trước của nó là $99$." },
{ q_title: "Câu 2", q_content: "Số thích hợp điền vào chỗ chấm: $15\\text{ cm} + \\dots = 4\\text{ dm}$ là:", options: ["A. $25\\text{ cm}$", "B. $25\\text{ dm}$", "C. $11\\text{ cm}$", "D. $35\\text{ cm}$"], correct_idx: 0, explain: "Đổi $4\\text{ dm} = 40\\text{ cm}$. Số điền vào chỗ chấm là: $40 - 15 = 25\\text{ (cm)}$." },
{ q_title: "Câu 3", q_content: "Tìm $x$, biết: $x \\times 5 = 50 - 10$", options: ["A. $x = 40$", "B. $x = 6$", "C. $x = 8$", "D. $x = 9$"], correct_idx: 2, explain: "$x \\times 5 = 40$, suy ra $x = 40 : 5 = 8$." },
{ q_title: "Câu 4", q_content: "Ngày mùng $4$&nbsp;của một tháng là thứ Ba. Hỏi ngày $13$&nbsp;của tháng đó là thứ mấy?", options: ["A. Thứ Tư", "B. Thứ Năm", "C. Thứ Sáu", "D. Thứ Hai"], correct_idx: 1, explain: "Ngày $4 + 7 = 11$&nbsp;là thứ Ba. Ngày $12$&nbsp;là thứ Tư. Ngày $13$&nbsp;là thứ Năm." },
{ q_title: "Câu 5", q_content: "Số chẵn lớn nhất có $2$&nbsp;chữ số khác nhau là số nào?", options: ["A. $99$", "B. $98$", "C. $100$", "D. $88$"], correct_idx: 1, explain: "Số chẵn lớn nhất có $2$&nbsp;chữ số là $98$, nó cũng có $2$&nbsp;chữ số khác nhau." },
{ q_title: "Câu 6", q_content: "Mẹ đi siêu thị mua cam hết $25$&nbsp;nghìn đồng, mua táo hết $15$&nbsp;nghìn đồng. Mẹ đưa cho cô thu ngân tờ $50$&nbsp;nghìn đồng. Cô thu ngân trả lại mẹ tiền thừa toàn bộ bằng các tờ $5$&nbsp;nghìn đồng. Hỏi mẹ nhận được mấy tờ $5$&nbsp;nghìn đồng?", options: ["A. $1$&nbsp;tờ", "B. $3$&nbsp;tờ", "C. $2$&nbsp;tờ", "D. $4$&nbsp;tờ"], correct_idx: 2, explain: "Tiền mẹ mua đồ: $25 + 15 = 40$&nbsp;nghìn. Tiền thừa: $50 - 40 = 10$&nbsp;nghìn. Số tờ $5$&nbsp;nghìn: $10 : 5 = 2$&nbsp;(tờ)." },
{ q_title: "Câu 7", q_content: "Con heo đất của An có $15$&nbsp;nghìn đồng. Bình tiết kiệm được nhiều hơn An $8$&nbsp;nghìn đồng. Hỏi cả hai bạn tiết kiệm được tất cả bao nhiêu tiền?", options: ["A. $23$&nbsp;nghìn", "B. $7$&nbsp;nghìn", "C. $38$&nbsp;nghìn", "D. $30$&nbsp;nghìn"], correct_idx: 2, explain: "Bình tiết kiệm được: $15 + 8 = 23$&nbsp;nghìn. Cả hai bạn: $15 + 23 = 38$&nbsp;nghìn." },
{ q_title: "Câu 8", q_content: "Có bao nhiêu số có $2$&nbsp;chữ số mà chữ số hàng chục trừ đi chữ số hàng đơn vị bằng $9$?", options: ["A. $1$&nbsp;số", "B. $2$&nbsp;số", "C. $9$&nbsp;số", "D. $10$&nbsp;số"], correct_idx: 0, explain: "Chữ số hàng chục trừ hàng đơn vị bằng $9$, chỉ có duy nhất cặp số $9 - 0 = 9$. Vậy chỉ có $1$&nbsp;số là $90$." },
{ q_title: "Câu 9", q_content: "Tháng $11$&nbsp;có $30$&nbsp;ngày. Hỏi $\\frac{1}{3}$ số ngày của tháng $11$&nbsp;là bao nhiêu ngày?", options: ["A. $15$&nbsp;ngày", "B. $10$&nbsp;ngày", "C. $3$&nbsp;ngày", "D. $5$&nbsp;ngày"], correct_idx: 1, explain: "$\\frac{1}{3}$ số ngày của tháng $11$&nbsp;là: $30 : 3 = 10$&nbsp;(ngày)." },
{ q_title: "Câu 10", q_content: "Trong một khu vườn, bác nông dân đếm được có $3$&nbsp;con bò và một số con đà điểu. Tổng số chân của bò và đà điểu trong vườn là $18$&nbsp;cái chân. Hỏi trong vườn có bao nhiêu con đà điểu?", options: ["A. $3$&nbsp;con", "B. $6$&nbsp;con", "C. $2$&nbsp;con", "D. $4$&nbsp;con"], correct_idx: 0, explain: "Số chân của bò là: $4 \\times 3 = 12$&nbsp;(chân). Số chân đà điểu: $18 - 12 = 6$&nbsp;(chân). Số con đà điểu: $6 : 2 = 3$&nbsp;(con)." },
{ q_title: "Câu 11", q_content: "Một cuốn truyện tranh mỏng có $40$&nbsp;trang (từ trang $1$&nbsp;đến trang $40$). Hỏi để đánh số trang cho cuốn truyện này, người ta phải dùng bao nhiêu lần chữ số $3$?", options: ["A. $13$&nbsp;lần", "B. $4$&nbsp;lần", "C. $14$&nbsp;lần", "D. $12$&nbsp;lần"], correct_idx: 2, explain: "Số $3$&nbsp;ở hàng đơn vị: $3, 13, 23, 33$ ($4$&nbsp;lần). Số $3$&nbsp;ở hàng chục: từ $30$&nbsp;đến $39$ ($10$&nbsp;lần). Tổng = $4 + 10 = 14$&nbsp;lần. Bẫy số $33$&nbsp;xuất hiện $2$&nbsp;lần." },
{ q_title: "Câu 12", q_content: "Lớp 2A xếp thành một hàng dọc để vào lớp. Bạn Nam đứng trong hàng, đằng trước Nam có $5$&nbsp;bạn. Số bạn đứng đằng sau Nam gấp đôi số bạn đứng đằng trước Nam. Hỏi hàng dọc của lớp 2A có tất cả bao nhiêu bạn?", options: ["A. $15$&nbsp;bạn", "B. $16$&nbsp;bạn", "C. $10$&nbsp;bạn", "D. $11$&nbsp;bạn"], correct_idx: 1, explain: "Đằng sau Nam có: $5 \\times 2 = 10$&nbsp;bạn. Tổng số = $5$&nbsp;(trước) + $1$&nbsp;(Nam) + $10$&nbsp;(sau) = $16$&nbsp;bạn." }

{ t_title: "Bài 1", t_content: "Tính nhanh: <div class='text-center text-xl my-4'>$38 + 17 + 22 + 13$</div>", strategy: "WHAT (Quan sát số tận cùng): Dãy có $4$&nbsp;số, ta để ý các chữ số hàng đơn vị: $8, 7, 2, 3$.<br>HOW (Gom nhóm): Cặp nào cộng lại tròn chục? Số $8$&nbsp;đi với $2$, số $7$&nbsp;đi với $3$.<br>- Nhóm 1: $38 + 22 = 60$<br>- Nhóm 2: $17 + 13 = 30$<br>WHY (Tính tổng cuối): Khi đã thành số tròn chục, phép cộng trở nên đơn giản: $60 + 30 = 90$.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>$38 + 17 + 22 + 13$</div><div>$= (38 + 22) + (17 + 13)$</div><div>$= 60 + 30$</div><div>$= 90$</div>" },
{ t_title: "Bài 2", t_content: "Trong kho có một bao gạo rất to không ghi số ki-lô-gam. Bác bảo vệ có một chiếc cân đĩa thăng bằng (loại cân có $2$&nbsp;đĩa hai bên) cùng với hai quả cân loại $2\\text{kg}$ và $5\\text{kg}$. Bằng đúng <strong>một lần cân</strong>, em hãy chỉ cách giúp bác bảo vệ lấy ra được đúng $3\\text{kg}$ gạo từ bao gạo to đó.", strategy: "WHAT (Phân tích công cụ): Chúng ta có đĩa cân $2$&nbsp;bên. Có $1$&nbsp;quả $5\\text{kg}$ và $1$&nbsp;quả $2\\text{kg}$. Mục tiêu là tạo ra khoảng chênh lệch đúng $3\\text{kg}$.<br>WHY (Tìm liên kết): Tại sao lại là $3\\text{kg}$? Học sinh cần nhìn ra mối quan hệ: $5 - 2 = 3$.<br>HOW (Bố trí cân): Làm thế nào để lấy số lớn trừ số bé trên cân đĩa? Ta phải đặt chúng ở hai bên đĩa cân khác nhau. Đặt quả $5\\text{kg}$ ở đĩa bên trái, quả $2\\text{kg}$ ở đĩa bên phải.<br>WHAT NEXT (Thực thi): Đĩa bên trái đang nặng hơn đĩa bên phải $3\\text{kg}$. Đổ dần gạo từ bao to vào đĩa bên phải (cùng phía với quả cân $2\\text{kg}$) cho đến khi kim cân chỉ ở mức thăng bằng. Lượng gạo vừa đổ vào chính là $3\\text{kg}$.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Ta thấy $5\\text{kg} - 2\\text{kg} = 3\\text{kg}$. Để lấy được $3\\text{kg}$ gạo bằng một lần cân, bác bảo vệ làm như sau:</div><div><strong>Bước 1:</strong> Đặt quả cân $5\\text{kg}$ lên một đĩa cân (gọi là đĩa bên trái).</div><div><strong>Bước 2:</strong> Đặt quả cân $2\\text{kg}$ lên đĩa cân còn lại (gọi là đĩa bên phải).</div><div><strong>Bước 3:</strong> Đổ từ từ gạo từ bao to vào đĩa cân bên phải (cùng bên với quả cân $2\\text{kg}$) cho đến khi cán cân thăng bằng. Lượng gạo nằm trên đĩa cân bên phải lúc này chính là đúng $3\\text{kg}$.</div>" },
{ t_title: "Bài 3", t_content: "An và Bình có tổng cộng $30$&nbsp;viên bi. Nếu An cho Bình $5$&nbsp;viên bi thì tổng số bi của cả hai bạn bây giờ là bao nhiêu viên? Vì sao?", strategy: "WHAT (Nhận diện bẫy): Rất nhiều học sinh sẽ dùng phép tính $30 - 5 = 25$ hoặc $30 + 5 = 35$ vì thấy chữ 'cho'.<br>WHO (Xác định luồng di chuyển): Số bi đi từ đâu đến đâu? Đi từ túi của An sang túi của Bình.<br>WHERE (Giới hạn hệ thống): Hai bạn có vứt bi đi không? Không. Có ai cho thêm bi từ bên ngoài vào không? Không.<br>WHY (Kết luận bất biến): Bi chỉ luân chuyển TỪ NGƯỜI NÀY SANG NGƯỜI KIA trong cùng một nhóm. Giống như chuyển đồ từ tay trái sang tay phải. Do đó, <strong>TỔNG</strong> số bi của cả hai bạn không hề thay đổi.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Vì An cho Bình $5$&nbsp;viên bi, nghĩa là số bi chỉ di chuyển từ bạn này sang bạn kia chứ không bị mất đi đâu và cũng không có thêm bi từ bên ngoài vào. Do đó, tổng số bi của cả hai bạn là không thay đổi.</div><div>Tổng số bi của cả hai bạn lúc này vẫn là <strong>$30$&nbsp;viên bi</strong>.</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $30$&nbsp;viên bi.</span></div>" },
{ t_title: "Bài 4", t_content: "Người ta muốn trồng cây hoa dọc theo một đoạn đường thẳng dài $30\\text{m}$. Cứ $5\\text{m}$ người ta lại trồng một cây hoa. Biết rằng người ta chỉ trồng cây ở một đầu đường, đầu còn lại là cổng nhà nên không thể trồng cây. Hỏi người ta đã trồng tất cả bao nhiêu cây hoa?", strategy: "WHAT (Hình dung bài toán): Đoạn đường $30\\text{m}$, mỗi khoảng $5\\text{m}$. Đoạn thẳng bị chặn $1$&nbsp;đầu (cổng nhà) và trồng $1$&nbsp;đầu.<br>HOW (Đếm số khoảng): Tính xem đoạn đường $30\\text{m}$ chia được thành bao nhiêu khoảng cách $5\\text{m}$? (Lấy $30 : 5 = 6$&nbsp;khoảng).<br>WHY (Sự tương ứng 1-1): Giả sử mỗi khoảng đi kèm với $1$&nbsp;cái cây đứng ở đầu khoảng. Vì chỉ trồng ở một đầu đường và bỏ đầu kia, nên số cây sẽ bằng đúng số khoảng cách.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Số khoảng cách dài $5\\text{m}$ trên đoạn đường dài $30\\text{m}$ là:</div><div>$30 : 5 = 6$&nbsp;(khoảng cách)</div><div>Vì người ta chỉ trồng cây ở một đầu đường và đầu còn lại là cổng nhà (không trồng) nên số cây bằng đúng số khoảng cách. Vậy người ta đã trồng tất cả số cây hoa là: <strong>$6$&nbsp;cây</strong>.</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $6$&nbsp;cây.</span></div>" },
{ t_title: "Bài 5", t_content: "Ở cửa hàng cá cảnh, bể A đang có $18$&nbsp;con cá, bể B đang có $6$&nbsp;con cá. Hỏi bác chủ cửa hàng phải chuyển bao nhiêu con cá từ bể A sang bể B để số cá ở hai bể bằng nhau?", strategy: "WHAT (Tìm điểm cân bằng): Hiện tại bể A có $18$&nbsp;con, bể B có $6$&nbsp;con. Muốn hai bể bằng nhau thì tổng số cá phải được chia đôi.<br>HOW (Tính tổng và chia): Tổng số cá ở cả hai bể là bao nhiêu? ($18 + 6 = 24$&nbsp;con).<br>WHAT NEXT (Tính số cá mỗi bể lúc sau): Để hai bể bằng nhau, mỗi bể phải có: $24 : 2 = 12$&nbsp;con.<br>WHY (Tìm lượng dịch chuyển): Bể A đang có $18$&nbsp;con, muốn giảm xuống còn $12$&nbsp;con thì bể A phải chuyển đi bao nhiêu con? Lấy $18 - 12 = 6$&nbsp;con. (Hoặc bể B có $6$&nbsp;con, muốn lên $12$&nbsp;con thì nhận thêm $6$&nbsp;con).", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Tổng số cá ở cả hai bể là:</div><div>$18 + 6 = 24$&nbsp;(con cá)</div><div>Để số cá ở hai bể bằng nhau thì sau khi chuyển, mỗi bể phải có số cá là:</div><div>$24 : 2 = 12$&nbsp;(con cá)</div><div>Lúc đầu bể A có $18$&nbsp;con cá, lúc sau còn $12$&nbsp;con. Vậy số cá phải chuyển từ bể A sang bể B là:</div><div>$18 - 12 = 6$&nbsp;(con cá)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $6$&nbsp;con cá.</span></div>" },
{ t_title: "Bài 6", t_content: "Bạn Mai có một sợi dây nilon dài. Mai gập sợi dây đó làm $3$&nbsp;phần bằng nhau (gấp lại thành hình chữ Z dẹt). Sau đó, Mai dùng kéo cắt một nhát thẳng qua chính giữa đoạn dây đã gập. Hỏi lúc này, sợi dây nilon sẽ bị đứt thành bao nhiêu đoạn nhỏ? (Em hãy giải thích cách cắt).", strategy: "WHAT (Mô phỏng 3D/2D): Gập dây làm $3$&nbsp;nghĩa là sợi dây sẽ bị xếp chồng lên nhau thành $3$&nbsp;lớp (như chữ Z bị ép bẹp xuống).<br>HOW (Phân tích nhát cắt): Khi kéo cắt thẳng qua chính giữa đoạn dây đã gập, nhát kéo đó sẽ cắt qua MẤY lớp dây? Nó cắt qua cả $3$&nbsp;lớp dây.<br>WHY (Giải phẫu kết quả): Hãy tưởng tượng đầu dây và cuối dây.<br>- Nhát cắt đi qua $3$&nbsp;lớp, tạo ra tổng cộng $6$&nbsp;'mặt cắt'.<br>- Phần dây bị gập ở $2$&nbsp;mép biên sẽ tạo thành $2$&nbsp;đoạn cong (như chữ U).<br>- $2$&nbsp;đầu dây tự do lúc đầu sẽ tạo thành $2$&nbsp;đoạn thẳng rời rạc ngắn.<br>- Tổng cộng: $2$&nbsp;đoạn ngắn ở hai đầu + $2$&nbsp;đoạn cong gập chữ U = $4$&nbsp;đoạn dây.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Khi gập sợi dây làm $3$&nbsp;phần bằng nhau, sợi dây sẽ tạo thành $3$&nbsp;lớp chồng lên nhau với $2$&nbsp;nếp gấp ở hai đầu.</div><div>Khi dùng kéo cắt một nhát thẳng qua phần giữa của sợi dây đã gập, nhát kéo sẽ cắt đứt cả $3$&nbsp;lớp dây này.</div><div>Lúc này, phần ở hai nếp gấp sẽ trở thành $2$&nbsp;đoạn dây ngắn (hình chữ U).</div><div>Cộng với $2$&nbsp;phần dây nối với $2$&nbsp;đầu dây ban đầu tạo thành $2$&nbsp;đoạn dây ngắn nữa.</div><div>Vậy sợi dây nilon sẽ bị đứt thành:</div><div>$2 + 2 = 4$&nbsp;(đoạn nhỏ).</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $4$&nbsp;đoạn nhỏ.</span></div>" }
]
});

trac_nghiem: [
{ q_title: "Câu 1", q_content: "Hình tam giác có $3$&nbsp;cạnh dài bằng nhau, mỗi cạnh dài $8\\text{cm}$. Chu vi của hình tam giác đó là:", options: ["A. $11\\text{ cm}$", "B. $16\\text{ cm}$", "C. $24\\text{ cm}$", "D. $32\\text{ cm}$"], correct_idx: 2, explain: "Chu vi hình tam giác là tổng độ dài $3$&nbsp;cạnh. $8 + 8 + 8 = 24\\text{ (cm)}$ hoặc $8 \\times 3 = 24\\text{ (cm)}$." },
{ q_title: "Câu 2", q_content: "Số hạng thứ nhất là số chẵn lớn nhất có một chữ số. Tổng là $50$. Số hạng thứ hai là:", options: ["A. $41$", "B. $42$", "C. $58$", "D. $59$"], correct_idx: 1, explain: "Số chẵn lớn nhất có $1$&nbsp;chữ số là $8$. Số hạng thứ hai là: $50 - 8 = 42$." },
{ q_title: "Câu 3", q_content: "Hôm nay là thứ Năm. Hỏi $10$&nbsp;ngày nữa là thứ mấy?", options: ["A. Thứ Sáu", "B. Thứ Bảy", "C. Chủ Nhật", "D. Thứ Hai"], correct_idx: 2, explain: "$7$&nbsp;ngày nữa vẫn là thứ Năm. Vậy $10$&nbsp;ngày nữa (thêm $3$&nbsp;ngày sau thứ Năm) là thứ Sáu, thứ Bảy, Chủ Nhật." },
{ q_title: "Câu 4", q_content: "Có một thanh gỗ dài $20\\text{dm}$. Bác thợ mộc cưa thanh gỗ đó thành các đoạn, mỗi đoạn dài $4\\text{dm}$. Hỏi bác thợ mộc phải cưa bao nhiêu nhát? (Biết mỗi nhát cưa đứt hẳn thanh gỗ).", options: ["A. $5$&nbsp;nhát", "B. $4$&nbsp;nhát", "C. $6$&nbsp;nhát", "D. $24$&nbsp;nhát"], correct_idx: 1, explain: "Số đoạn gỗ cưa được là: $20 : 4 = 5$&nbsp;(đoạn). Số nhát cưa bằng số đoạn trừ $1$: $5 - 1 = 4$&nbsp;(nhát)." },
{ q_title: "Câu 5", q_content: "Tìm $x$, biết: $85 - x = 20 + 15$", options: ["A. $x = 50$", "B. $x = 100$", "C. $x = 120$", "D. $x = 40$"], correct_idx: 0, explain: "$20 + 15 = 35$. $85 - x = 35$, suy ra $x = 85 - 35 = 50$." },
{ q_title: "Câu 6", q_content: "Bố hơn con $28$&nbsp;tuổi. Ba năm nữa, bố hơn con bao nhiêu tuổi?", options: ["A. $25$&nbsp;tuổi", "B. $31$&nbsp;tuổi", "C. $28$&nbsp;tuổi", "D. $34$&nbsp;tuổi"], correct_idx: 2, explain: "Hiệu số tuổi luôn không đổi theo thời gian. Ba năm nữa bố vẫn hơn con $28$&nbsp;tuổi." },
{ q_title: "Câu 7", q_content: "Một rổ có $45$&nbsp;quả táo. Mẹ lấy ra $\\frac{1}{5}$ số táo trong rổ để mang biếu bà. Số táo còn lại trong rổ là:", options: ["A. $9$&nbsp;quả", "B. $36$&nbsp;quả", "C. $40$&nbsp;quả", "D. $50$&nbsp;quả"], correct_idx: 1, explain: "Số táo biếu bà là: $45 : 5 = 9$&nbsp;(quả). Số táo còn lại: $45 - 9 = 36$&nbsp;(quả)." },
{ q_title: "Câu 8", q_content: "Cho dãy số: $3, 7, 11, 15, \\dots$ Số tiếp theo điền vào chỗ chấm là:", options: ["A. $16$", "B. $18$", "C. $19$", "D. $20$"], correct_idx: 2, explain: "Quy luật dãy số là cộng thêm $4$: $3+4=7, 7+4=11, 11+4=15$. Số tiếp theo là $15 + 4 = 19$." },
{ q_title: "Câu 9", q_content: "Trong một cái hộp kín có $7$&nbsp;quả bóng đỏ và $5$&nbsp;quả bóng xanh. Minh nhắm mắt bốc bóng ra khỏi hộp. Hỏi Minh phải bốc ít nhất bao nhiêu quả bóng để chắc chắn trong số những quả bóng bốc ra có ít nhất $1$&nbsp;quả bóng xanh?", options: ["A. $1$&nbsp;quả", "B. $6$&nbsp;quả", "C. $8$&nbsp;quả", "D. $12$&nbsp;quả"], correct_idx: 2, explain: "Trường hợp xấu nhất là bốc toàn bóng đỏ ($7$&nbsp;quả). Để chắc chắn có $1$&nbsp;quả xanh, cần bốc thêm $1$&nbsp;quả nữa, tổng cộng là $7 + 1 = 8$&nbsp;(quả)." },
{ q_title: "Câu 10", q_content: "An có $12$&nbsp;viên kẹo, Bình có $8$&nbsp;viên kẹo. An cho Bình một số viên kẹo thì số kẹo của hai bạn bằng nhau. Hỏi An đã cho Bình bao nhiêu viên kẹo?", options: ["A. $4$&nbsp;viên", "B. $2$&nbsp;viên", "C. $10$&nbsp;viên", "D. $6$&nbsp;viên"], correct_idx: 1, explain: "Tổng số kẹo hai bạn có là: $12 + 8 = 20$&nbsp;(viên). Khi bằng nhau, mỗi bạn có: $20 : 2 = 10$&nbsp;(viên). An đã cho Bình: $12 - 10 = 2$&nbsp;(viên)." },
{ q_title: "Câu 11", q_content: "Tổng của hai số là $35$. Nếu tăng số hạng thứ nhất thêm $5$&nbsp;đơn vị và giảm số hạng thứ hai đi $2$&nbsp;đơn vị thì tổng mới là bao nhiêu?", options: ["A. $38$", "B. $32$", "C. $42$", "D. $40$"], correct_idx: 0, explain: "Tổng mới = $35 + 5 - 2 = 38$." },
{ q_title: "Câu 12", q_content: "Quan sát một khối rubik 3x3x3 (gồm $27$&nbsp;khối lập phương nhỏ). Nếu ta nhúng toàn bộ khối rubik này vào một thùng sơn màu xanh, hỏi có bao nhiêu khối lập phương nhỏ không bị dính sơn mặt nào?", options: ["A. $1$&nbsp;khối", "B. $8$&nbsp;khối", "C. $0$&nbsp;khối", "D. $27$&nbsp;khối"], correct_idx: 0, explain: "Khối lập phương nhỏ nằm chính giữa tâm của khối rubik 3x3x3 sẽ bị các khối khác che khuất hoàn toàn, nên không bị dính sơn mặt nào. Chỉ có duy nhất $1$&nbsp;khối như vậy." }

{ t_title: "Bài 1", t_content: "Tính nhanh: <div class='text-center text-xl my-4'>$89 - 14 - 36 - 29$</div>", strategy: "WHAT (Quan sát các số): Đây là một chuỗi phép trừ liên tiếp. Nhìn vào các chữ số hàng đơn vị: $9, 4, 6, 9$.<br>HOW (Gom nhóm thông minh): Ta thấy có số $89$ và số $29$ có cùng đuôi $9$. Có số $14$ và $36$ mà $4+6=10$ (tròn chục). Nếu trừ liên tiếp, ta có thể đổi chỗ hoặc gom các số bị trừ lại với nhau.<br>WHY (Thực thi):<br>- Lấy $89$ trừ đi $29$ trước để được số tròn chục: $89 - 29 = 60$.<br>- Tổng phần còn phải trừ là $14$ và $36$: Ta gom chúng lại $14 + 36 = 50$.<br>- Phép tính cuối cùng: Lấy $60 - 50 = 10$.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>$89 - 14 - 36 - 29$</div><div>$= (89 - 29) - (14 + 36)$</div><div>$= 60 - 50$</div><div>$= 10$</div>" },
{ t_title: "Bài 2", t_content: "Cô giáo có một túi kẹo. Lần thứ nhất, cô chia cho các bạn $\\frac{1}{3}$ số kẹo trong túi thì được $10$&nbsp;viên kẹo. Hỏi ban đầu trong túi có tất cả bao nhiêu viên kẹo?", strategy: "WHAT (Phân tích dữ kiện): $\\frac{1}{3}$ số kẹo tương ứng với $10$&nbsp;viên.<br>HOW (Hình dung qua sơ đồ): Hãy tưởng tượng túi kẹo được chia thành $3$&nbsp;phần bằng nhau. Mỗi phần chính là $\\frac{1}{3}$ số kẹo.<br>WHY (Tính tổng): Theo đề bài, một phần đó có $10$&nbsp;viên. Vậy để tìm số kẹo của cả túi (gồm $3$&nbsp;phần như thế), ta làm thế nào? Ta lấy số lượng của một phần nhân với $3$.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Vì $\\frac{1}{3}$ số kẹo trong túi là $10$&nbsp;viên, nghĩa là nếu chia tổng số kẹo thành $3$&nbsp;phần bằng nhau thì $1$&nbsp;phần có $10$&nbsp;viên.</div><div>Vậy ban đầu trong túi có tất cả số viên kẹo là:</div><div>$10 \\times 3 = 30$&nbsp;(viên kẹo)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $30$&nbsp;viên kẹo.</span></div>" },
{ t_title: "Bài 3", t_content: "Năm nay Lan $8$&nbsp;tuổi. Chị của Lan $14$&nbsp;tuổi. Em hãy tính xem khi tuổi của chị Lan bằng tuổi Lan hiện nay thì lúc đó Lan bao nhiêu tuổi?", strategy: "WHAT (Xác định mốc thời gian): Bài toán hỏi về một thời điểm trong quá khứ ('khi tuổi chị bằng tuổi Lan hiện nay', tức là khi chị $8$&nbsp;tuổi).<br>HOW (Tìm khoảng cách thời gian): Hiện tại chị $14$&nbsp;tuổi. Để quay về mốc $8$&nbsp;tuổi, ta phải lùi lại bao nhiêu năm? ($14 - 8 = 6$&nbsp;năm trước).<br>WHY (Áp dụng cho Lan): Thời gian lùi lại đối với chị cũng chính là thời gian lùi lại đối với Lan. Sáu năm trước, chị giảm $6$&nbsp;tuổi thì Lan cũng phải giảm $6$&nbsp;tuổi.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Để tuổi của chị bằng tuổi của Lan hiện nay ($8$&nbsp;tuổi), thì thời gian lùi về quá khứ là:</div><div>$14 - 8 = 6$&nbsp;(năm trước)</div><div>Khi đó, tuổi của Lan là:</div><div>$8 - 6 = 2$&nbsp;(tuổi)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $2$&nbsp;tuổi.</span></div>" },
{ t_title: "Bài 4", t_content: "Hai anh em Hùng và Dũng đi câu cá. Hùng câu được $15$&nbsp;con cá, Dũng câu được $9$&nbsp;con cá. Trên đường về, Hùng làm rơi mất $2$&nbsp;con cá, còn Dũng lại nhặt được thêm $3$&nbsp;con cá (do người khác làm rơi). Hỏi bây giờ ai có nhiều cá hơn và nhiều hơn bao nhiêu con?", strategy: "WHO (Theo dõi từng người): Bài toán có sự thay đổi độc lập của $2$&nbsp;người. Cần tính toán số cá cuối cùng của từng bạn.<br>HOW (Tính Hùng): Hùng có $15$&nbsp;con, rơi $2$&nbsp;con. Phép tính gì? (Trừ).<br>HOW (Tính Dũng): Dũng có $9$&nbsp;con, nhặt thêm $3$&nbsp;con. Phép tính gì? (Cộng).<br>WHAT NEXT (So sánh): Đem số cá cuối cùng của Hùng và Dũng ra so sánh.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Số cá của bạn Hùng lúc sau là:</div><div>$15 - 2 = 13$&nbsp;(con cá)</div><div>Số cá của bạn Dũng lúc sau là:</div><div>$9 + 3 = 12$&nbsp;(con cá)</div><div>Vì $13 > 12$ nên lúc này bạn Hùng có nhiều cá hơn bạn Dũng. Bạn Hùng có nhiều hơn bạn Dũng số con cá là:</div><div>$13 - 12 = 1$&nbsp;(con cá)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: Bạn Hùng nhiều hơn bạn Dũng $1$&nbsp;con cá.</span></div>" },
{ t_title: "Bài 5", t_content: "Bác An có hai cái cân thăng bằng đĩa $2$&nbsp;bên. Lần 1: Bác đặt $1$&nbsp;quả dưa hấu và $1$&nbsp;quả sầu riêng lên đĩa bên trái, đặt $5$&nbsp;quả cam lên đĩa bên phải thì cân thăng bằng. Lần 2: Bác đặt $1$&nbsp;quả dưa hấu lên đĩa bên trái, đặt $1$&nbsp;quả sầu riêng và $1$&nbsp;quả cam lên đĩa bên phải thì cân thăng bằng. Hỏi $1$&nbsp;quả dưa hấu nặng bằng mấy quả cam? (Biết các quả cam nặng bằng nhau).", strategy: "WHAT (Viết thành đẳng thức để dễ nhìn):<br>- Lần 1: Dưa hấu + Sầu riêng = $5$&nbsp;Cam. (1)<br>- Lần 2: Dưa hấu = Sầu riêng + $1$&nbsp;Cam. (2)<br>HOW (Thay thế - Phương pháp khử): Bài toán muốn tìm mối quan hệ giữa Dưa hấu và Cam, tức là ta phải loại bỏ Sầu riêng. Từ (2), ta có thể rút ra Sầu riêng bằng gì? Sầu riêng = Dưa hấu - $1$&nbsp;Cam.<br>WHY (Thực hiện thay thế vào cân 1): Đem (Sầu riêng = Dưa hấu - $1$&nbsp;Cam) thay vào cân lần 1:<br>Dưa hấu + (Dưa hấu - $1$&nbsp;Cam) = $5$&nbsp;Cam.<br>$2$&nbsp;Dưa hấu - $1$&nbsp;Cam = $5$&nbsp;Cam.<br>$2$&nbsp;Dưa hấu = $5$&nbsp;Cam + $1$&nbsp;Cam.<br>$2$&nbsp;Dưa hấu = $6$&nbsp;Cam.<br>WHAT NEXT (Tính 1 quả): $2$&nbsp;Dưa hấu bằng $6$&nbsp;Cam, vậy $1$&nbsp;Dưa hấu bằng mấy Cam?", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Từ lần cân thứ hai, ta thấy: $1$&nbsp;quả dưa hấu nặng bằng $1$&nbsp;quả sầu riêng cộng với $1$&nbsp;quả cam. Suy ra: $1$&nbsp;quả sầu riêng sẽ nặng bằng $1$&nbsp;quả dưa hấu bớt đi $1$&nbsp;quả cam.</div><div>Bây giờ, ta xét lần cân thứ nhất: $1$&nbsp;quả dưa hấu và $1$&nbsp;quả sầu riêng nặng bằng $5$&nbsp;quả cam. Ta thay thế quả sầu riêng bằng ($1$&nbsp;quả dưa hấu bớt $1$&nbsp;quả cam), khi đó:</div><div>($1$&nbsp;quả dưa hấu) + ($1$&nbsp;quả dưa hấu bớt $1$&nbsp;quả cam) = $5$&nbsp;quả cam</div><div>$2$&nbsp;quả dưa hấu bớt đi $1$&nbsp;quả cam thì bằng $5$&nbsp;quả cam. Vậy $2$&nbsp;quả dưa hấu sẽ nặng bằng:</div><div>$5 + 1 = 6$&nbsp;(quả cam).</div><div>Từ đó, $1$&nbsp;quả dưa hấu nặng bằng số quả cam là:</div><div>$6 : 2 = 3$&nbsp;(quả cam).</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $3$&nbsp;quả cam.</span></div>" },
{ t_title: "Bài 6", t_content: "Trong một buổi học múa, $6$&nbsp;bạn học sinh (A, B, C, D, E, F) xếp thành một vòng tròn. Cô giáo yêu cầu đếm theo chiều kim đồng hồ bắt đầu từ bạn A (A là số $1$, B là số $2$,...). Cô giáo gọi tên bạn đếm số $20$&nbsp;bước ra khỏi vòng tròn. Theo em, bạn nào sẽ được gọi tên? Em hãy giải thích cách tìm.", strategy: "WHAT (Hình dung cấu trúc): Các bạn đứng vòng tròn tạo thành một chu kỳ lặp lại. Có $6$&nbsp;bạn, vậy $1$&nbsp;vòng (1 chu kỳ) là $6$&nbsp;số đếm.<br>HOW (Tìm quy luật đếm):<br>- Vòng 1 đếm từ $1$&nbsp;đến $6$&nbsp;(Rơi vào bạn F).<br>- Vòng 2 đếm từ $7$&nbsp;đến $12$&nbsp;(Lại rơi vào bạn F).<br>- Vòng 3 đếm từ $13$&nbsp;đến $18$&nbsp;(Vẫn rơi vào bạn F).<br>WHY (Xử lý phần dư): Số $20$&nbsp;lớn hơn $18$&nbsp;bao nhiêu đơn vị? Nó vượt qua vòng thứ 3 là $2$&nbsp;đơn vị ($20 - 18 = 2$).<br>WHAT NEXT (Kết luận): Đếm thêm $2$&nbsp;bước nữa bắt đầu từ bạn A. Bước 1 là A, bước 2 là ai? Là B.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Vì có $6$&nbsp;bạn xếp thành vòng tròn, nên khi đếm, cứ qua $6$&nbsp;số thì lại lặp lại một vòng và quay trở về bạn xuất phát (bạn A đếm số $1$, bạn F đếm số $6$). Ta thấy:</div><div>- Hết vòng 1: số $6$&nbsp;rơi vào bạn F.</div><div>- Hết vòng 2: số $6 + 6 = 12$&nbsp;rơi vào bạn F.</div><div>- Hết vòng 3: số $12 + 6 = 18$&nbsp;rơi vào bạn F.</div><div>Tiếp tục đếm số $19$&nbsp;và $20$&nbsp;cho vòng thứ tư, ta bắt đầu đếm lại từ đầu:</div><div>Số $19$&nbsp;sẽ rơi vào bạn A.</div><div>Số $20$&nbsp;sẽ rơi vào bạn B.</div><div>Vậy cô giáo gọi tên bạn đếm số $20$&nbsp;bước ra thì bạn <strong>B</strong> sẽ là người được gọi tên.</div>" }
]

{ t_title: "Bài 1", t_content: "Tính nhanh: <div class='text-center text-xl my-4'>$65 + 18 - 25 + 42$</div>", strategy: "WHAT (Tìm điểm chung): Quan sát phép tính $65 + 18 - 25 + 42$. Bạn thấy số nào đi với nhau thì tạo ra số tròn chục? (Đuôi $5$ đi với đuôi $5$, đuôi $8$ đi với đuôi $2$).<br>HOW (Gom nhóm theo tính chất):<br>- Ta có số $65$ và bị trừ đi $25$. Gom chúng lại: $(65 - 25)$.<br>- Ta có cộng $18$ và cộng $42$. Gom chúng lại: $(18 + 42)$.<br>WHY (Thực thi để thấy sự đơn giản):<br>- Nhóm 1: $65 - 25 = 40$.<br>- Nhóm 2: $18 + 42 = 60$.<br>- Lấy hai nhóm cộng lại: $40 + 60 = 100$.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>$65 + 18 - 25 + 42$</div><div>$= (65 - 25) + (18 + 42)$</div><div>$= 40 + 60$</div><div>$= 100$</div>" },
{ t_title: "Bài 2", t_content: "Cô giáo có một túi kẹo. Khi chia cho $4$&nbsp;bạn, mỗi bạn được $5$&nbsp;viên kẹo thì trong túi vẫn còn thừa lại $3$&nbsp;viên. Hỏi lúc đầu trong túi có tất cả bao nhiêu viên kẹo?", strategy: "WHAT (Xác định các thành phần kẹo): Tổng số kẹo trong túi gồm $2$&nbsp;phần: 'Phần đã chia cho các bạn' và 'Phần còn thừa lại'.<br>WHO (Phần đã chia là bao nhiêu?): Có $4$&nbsp;bạn, mỗi bạn $5$&nbsp;viên. Vậy số kẹo đã đem chia là phép tính gì? (Phép nhân: $4 \\times 5$).<br>HOW (Tìm tổng): Đem số kẹo đã chia cộng với số kẹo bị thừa lại trong túi thì sẽ ra toàn bộ số kẹo lúc đầu.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Số viên kẹo cô giáo đã chia cho $4$&nbsp;bạn là:</div><div>$5 \\times 4 = 20$&nbsp;(viên kẹo)</div><div>Lúc đầu trong túi cô giáo có tất cả số viên kẹo là:</div><div>$20 + 3 = 23$&nbsp;(viên kẹo)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $23$&nbsp;viên kẹo.</span></div>" },
{ t_title: "Bài 3", t_content: "Một khung dây đồng được uốn thành một hình tam giác có $3$&nbsp;cạnh dài bằng nhau, mỗi cạnh dài $8\\text{cm}$. Sau đó, người ta duỗi thẳng khung dây này ra và uốn lại thành một hình vuông. Hỏi mỗi cạnh của hình vuông đó dài bao nhiêu xăng-ti-mét?", strategy: "WHAT (Tìm yếu tố không đổi - Bất biến): Khi ta bóp méo, uốn hay duỗi thẳng một sợi dây thép từ hình này sang hình khác, cái gì không bao giờ thay đổi? Chính là chiều dài của toàn bộ sợi dây (tức là Chu vi).<br>HOW (Tính chu vi): Từ hình tam giác có $3$&nbsp;cạnh dài $8\\text{cm}$, chiều dài của cả khung dây là bao nhiêu? (Lấy $8 \\times 3$).<br>WHY (Tính hình vuông): Sợi dây dài đó uốn thành hình vuông. Hình vuông có $4$&nbsp;cạnh bằng nhau. Vậy để tìm $1$&nbsp;cạnh của hình vuông, ta làm thế nào với chiều dài sợi dây? (Lấy chiều dài chia cho $4$).", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Chiều dài của toàn bộ đoạn khung dây đồng (chu vi hình tam giác) là:</div><div>$8 \\times 3 = 24$&nbsp;(cm)</div><div>Khi uốn đoạn dây đồng dài $24\\text{cm}$ này thành một hình vuông thì chu vi hình vuông cũng chính là $24\\text{cm}$.</div><div>Vì hình vuông có $4$&nbsp;cạnh bằng nhau nên chiều dài mỗi cạnh của hình vuông đó là:</div><div>$24 : 4 = 6$&nbsp;(cm)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $6\\text{ cm}$.</span></div>" },
{ t_title: "Bài 4", t_content: "Hộp màu đỏ và hộp màu xanh có tổng cộng $30$&nbsp;viên bi. Nếu Nam lấy $4$&nbsp;viên bi từ hộp màu đỏ bỏ sang hộp màu xanh thì số bi ở hai hộp lúc này bằng nhau. Hỏi lúc đầu mỗi hộp có bao nhiêu viên bi?", strategy: "WHAT (Phân tích sự thay đổi): Khi lấy bi từ hộp đỏ bỏ sang hộp xanh, thì tổng số bi của cả hai hộp có thay đổi không? Không, vẫn là $30$&nbsp;viên.<br>WHY (Tính số bi lúc bằng nhau): Nếu hai hộp có số bi bằng nhau và tổng là $30$&nbsp;viên, thì lúc đó mỗi hộp sẽ có bao nhiêu viên bi? ($30 : 2 = 15$&nbsp;viên).<br>HOW (Tư duy ngược thời gian):<br>- Hộp đỏ sau khi 'bị lấy đi $4$&nbsp;viên' thì còn $15$&nbsp;viên. Vậy lúc đầu hộp đỏ có bao nhiêu? (Làm phép cộng: $15 + 4$).<br>- Hộp xanh sau khi 'được nhận thêm $4$&nbsp;viên' thì có $15$&nbsp;viên. Vậy lúc đầu hộp xanh có bao nhiêu? (Làm phép trừ: $15 - 4$).", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Khi chuyển bi từ hộp đỏ sang hộp xanh thì tổng số bi của hai hộp không thay đổi và vẫn là $30$&nbsp;viên.</div><div>Lúc sau, hai hộp có số bi bằng nhau nên số bi ở mỗi hộp lúc sau là:</div><div>$30 : 2 = 15$&nbsp;(viên bi)</div><div>Lúc đầu hộp màu đỏ có số viên bi là:</div><div>$15 + 4 = 19$&nbsp;(viên bi)</div><div>Lúc đầu hộp màu xanh có số viên bi là:</div><div>$15 - 4 = 11$&nbsp;(viên bi)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: Hộp đỏ: $19$&nbsp;viên bi; Hộp xanh: $11$&nbsp;viên bi.</span></div>" },
{ t_title: "Bài 5", t_content: "Đồng hồ treo tường nhà An đang chỉ $8$&nbsp;giờ $15$&nbsp;phút. Tuy nhiên, thời gian thực tế lúc đó đúng $8$&nbsp;giờ. Hãy cho biết đồng hồ nhà An đang chạy nhanh hay chạy chậm bao nhiêu phút? Nếu tivi thông báo bộ phim hoạt hình yêu thích bắt đầu chiếu lúc $9$&nbsp;giờ $30$&nbsp;phút, thì lúc bộ phim chiếu, đồng hồ nhà An sẽ chỉ mấy giờ?", strategy: "WHAT (So sánh và kết luận): Thực tế mới chỉ có 8:00, nhưng đồng hồ nhà An đã chạy tít lên 8:15. Vậy đồng hồ đang chỉ số giờ lớn hơn hay bé hơn giờ thật? (Lớn hơn). Do đó, đồng hồ đang chạy NHANH.<br>HOW (Nhanh bao nhiêu): Lấy $8$&nbsp;giờ $15$&nbsp;phút trừ đi $8$&nbsp;giờ đúng, khoảng chênh lệch là $15$&nbsp;phút. Tức là đồng hồ luôn 'cộng thêm' $15$&nbsp;phút so với thực tế.<br>WHEN (Áp dụng cho tương lai): Khi tivi chiếu phim lúc $9$&nbsp;giờ $30$&nbsp;phút đúng, đồng hồ nhà An với thói quen chạy nhanh $15$&nbsp;phút sẽ chỉ mấy giờ? Ta lấy thời gian thực tế cộng thêm $15$&nbsp;phút dư ra.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Thực tế là $8$&nbsp;giờ nhưng đồng hồ đã chỉ $8$&nbsp;giờ $15$&nbsp;phút. Vậy đồng hồ nhà An đang <strong>chạy nhanh</strong> khoảng thời gian là: $15$&nbsp;phút.</div><div>Khi bộ phim bắt đầu chiếu (lúc $9$&nbsp;giờ $30$&nbsp;phút thực tế), vì đồng hồ chạy nhanh $15$&nbsp;phút nên đồng hồ nhà An lúc đó sẽ chỉ:</div><div>$9$&nbsp;giờ $30$&nbsp;phút + $15$&nbsp;phút = <strong>$9$&nbsp;giờ $45$&nbsp;phút</strong>.</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: Chạy nhanh $15$&nbsp;phút; Lúc đó chỉ $9$&nbsp;giờ $45$&nbsp;phút.</span></div>" },
{ t_title: "Bài 6", t_content: "Nam có một băng giấy dài. Lần thứ nhất, Nam cắt băng giấy đó thành $5$&nbsp;đoạn nhỏ. Lần thứ hai, Nam lấy ra $2$&nbsp;đoạn bất kỳ trong số đó, rồi lại cắt mỗi đoạn này thành $3$&nbsp;đoạn ngắn hơn. Hỏi sau hai lần cắt, Nam có tất cả bao nhiêu đoạn giấy? (Giải thích cách đếm của em).", strategy: "WHAT (Hình dung quá trình): Đừng nhầm lẫn với số nhát cắt. Hãy theo dõi số lượng các 'đoạn giấy'.<br>HOW (Phân tích theo từng bước):<br>- Ban đầu cắt $1$&nbsp;băng giấy thành $5$&nbsp;đoạn nhỏ. Ta đang cầm trên tay $5$&nbsp;đoạn.<br>- Lấy $2$&nbsp;đoạn trong số đó đi cắt. Nghĩa là trong $5$&nbsp;đoạn, ta để lại mấy đoạn nguyên vẹn không đụng tới? ($5 - 2 = 3$&nbsp;đoạn).<br>- Lấy $2$&nbsp;đoạn kia đem cắt, mỗi đoạn biến thành $3$&nbsp;đoạn ngắn hơn. Vậy $2$&nbsp;đoạn đó sẽ tạo ra bao nhiêu đoạn mới? ($2 \\times 3 = 6$&nbsp;đoạn).<br>WHY (Tổng kết): Số đoạn giấy cuối cùng bao gồm những đoạn không bị cắt ($3$&nbsp;đoạn) và những đoạn mới sinh ra từ việc cắt ($6$&nbsp;đoạn). Cộng chúng lại.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Lần thứ nhất, băng giấy được cắt ra làm $5$&nbsp;đoạn.</div><div>Khi Nam lấy $2$&nbsp;đoạn ra để cắt tiếp, số đoạn giấy nguyên vẹn không bị cắt lần thứ hai là:</div><div>$5 - 2 = 3$&nbsp;(đoạn)</div><div>Mỗi đoạn bị đem đi cắt tạo thành $3$&nbsp;đoạn ngắn hơn, vậy $2$&nbsp;đoạn bị cắt sẽ tạo ra số đoạn mới là:</div><div>$2 \\times 3 = 6$&nbsp;(đoạn mới)</div><div>Cuối cùng, tổng số đoạn giấy Nam có được là tổng của các đoạn nguyên vẹn và các đoạn mới:</div><div>$3 + 6 = 9$&nbsp;(đoạn giấy)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $9$&nbsp;đoạn giấy.</span></div>" }
]
});

{ q_title: "Câu 5", q_content: "Lan có $35$&nbsp;viên bi. Lan cho Mai $10$&nbsp;viên thì lúc này hai bạn có số bi bằng nhau. Hỏi lúc đầu Mai có bao nhiêu viên bi?", options: ["A. $25$&nbsp;viên", "B. $45$&nbsp;viên", "C. $15$&nbsp;viên", "D. $20$&nbsp;viên"], correct_idx: 2, explain: "Sau khi cho $10$&nbsp;viên, Lan còn $35 - 10 = 25$&nbsp;(viên). Lúc này số bi của hai bạn bằng nhau nên Mai cũng có $25$&nbsp;viên. Lúc đầu Mai có $25 - 10 = 15$&nbsp;(viên)." },

{ q_title: "Câu 10", q_content: "Hiện nay, tổng số tuổi của hai anh em là $15$&nbsp;tuổi. Hỏi $3$&nbsp;năm trước, tổng số tuổi của hai anh em là bao nhiêu?", options: ["A. $12$&nbsp;tuổi", "B. $9$&nbsp;tuổi", "C. $21$&nbsp;tuổi", "D. $6$&nbsp;tuổi"], correct_idx: 1, explain: "3 năm trước, mỗi người giảm 3 tuổi. 2 người giảm 6 tuổi. $15 - 6 = 9$&nbsp;(tuổi)." },
{ q_title: "Câu 11", q_content: "Ở một cửa hàng, $1$&nbsp;túi gạo cân nặng bằng $2$&nbsp;túi đậu. Trong khi đó, $3$&nbsp;túi đậu cân nặng bằng $6$&nbsp;túi đường. Hỏi $1$&nbsp;túi gạo nặng bằng mấy túi đường? (Biết các túi cùng loại nặng bằng nhau).", options: ["A. $8$&nbsp;túi", "B. $3$&nbsp;túi", "C. $6$&nbsp;túi", "D. $4$&nbsp;túi"], correct_idx: 3, explain: "$3$&nbsp;đậu = $6$&nbsp;đường $\\rightarrow 1$&nbsp;đậu = $2$&nbsp;đường. $1$&nbsp;gạo = $2$&nbsp;đậu = $2 \\times 2 = 4$&nbsp;đường." },

{ t_title: "Bài 1", t_content: "Tính nhanh: <div class='text-center text-xl my-4'>$68 + 19 + 32 - 9$</div>", strategy: "WHAT (Tìm điểm tương đồng): Trong dãy tính $68 + 19 + 32 - 9$, ta quan sát thấy cặp nào tạo ra số tròn chục? Số có đuôi $8$ đi với đuôi $2$. Số có đuôi $9$ (mang dấu cộng) đi với số $9$ (mang dấu trừ).<br>HOW (Gom nhóm):<br>- Đóng ngoặc phép cộng tròn chục: $(68 + 32)$.<br>- Đóng ngoặc phép trừ tạo số tròn chục: $(19 - 9)$.<br>WHY (Thực thi):<br>- $68 + 32 = 100$.<br>- $19 - 9 = 10$.<br>- Cộng 2 kết quả lại: $100 + 10 = 110$.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>$68 + 19 + 32 - 9$</div><div>$= (68 + 32) + (19 - 9)$</div><div>$= 100 + 10$</div><div>$= 110$</div>" },
{ t_title: "Bài 2", t_content: "Nhà trường trồng các cây cờ hai bên lề của một đoạn đường thẳng dài $20$&nbsp;mét để chào mừng ngày lễ. Biết rằng cứ cách $5$&nbsp;mét lại có một cây cờ và ở cả hai đầu đoạn đường đều được cắm cờ. Hỏi nhà trường đã cắm tất cả bao nhiêu cây cờ trên đoạn đường đó?", strategy: "WHAT (Tìm số khoảng cách): Đoạn đường dài $20\\text{m}$, mỗi khoảng cách dài $5\\text{m}$. Vậy có bao nhiêu khoảng cách? ($20 : 5 = 4$&nbsp;khoảng).<br>HOW (Số cờ ở 1 bên đường): Trồng ở cả $2$&nbsp;đầu đường, vậy quy luật là 'Số cây = Số khoảng + 1'. Một lề đường sẽ có bao nhiêu lá cờ? ($4 + 1 = 5$&nbsp;lá).<br>WHERE (Bẫy vị trí): Đề bài hỏi cắm cờ ở HAI BÊN lề đường chứ không phải một bên. Vậy tổng số cờ phải làm phép tính gì? (Nhân 2).", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Số khoảng cách giữa các cây cờ trên lề đường là:</div><div>$20 : 5 = 4$&nbsp;(khoảng cách)</div><div>Vì cờ được cắm ở cả hai đầu đoạn đường nên số cờ cắm ở MỘT BÊN lề đường là:</div><div>$4 + 1 = 5$&nbsp;(cây cờ)</div><div>Tổng số cờ được nhà trường cắm ở cả HAI BÊN lề đường là:</div><div>$5 \\times 2 = 10$&nbsp;(cây cờ)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $10$&nbsp;cây cờ.</span></div>" },
{ t_title: "Bài 3", t_content: "Bạn Nam có $6$&nbsp;mảnh bìa hình vuông nhỏ giống hệt nhau, mỗi mảnh có cạnh dài $2\\text{cm}$. Nam xếp sát $6$&nbsp;mảnh bìa này thành một hàng ngang để tạo thành một hình chữ nhật dài. Hãy tính chu vi của hình chữ nhật dài đó.", strategy: "WHAT (Hình dung cấu trúc): Xếp $6$&nbsp;hình vuông nhỏ (cạnh $2\\text{cm}$) sát nhau thành $1$&nbsp;hàng. Hình chữ nhật mới tạo thành có chiều dài và chiều rộng ra sao?<br>HOW (Tính kích thước mới):<br>- Chiều rộng của hình chữ nhật có bị dài ra không? Không, nó vẫn chính là cạnh của $1$&nbsp;hình vuông nhỏ ($2\\text{cm}$).<br>- Chiều dài của hình chữ nhật mới gồm mấy cạnh hình vuông ghép lại? ($6$&nbsp;cạnh). Chiều dài là bao nhiêu? ($6 \\times 2 = 12\\text{cm}$).<br>WHY (Tính chu vi): Chu vi là đường bao quanh hình chữ nhật, gồm $2$&nbsp;chiều dài và $2$&nbsp;chiều rộng. Lấy $(12 + 2) \\times 2$ hoặc cộng lần lượt $4$&nbsp;cạnh.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Khi xếp sát $6$&nbsp;hình vuông nhỏ (cạnh $2\\text{cm}$) thành một hàng ngang, chiều rộng của hình chữ nhật mới vẫn giữ nguyên là $2\\text{cm}$.</div><div>Chiều dài của hình chữ nhật mới tạo thành là:</div><div>$2 \\times 6 = 12$&nbsp;(cm)</div><div>Chu vi của hình chữ nhật dài đó là:</div><div>$12 + 12 + 2 + 2 = 28$&nbsp;(cm)</div><div>*(Hoặc học sinh làm: $(12 + 2) \\times 2 = 28\\text{ cm}$)*</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $28\\text{ cm}$.</span></div>" },
{ t_title: "Bài 4", t_content: "Trong ngăn kéo tủ của Tí có $8$&nbsp;chiếc tất màu xanh và $6$&nbsp;chiếc tất màu đỏ (tất cả đều bị trộn lẫn). Cúp điện tối thui, Tí phải thò tay vào ngăn kéo lấy tất. Hỏi Tí phải lấy ra ít nhất bao nhiêu chiếc tất để chắc chắn có được MỘT ĐÔI tất ($2$&nbsp;chiếc) CÙNG MÀU đi học? Giải thích tại sao?", strategy: "WHAT (Mục tiêu là gì?): Tí cần đúng $2$&nbsp;chiếc tất có MÀU GIỐNG NHAU. Không quan trọng là đôi màu xanh hay đôi màu đỏ.<br>WHO (Đóng vai người xui xẻo nhất): Nguyên lý bốc đồ rủi ro là hãy nghĩ đến tình huống đen đủi nhất.<br>- Lần 1: Bốc $1$&nbsp;chiếc, giả sử ra màu Xanh.<br>- Lần 2: Rất muốn $1$&nbsp;chiếc Xanh nữa cho đủ đôi, nhưng xui xẻo lại bốc nhầm chiếc màu Đỏ. Lúc này trên tay đang cầm: $1$&nbsp;Xanh, $1$&nbsp;Đỏ (Vẫn chưa có đôi nào).<br>WHEN (Khi nào thì chắc chắn thắng?): Lần bốc thứ 3. Dù chiếc thứ 3 bốc lên là màu Xanh hay màu Đỏ, nó đều sẽ ghép với $1$&nbsp;trong $2$&nbsp;chiếc đang có trên tay để tạo thành một đôi cùng màu. Vậy $3$&nbsp;là số tối thiểu.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Trường hợp Tí bốc thiếu may mắn nhất là lần lượt bốc ra các chiếc tất khác màu nhau.</div><div>Lần thứ nhất bốc được $1$&nbsp;chiếc màu Xanh.</div><div>Lần thứ hai bốc được $1$&nbsp;chiếc màu Đỏ. Lúc này trên tay Tí có $2$&nbsp;chiếc tất nhưng khác màu nhau ($1$&nbsp;Xanh, $1$&nbsp;Đỏ).</div><div>Tuy nhiên, khi Tí bốc thêm chiếc tất thứ 3, thì chiếc tất này chắc chắn sẽ phải là màu Xanh hoặc màu Đỏ. Nó sẽ ghép cặp với chiếc tất cùng màu đang có sẵn trên tay Tí để tạo thành đúng một đôi.</div><div>Vậy Tí cần bốc ra ít nhất <strong>$3$&nbsp;chiếc tất</strong> để chắc chắn có một đôi tất cùng màu.</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $3$&nbsp;chiếc tất.</span></div>" },
{ t_title: "Bài 5", t_content: "Mẹ có $1$&nbsp;tờ tiền mệnh giá $50$&nbsp;nghìn đồng. Mẹ muốn đổi tờ tiền này thành các tờ tiền nhỏ hơn gồm hai loại: loại $20$&nbsp;nghìn đồng và loại $10$&nbsp;nghìn đồng. Yêu cầu số tiền sau khi đổi phải có ĐỦ CẢ HAI LOẠI mệnh giá đó. Hỏi mẹ có mấy cách đổi tiền? Hãy liệt kê chi tiết các cách đó.", strategy: "WHAT (Yêu cầu đề): Đổi 50k thành các tờ 20k và 10k. Phải có mặt ĐỦ CẢ HAI mệnh giá, không được chỉ đổi toàn tờ 10k hoặc toàn tờ 20k.<br>HOW (Thử chọn có hệ thống):<br>- Hãy thử bắt đầu với tờ tiền lớn nhất là 20k.<br>- Thử $1$&nbsp;tờ 20k (còn thiếu 30k) -> 30k đổi thành $3$&nbsp;tờ 10k. (Cách 1).<br>- Thử $2$&nbsp;tờ 20k ($20 + 20 = 40k$, còn thiếu 10k) -> 10k chính là $1$&nbsp;tờ 10k. (Cách 2).<br>- Thử $3$&nbsp;tờ 20k (thành 60k, quá giới hạn, sai).<br>WHY (Kết luận): Đã vét cạn các trường hợp có chứa tờ 20k. Chỉ có $2$&nbsp;cách thỏa mãn.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Để tổng số tiền đổi được là $50$&nbsp;nghìn đồng và có đủ cả hai loại tờ $20$&nbsp;nghìn và $10$&nbsp;nghìn, ta có các cách đổi như sau:</div><div>- <strong>Cách 1:</strong> Lấy $1$&nbsp;tờ $20$&nbsp;nghìn đồng. Số tiền còn thiếu là $30$&nbsp;nghìn đồng. Ta lấy $3$&nbsp;tờ $10$&nbsp;nghìn đồng. *(Kiểm tra: $20 + 10 + 10 + 10 = 50$&nbsp;nghìn - Hợp lệ).*</div><div>- <strong>Cách 2:</strong> Lấy $2$&nbsp;tờ $20$&nbsp;nghìn đồng (thành $40$&nbsp;nghìn). Số tiền còn thiếu là $10$&nbsp;nghìn đồng. Ta lấy $1$&nbsp;tờ $10$&nbsp;nghìn đồng. *(Kiểm tra: $20 + 20 + 10 = 50$&nbsp;nghìn - Hợp lệ).*</div><div>Nếu lấy nhiều hơn $2$&nbsp;tờ $20$&nbsp;nghìn (ví dụ $3$&nbsp;tờ là $60$&nbsp;nghìn) sẽ vượt quá số tiền của mẹ. Nếu không lấy tờ $20$&nbsp;nghìn nào (tức là lấy $5$&nbsp;tờ $10$&nbsp;nghìn) thì vi phạm yêu cầu phải có đủ hai loại tiền.</div><div>Vậy mẹ có tất cả <strong>$2$&nbsp;cách đổi tiền</strong>.</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $2$&nbsp;cách đổi.</span></div>" },
{ t_title: "Bài 6", t_content: "Tòa nhà chung cư nhà bé Bo có thang máy tốc độ di chuyển đều. Một hôm, Bo bấm thang máy đi từ tầng $1$&nbsp;lên tầng $5$&nbsp;thì mất đúng $12$&nbsp;giây. Hôm nay, Bo muốn đi từ tầng $1$&nbsp;lên tầng $9$. Hỏi thang máy sẽ đi mất bao nhiêu giây? (Bỏ qua thời gian đóng mở cửa).", strategy: "WHAT (Phân tích khoảng cách): Từ tầng $1$&nbsp;lên tầng $5$, thang máy ĐÃ ĐI QUA mấy tầng? Học sinh hay nhầm lấy $12 : 5$. Nhưng từ tầng $1$&nbsp;lên tầng $5$&nbsp;chỉ có khoảng cách là $5 - 1 = 4$&nbsp;tầng (từ 1 lên 2, 2 lên 3, 3 lên 4, 4 lên 5).<br>HOW (Tính vận tốc 1 tầng): Đi qua $4$&nbsp;tầng mất $12$&nbsp;giây. Vậy đi $1$&nbsp;tầng mất bao nhiêu giây? ($12 : 4 = 3$&nbsp;giây).<br>WHY (Áp dụng bẫy lần 2): Khi đi từ tầng $1$&nbsp;lên tầng $9$, thang máy đi qua mấy tầng? ($9 - 1 = 8$&nbsp;tầng). Vậy đi $8$&nbsp;tầng sẽ mất bao nhiêu thời gian? ($8 \\times 3 = 24$&nbsp;giây).", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Khi thang máy đi từ tầng $1$&nbsp;lên tầng $5$, số khoảng cách tầng mà thang máy phải đi qua là:</div><div>$5 - 1 = 4$&nbsp;(tầng)</div><div>Thời gian để thang máy di chuyển qua $1$&nbsp;tầng là:</div><div>$12 : 4 = 3$&nbsp;(giây)</div><div>Khi thang máy đi từ tầng $1$&nbsp;lên tầng $9$, số khoảng cách tầng thang máy phải đi qua là:</div><div>$9 - 1 = 8$&nbsp;(tầng)</div><div>Thời gian để thang máy đi từ tầng $1$&nbsp;lên tầng $9$&nbsp;là:</div><div>$3 \\times 8 = 24$&nbsp;(giây)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $24$&nbsp;giây.</span></div>" }
]
});

{ q_title: "Câu 7", q_content: "Tìm số bị ẩn $y$, biết: $y - 25 = 45$", options: ["A. $y = 20$", "B. $y = 60$", "C. $y = 70$", "D. $y = 65$"], correct_idx: 2, explain: "$y = 45 + 25 = 70$." },
{ q_title: "Câu 8", q_content: "Đoạn thẳng AB dài $1\\text{dm } 5\\text{cm}$. Đoạn thẳng CD dài $12\\text{cm}$. Nhận xét nào sau đây đúng?", options: ["A. AB dài hơn CD", "B. AB ngắn hơn CD", "C. AB dài bằng CD", "D. Không so sánh được"], correct_idx: 0, explain: "Đổi $1\\text{dm } 5\\text{cm} = 15\\text{cm}$. Vì $15\\text{cm} > 12\\text{cm}$ nên AB dài hơn CD." },

{ t_title: "Bài 1", t_content: "Tính nhanh: <div class='text-center text-xl my-4'>$49 + 38 + 21 + 12$</div>", strategy: "WHAT (Quan sát hàng đơn vị): Số nào có thể kết hợp với nhau để tạo ra hàng đơn vị bằng 0 (số tròn chục)? Số $9$ đi với số $1$, số $8$ đi với số $2$.<br>HOW (Gom nhóm):<br>- Cặp thứ nhất: $(49 + 21)$.<br>- Cặp thứ hai: $(38 + 12)$.<br>WHY (Thực thi và tính tổng):<br>- $49 + 21 = 70$.<br>- $38 + 12 = 50$.<br>- Cuối cùng lấy $70 + 50 = 120$. Tính trong ngoặc trước giúp việc cộng các số lớn trở nên dễ dàng.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>$49 + 38 + 21 + 12$</div><div>$= (49 + 21) + (38 + 12)$</div><div>$= 70 + 50$</div><div>$= 120$</div>" },
{ t_title: "Bài 2", t_content: "Em hãy tìm một số có hai chữ số, biết rằng nếu lấy chữ số hàng chục cộng với chữ số hàng đơn vị thì được kết quả là $12$, còn nếu lấy chữ số hàng chục trừ đi chữ số hàng đơn vị thì được kết quả là $2$.", strategy: "WHAT (Mục tiêu): Tìm $2$&nbsp;chữ số (từ $0$ đến $9$) sao cho Tổng = $12$ và Hiệu = $2$.<br>HOW (Liệt kê các cặp số có tổng là $12$):<br>- $3 + 9 = 12$<br>- $4 + 8 = 12$<br>- $5 + 7 = 12$<br>- $6 + 6 = 12$<br>WHY (Sử dụng dữ kiện Hiệu): Trong các cặp số trên, cặp nào có số lớn trừ số bé bằng $2$?<br>- $9 - 3 = 6$&nbsp;(Loại)<br>- $8 - 4 = 4$&nbsp;(Loại)<br>- $7 - 5 = 2$&nbsp;(Đúng). Vì chữ số hàng chục trừ chữ số hàng đơn vị được $2$, nên chữ số hàng chục phải lớn hơn chữ số hàng đơn vị. Vậy hàng chục là $7$, hàng đơn vị là $5$.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Các cặp hai chữ số có tổng bằng $12$&nbsp;là: $3$ và $9$; $4$ và $8$; $5$ và $7$; $6$ và $6$.</div><div>Trong các cặp chữ số trên, ta tìm được cặp chữ số có hiệu bằng $2$&nbsp;là số $7$ và số $5$ (vì $7 - 5 = 2$).</div><div>Theo đề bài, lấy chữ số hàng chục trừ đi chữ số hàng đơn vị thì được $2$, điều này có nghĩa là chữ số hàng chục lớn hơn chữ số hàng đơn vị. Do đó, chữ số hàng chục là $7$ và chữ số hàng đơn vị là $5$.</div><div>Vậy số có hai chữ số cần tìm là <strong>$75$</strong>.</div><div>*(Thử lại: $7 + 5 = 12$ và $7 - 5 = 2$, hoàn toàn chính xác).*</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $75$.</span></div>" },
{ t_title: "Bài 3", t_content: "Một cuốn truyện tranh có tất cả $60$&nbsp;trang. Minh đang đọc đến trang sách mang số có hai chữ số giống nhau lớn nhất trong cuốn truyện. Hỏi Minh đang đọc ở trang số mấy và em ấy còn phải đọc bao nhiêu trang nữa thì mới hết cuốn truyện?", strategy: "WHAT (Tìm trang sách): Cuốn truyện có $60$&nbsp;trang. Số trang có 'hai chữ số giống nhau' bao gồm các số nào? ($11, 22, 33, 44, 55, 66...$).<br>HOW (Áp dụng giới hạn): Số trang lớn nhất không được vượt quá số $60$. Vậy số có hai chữ số giống nhau lớn nhất mà nhỏ hơn $60$&nbsp;chính là số $55$. Tức là Minh đang đọc trang $55$.<br>WHY (Tìm số trang còn lại): Cuốn truyện có tổng cộng $60$&nbsp;trang. Đã đọc đến trang $55$. Để biết còn bao nhiêu trang chưa đọc, ta chỉ việc lấy tổng số trang trừ đi số trang vừa đọc. $60 - 55 = 5$.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Các số có hai chữ số giống nhau là: $11, 22, 33, 44, 55, 66...$</div><div>Vì cuốn truyện tranh chỉ có tổng cộng $60$&nbsp;trang, nên số có hai chữ số giống nhau lớn nhất trong cuốn truyện này là số $55$. Vậy Minh đang đọc ở <strong>trang số $55$</strong>.</div><div>Số trang truyện Minh còn phải đọc nữa để hết cuốn truyện là:</div><div>$60 - 55 = 5$&nbsp;(trang)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: Đang đọc trang $55$ ; Còn lại $5$&nbsp;trang.</span></div>" },
{ t_title: "Bài 4", t_content: "Tòa nhà chung cư nơi Bin ở có tất cả $10$&nbsp;tầng (từ tầng $1$&nbsp;đến tầng $10$). Nếu đếm từ dưới mặt đất lên thì căn hộ của gia đình Bin nằm ở tầng $4$. Hỏi nếu đếm ngược từ trên tầng cao nhất (tầng $10$) xuống dưới thì căn hộ nhà Bin nằm ở vị trí tầng thứ mấy?", strategy: "WHAT (Mô phỏng vị trí): Tòa nhà có $10$&nbsp;tầng. Tính từ dưới lên, phòng Bin ở tầng $4$.<br>HOW (Đếm xuôi và đếm ngược):<br>- Từ dưới lên: $1, 2, 3, 4$&nbsp;(Đây là tầng của Bin).<br>- Hỏi bên trên tầng của Bin còn bao nhiêu tầng nữa? Có $10 - 4 = 6$&nbsp;tầng (là các tầng $5, 6, 7, 8, 9, 10$).<br>WHY (Chốt vị trí từ trên xuống): Đếm từ trên xuống, ta sẽ đi qua $6$&nbsp;tầng nằm phía trên nhà Bin. Sau khi qua hết $6$&nbsp;tầng đó thì sẽ chạm đến tầng của nhà Bin. Vậy tầng nhà Bin sẽ là tầng thứ $6 + 1 = 7$.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Tòa nhà có $10$&nbsp;tầng. Nhà Bin ở tầng $4$&nbsp;tính từ dưới lên.</div><div>Số tầng nằm ở phía trên căn hộ nhà Bin là:</div><div>$10 - 4 = 6$&nbsp;(tầng)</div><div>Nếu đếm từ trên tầng cao nhất xuống dưới, người ta sẽ đi qua $6$&nbsp;tầng này trước, sau đó mới đến tầng của nhà Bin.</div><div>Vậy nếu đếm từ trên xuống, căn hộ nhà Bin nằm ở vị trí tầng thứ:</div><div>$6 + 1 = 7$</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: Tầng thứ $7$.</span></div>" },
{ t_title: "Bài 5", t_content: "Mẹ mua một thanh sô-cô-la hình chữ nhật được chia sẵn thành các ô vuông nhỏ đều nhau. Thanh sô-cô-la có $4$&nbsp;hàng ngang, mỗi hàng có $6$&nbsp;ô vuông. Mẹ muốn bẻ thanh sô-cô-la này làm hai phần (chỉ bẻ đúng $1$&nbsp;lần theo đường rãnh có sẵn) sao cho phần lớn có số ô vuông gấp đôi phần nhỏ. Hỏi mỗi phần sẽ có bao nhiêu ô vuông nhỏ?", strategy: "WHAT (Tổng số ô): Thanh sô-cô-la có $4$&nbsp;hàng, mỗi hàng $6$&nbsp;ô. Tổng số ô vuông là bao nhiêu? ($4 \\times 6 = 24$&nbsp;ô vuông).<br>HOW (Chia phần theo tỉ lệ): Bẻ thành $2$&nbsp;phần mà 'phần này gấp đôi phần kia'. Tư duy bằng sơ đồ đoạn thẳng của lớp 2:<br>- Phần nhỏ: $1$&nbsp;phần.<br>- Phần lớn: $2$&nbsp;phần.<br>- Tổng cộng: $1 + 2 = 3$&nbsp;phần bằng nhau. Giá trị của $1$&nbsp;phần (chính là phần nhỏ) là: $24 : 3 = 8$&nbsp;ô. Giá trị của $2$&nbsp;phần (chính là phần lớn) là: $8 \\times 2 = 16$&nbsp;ô.<br>WHERE (Kiểm tra thực tế): Liệu có bẻ $1$&nbsp;nhát dọc/ngang để ra $8$ và $16$ được không? Có. Ta bẻ dọc thanh sô-cô-la, tách lấy $2$&nbsp;cột (mỗi cột $4$&nbsp;ô, $2 \\times 4 = 8$), phần còn lại là $4$&nbsp;cột ($4 \\times 4 = 16$).", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Tổng số ô vuông nhỏ của cả thanh sô-cô-la là:</div><div>$4 \\times 6 = 24$&nbsp;(ô vuông)</div><div>Vì mẹ bẻ thành $2$&nbsp;phần mà phần lớn gấp đôi phần nhỏ, ta coi phần nhỏ là $1$&nbsp;phần thì phần lớn là $2$&nbsp;phần bằng nhau như thế. Tổng số phần bằng nhau là:</div><div>$1 + 2 = 3$&nbsp;(phần)</div><div>Số ô vuông ở phần nhỏ của thanh sô-cô-la là:</div><div>$24 : 3 = 8$&nbsp;(ô vuông)</div><div>Số ô vuông ở phần lớn của thanh sô-cô-la là:</div><div>$8 \\times 2 = 16$&nbsp;(ô vuông)</div><div>*(Mẹ có thể bẻ tách rời $2$&nbsp;cột dọc hoặc $2$&nbsp;hàng ngang tùy góc nhìn).*</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: Phần nhỏ: $8$&nbsp;ô vuông ; Phần lớn: $16$&nbsp;ô vuông.</span></div>" },
{ t_title: "Bài 6", t_content: "Bác bảo vệ cần gắn các biển số để đánh số thứ tự các phòng học trong trường, bắt đầu từ phòng số $1$&nbsp;cho đến phòng số $20$. Cứ mỗi một chữ số bằng nhựa, người ta tính giá là $2$&nbsp;nghìn đồng. Hỏi bác bảo vệ cần mua tất cả bao nhiêu chữ số nhựa và phải trả bao nhiêu tiền? (Ví dụ: Phòng số $10$&nbsp;cần $2$&nbsp;chữ số là số $1$ và số $0$).", strategy: "WHAT (Phân biệt Số và Chữ số): Đề hỏi bác bảo vệ cần bao nhiêu 'chữ số' chứ không phải bao nhiêu biển phòng. Một phòng như số '15' là $1$&nbsp;biển phòng nhưng cần đến $2$&nbsp;chữ số (số $1$ và số $5$).<br>HOW (Phân nhóm để đếm):<br>- Nhóm 1 (Phòng có 1 chữ số): Từ số $1$&nbsp;đến số $9$. Có $9$&nbsp;phòng. Mỗi phòng dùng $1$&nbsp;chữ số -> Cần $9$&nbsp;chữ số.<br>- Nhóm 2 (Phòng có 2 chữ số): Từ số $10$&nbsp;đến số $20$. Có bao nhiêu số? ($20 - 10 + 1 = 11$&nbsp;phòng). Mỗi phòng dùng $2$&nbsp;chữ số -> Cần $11 \\times 2 = 22$&nbsp;chữ số.<br>WHY (Tính tổng và Tính tiền):<br>- Tổng chữ số cần mua: $9 + 22 = 31$&nbsp;chữ số.<br>- Mỗi chữ số giá $2$&nbsp;nghìn đồng -> Trả tiền: $31 \\times 2 = 62$&nbsp;nghìn đồng.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Từ phòng số $1$&nbsp;đến phòng số $9$&nbsp;có $9$&nbsp;phòng. Mỗi phòng chỉ cần $1$&nbsp;chữ số. Số chữ số nhựa dùng cho các phòng này là:</div><div>$1 \\times 9 = 9$&nbsp;(chữ số)</div><div>Từ phòng số $10$&nbsp;đến phòng số $20$&nbsp;có số lượng phòng là:</div><div>$20 - 10 + 1 = 11$&nbsp;(phòng)</div><div>Các phòng từ $10$&nbsp;đến $20$&nbsp;đều là số có $2$&nbsp;chữ số, nên số chữ số nhựa dùng cho các phòng này là:</div><div>$2 \\times 11 = 22$&nbsp;(chữ số)</div><div>Tổng số chữ số bằng nhựa bác bảo vệ cần mua là:</div><div>$9 + 22 = 31$&nbsp;(chữ số)</div><div>Số tiền bác bảo vệ phải trả để mua các chữ số đó là:</div><div>$31 \\times 2 = 62$&nbsp;(nghìn đồng)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: Cần $31$&nbsp;chữ số nhựa; Phải trả $62$&nbsp;nghìn đồng.</span></div>" }
]
});

{ t_title: "Bài 1", t_content: "Tính nhanh: <div class='text-center text-xl my-4'>$55 - 45 + 35 - 25 + 15 - 5$</div>", strategy: "WHAT (Quan sát dấu phép tính và hàng đơn vị): Ta thấy các phép tính cộng trừ đan xen nhau. Đặc biệt, các số đứng liền nhau đều có hàng đơn vị là $5$.<br>HOW (Gom nhóm tạo số tròn): Nếu thực hiện phép trừ giữa $2$&nbsp;số liền nhau, ta sẽ được kết quả rất đẹp (tròn chục).<br>- Nhóm 1: $(55 - 45)$<br>- Nhóm 2: $(35 - 25)$<br>- Nhóm 3: $(15 - 5)$<br>WHY (Thực thi và tính tổng): Mỗi nhóm trong ngoặc đều có kết quả bằng $10$. Ta lấy: $10 + 10 + 10 = 30$. Việc chia cặp giúp triệt tiêu các số lẻ rất nhanh.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>$55 - 45 + 35 - 25 + 15 - 5$</div><div>$= (55 - 45) + (35 - 25) + (15 - 5)$</div><div>$= 10 + 10 + 10$</div><div>$= 30$</div>" },
{ t_title: "Bài 2", t_content: "Một đường gấp khúc gồm $4$&nbsp;đoạn thẳng. Biết đoạn thẳng đầu tiên dài $3\\text{cm}$. Mỗi đoạn thẳng tiếp theo đều dài hơn đoạn thẳng đứng ngay trước nó $2\\text{cm}$. Tính độ dài của cả đường gấp khúc đó.", strategy: "WHAT (Mục tiêu): Tính độ dài CẢ đường gấp khúc gồm $4$&nbsp;đoạn. Nghĩa là phải tìm được độ dài của từng đoạn rồi cộng tất cả lại.<br>HOW (Liệt kê từng đoạn):<br>- Đoạn 1: Đề cho sẵn là $3\\text{cm}$.<br>- Đoạn 2: Dài hơn đoạn 1 là $2\\text{cm}$. Tức là $3 + 2 = 5\\text{cm}$.<br>- Đoạn 3: Dài hơn đoạn 2 là $2\\text{cm}$. Tức là $5 + 2 = 7\\text{cm}$.<br>- Đoạn 4: Dài hơn đoạn 3 là $2\\text{cm}$. Tức là $7 + 2 = 9\\text{cm}$.<br>WHAT NEXT (Tính tổng): Đường gấp khúc dài bằng tổng $4$&nbsp;đoạn cộng lại: $3 + 5 + 7 + 9$. Có thể hướng dẫn HS nhẩm nhanh: $(3 + 7) + (5 + 9) = 10 + 14 = 24$.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Độ dài của đoạn thẳng thứ hai là:</div><div>$3 + 2 = 5$&nbsp;(cm)</div><div>Độ dài của đoạn thẳng thứ ba là:</div><div>$5 + 2 = 7$&nbsp;(cm)</div><div>Độ dài của đoạn thẳng thứ tư là:</div><div>$7 + 2 = 9$&nbsp;(cm)</div><div>Độ dài của cả đường gấp khúc đó là:</div><div>$3 + 5 + 7 + 9 = 24$&nbsp;(cm)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $24\\text{cm}$.</span></div>" },
{ t_title: "Bài 3", t_content: "Em hãy tìm một số có hai chữ số, biết rằng nếu lấy chữ số hàng chục cộng với chữ số hàng đơn vị thì cũng BẰNG đúng kết quả của chữ số hàng chục nhân với chữ số hàng đơn vị.", strategy: "WHAT (Phân tích điều kiện): Tìm hai chữ số (từ $0$ đến $9$) sao cho Tổng của chúng bằng Tích của chúng.<br>HOW (Thử nghiệm và loại trừ):<br>- Nếu $1$&nbsp;chữ số là $0$: $0 + a = 0 \\times a$. Suy ra $a = 0$. (Số $00$&nbsp;không phải là số có $2$&nbsp;chữ số vì chữ số hàng chục phải lớn hơn $0$).<br>- Nếu $1$&nbsp;chữ số là $1$: $1 + 1 = 2$ nhưng $1 \\times 1 = 1$ (Sai). $1 + 2 = 3$ nhưng $1 \\times 2 = 2$ (Sai).<br>- Thử chữ số $2$: $2 + 2 = 4$. Và $2 \\times 2 = 4$. (Hoàn toàn chính xác!).<br>WHY (Kết luận): Chỉ duy nhất cặp chữ số $2$ và $2$ thỏa mãn điều kiện này. Vì đề yêu cầu tìm số có hai chữ số nên số đó được ghép từ hàng chục là $2$, hàng đơn vị là $2$.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Theo đề bài, ta cần tìm hai chữ số sao cho tổng của chúng bằng tích của chúng. Ta thử các trường hợp:</div><div>- Nếu các chữ số là $1$ và $1$: Tổng là $1+1=2$, Tích là $1 \\times 1=1$ (Không bằng nhau).</div><div>- Nếu các chữ số là $2$ và $2$: Tổng là $2+2=4$, Tích là $2 \\times 2=4$ (Bằng nhau, thỏa mãn).</div><div>Ngoài cặp số $2$ và $2$, không có cặp chữ số nào (từ $1$ đến $9$) có tổng bằng tích của chúng. Vậy chữ số hàng chục là $2$ và chữ số hàng đơn vị là $2$.</div><div>Số có hai chữ số cần tìm là <strong>$22$</strong>.</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $22$.</span></div>" },
{ t_title: "Bài 4", t_content: "Trong một chiếc hộp kín có $5$&nbsp;tấm thẻ ghi số $1$, $4$&nbsp;tấm thẻ ghi số $2$ và $3$&nbsp;tấm thẻ ghi số $3$. Không nhìn vào hộp, em cần bốc ra ít nhất bao nhiêu tấm thẻ để chắc chắn rằng TỔNG các số ghi trên các tấm thẻ vừa bốc ra lớn hơn $3$?", strategy: "WHAT (Mục tiêu): Bốc thẻ ra sao cho tổng các số ghi trên thẻ LỚN HƠN 3. Nghĩa là tổng phải từ $4$&nbsp;trở lên.<br>HOW (Xây dựng kịch bản rủi ro nhất): Nguyên tắc chắc chắn (Dirichlet) yêu cầu ta phải tính đến trường hợp xui xẻo nhất. Trạng thái xui xẻo nhất là bốc mãi mà tổng vẫn rất bé. Điều đó xảy ra khi ta toàn bốc phải các tấm thẻ mang số nhỏ nhất (số $1$).<br>WHY (Đếm cộng dồn trong rủi ro):<br>- Bốc 1 tấm rủi ro: Thẻ số $1$ (Tổng = $1$, chưa lớn hơn $3$).<br>- Bốc 2 tấm rủi ro: Thẻ số $1$, thẻ số $1$ (Tổng = $1+1=2$, chưa lớn hơn $3$).<br>- Bốc 3 tấm rủi ro: Thẻ số $1$, thẻ số $1$, thẻ số $1$ (Tổng = $1+1+1=3$, vẫn chưa LỚN HƠN $3$).<br>WHAT NEXT (Điểm phá vỡ rủi ro): Hộp có $5$&nbsp;tấm thẻ số $1$. Nếu ta bốc đến tấm thứ 4 (rủi ro vẫn là thẻ số $1$), tổng sẽ là $1+1+1+1=4$. Số $4$&nbsp;đã lớn hơn $3$. Dù tấm thứ 4 bốc được thẻ số $2$ hay số $3$ thì tổng lại càng lớn hơn nữa. Vậy phải bốc $4$&nbsp;thẻ.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Để chắc chắn tổng các số trên thẻ lớn hơn $3$, ta phải xét đến trường hợp rủi ro nhất (kém may mắn nhất). Trường hợp rủi ro nhất là ta bốc toàn trúng những tấm thẻ mang số nhỏ nhất, tức là tấm thẻ ghi số $1$.</div><div>Nếu ta bốc $3$&nbsp;tấm thẻ và đều là thẻ số $1$, tổng các số là: $1 + 1 + 1 = 3$. Tổng này chưa lớn hơn $3$.</div><div>Vì trong hộp có tới $5$&nbsp;tấm thẻ số $1$, nên ta bốc thêm $1$&nbsp;tấm thẻ thứ tư. Lúc này dù bốc được thẻ số $1$, số $2$ hay số $3$ thì tổng chắc chắn nhỏ nhất cũng là: $3 + 1 = 4$&nbsp;(Đã lớn hơn $3$, đạt yêu cầu).</div><div>Vậy ta cần bốc ít nhất số tấm thẻ là: $3 + 1 = 4$&nbsp;(tấm thẻ).</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $4$&nbsp;tấm thẻ.</span></div>" },
{ t_title: "Bài 5", t_content: "Lớp 2A xếp thành một hàng dọc để tập thể dục. Tính từ bạn đầu hàng xuống, bạn Lan đứng ở vị trí thứ $8$. Tính từ bạn cuối hàng lên, bạn Minh đứng ở vị trí thứ $6$. Biết rằng bạn Minh đứng phía sau bạn Lan và ở giữa hai bạn có đúng $3$&nbsp;bạn khác đang đứng. Hỏi hàng dọc của lớp 2A có tất cả bao nhiêu bạn?", strategy: "WHAT (Vẽ sơ đồ tư duy): Hãy tưởng tượng một hàng dọc.<br>Đầu hàng ... -> Lan -> $3$&nbsp;bạn ở giữa -> Minh -> ... Cuối hàng.<br>WHERE (Xác định các vùng không bị chồng lấn):<br>- Vùng 1: Tính từ đầu hàng đến chỗ bạn Lan đang đứng (kể cả Lan) là có <strong>$8$&nbsp;bạn</strong>.<br>- Vùng 2: Nhóm các bạn đứng giữa Lan và Minh có <strong>$3$&nbsp;bạn</strong>.<br>- Vùng 3: Tính từ bạn Minh (kể cả Minh) lùi về phía cuối hàng là có <strong>$6$&nbsp;bạn</strong>.<br>HOW (Tính tổng số người): Vì Lan đứng trước, Minh đứng sau, nên $3$&nbsp;vùng này nối tiếp nhau, không có ai bị đếm trùng lặp. Ta chỉ việc cộng tổng số bạn ở $3$&nbsp;vùng lại với nhau.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Ta chia hàng dọc của lớp thành $3$&nbsp;nhóm nối tiếp nhau từ trên xuống dưới như sau:</div><div>- Nhóm 1: Tính từ bạn đầu hàng đến vị trí của bạn Lan (bao gồm cả bạn Lan) có $8$&nbsp;bạn.</div><div>- Nhóm 2: Đứng ở khoảng giữa bạn Lan và bạn Minh có $3$&nbsp;bạn.</div><div>- Nhóm 3: Tính từ vị trí của bạn Minh (bao gồm cả bạn Minh) kéo dài đến bạn cuối hàng có $6$&nbsp;bạn.</div><div>Vì ba nhóm này hoàn toàn tách biệt không trùng lặp nhau, nên tổng số bạn trong hàng dọc của lớp 2A là:</div><div>$8 + 3 + 6 = 17$&nbsp;(bạn)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $17$&nbsp;bạn.</span></div>" },
{ t_title: "Bài 6", t_content: "Một chiếc đồng hồ treo tường có kim giờ và kim phút đang cùng chỉ một đường thẳng đứng (lúc $6$&nbsp;giờ đúng). Hỏi quay ngược thời gian về trước đó, thời điểm gần nhất mà kim giờ và kim phút cũng tạo thành một đường thẳng (nhưng che khuất lên nhau) là lúc mấy giờ? Và khoảng thời gian từ lúc đó đến $6$&nbsp;giờ là bao nhiêu tiếng?", strategy: "WHAT (Khái niệm 'thẳng hàng'):<br>- Loại thẳng hàng thứ nhất: Hai kim đối diện nhau, tạo thành $1$&nbsp;đường thẳng (Ví dụ: Lúc $6$&nbsp;giờ đúng, kim phút chỉ số $12$, kim giờ chỉ số $6$).<br>- Loại thẳng hàng thứ hai: Hai kim chập vào nhau, che khuất nhau trên cùng $1$&nbsp;đường thẳng (Ví dụ: Lúc $12$&nbsp;giờ đúng, cả hai kim đều chỉ số $12$).<br>WHERE (Xác định mốc thời gian): Đồng hồ đang chỉ $6$&nbsp;giờ. Yêu cầu quay ngược thời gian (đi lùi về quá khứ) để tìm lúc $2$&nbsp;kim chập vào nhau.<br>HOW (Truy vết): Từ 6h lùi về 5h, 4h, 3h, 2h, 1h. Đến đúng mốc $12$&nbsp;giờ trưa (hoặc $12$&nbsp;giờ đêm), kim giờ và kim phút chập vào nhau tại số $12$.<br>WHAT NEXT (Tính khoảng thời gian): Từ $12$&nbsp;giờ đến $6$&nbsp;giờ là một khoảng cách dài bao nhiêu tiếng? Ta lấy $6 - 0 = 6$&nbsp;tiếng (nếu tính theo chu kỳ 12h) hoặc đếm ngón tay từ 12h đến 6h là đúng $6$&nbsp;tiếng.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Thời điểm mà kim giờ và kim phút che khuất lên nhau và tạo thành một đường thẳng chính là lúc <strong>$12$&nbsp;giờ đúng</strong> (khi đó cả hai kim đều cùng chỉ vào số $12$).</div><div>Đồng hồ hiện tại đang chỉ $6$&nbsp;giờ đúng. Khoảng thời gian quay ngược từ lúc $6$&nbsp;giờ về thời điểm $12$&nbsp;giờ gần nhất trước đó là: $6$&nbsp;tiếng (bao gồm các khoảng: từ 6h lùi về 5h, 4h, 3h, 2h, 1h, 12h).</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: Lúc $12$&nbsp;giờ đúng ; Khoảng thời gian là $6$&nbsp;tiếng.</span></div>" }
]

{ q_title: "Câu 7", q_content: "Trong một hàng có $15$&nbsp;bạn xếp hàng dọc. Bạn Lan đứng thứ $6$ từ trên xuống. Hỏi có bao nhiêu bạn đứng sau Lan?", options: ["A. $8$&nbsp;bạn", "B. $9$&nbsp;bạn", "C. $10$&nbsp;bạn", "D. $11$&nbsp;bạn"], correct_idx: 1, explain: "Số bạn đứng sau = Tổng số bạn - Số thứ tự của Lan = $15 - 6 = 9$&nbsp;(bạn)." },
{ q_title: "Câu 8", q_content: "Có $3$&nbsp;hộp bi: hộp màu Đỏ, hộp màu Xanh, hộp màu Vàng. Biết hộp Đỏ không chứa bi Xanh, hộp Vàng chứa bi Đỏ. Vậy hộp màu Xanh chứa bi màu gì? (Biết mỗi hộp chỉ chứa một loại bi có màu tương ứng với tên các hộp nhưng bị xếp lộn xộn).", options: ["A. Bi Vàng", "B. Bi Đỏ", "C. Bi Xanh", "D. Không xác định được"], correct_idx: 0, explain: "Loại trừ logic từ các dữ kiện đã cho. Hộp Vàng chứa bi Đỏ. Hộp Đỏ không chứa bi Xanh nên hộp Đỏ chứa bi Vàng. Vậy hộp Xanh chứa bi Vàng." },

{ q_title: "Câu 12", q_content: "Điền số thích hợp vào chỗ trống để được dãy số có quy luật: $1; 2; 4; 7; 11; \\dots$", options: ["A. $14$", "B. $15$", "C. $16$", "D. $17$"], correct_idx: 2, explain: "Khoảng cách giữa các số tăng dần: $+1, +2, +3, +4\\dots$ Số tiếp theo là $11 + 5 = 16$." }

{ t_title: "Bài 1", t_content: "Tìm $X$, biết: <div class='text-center text-xl my-4'>$X + 15 = 62 - 27$</div>", strategy: "WHAT: Tìm $X$ trong một biểu thức có hai phép tính ở vế phải.<br>HOW: Tính kết quả của phép trừ ở vế phải trước, sau đó tìm $X$ như tìm số hạng chưa biết.<br>WHY: Đưa bài toán về dạng cơ bản $X + a = b$.<br>WHAT NEXT: Chú ý tính toán cẩn thận phép trừ có nhớ.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>$X + 15 = 62 - 27$</div><div>$X + 15 = 35$</div><div>$X = 35 - 15$</div><div>$X = 20$</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $X = 20$.</span></div>" },
{ t_title: "Bài 2", t_content: "Cô giáo có một số quyển vở. Sau khi phát cho $12$&nbsp;bạn, mỗi bạn $2$&nbsp;quyển vở thì cô còn lại $8$&nbsp;quyển. Hỏi lúc đầu cô giáo có bao nhiêu quyển vở?", strategy: "WHAT: Tính số vở ban đầu của cô giáo.<br>HOW: Tính số vở đã phát, cộng với số vở còn lại.<br>WHY: Tổng số vở ban đầu bằng phần đã cho đi cộng với phần giữ lại.<br>WHERE/WHEN/WHAT NEXT: Tính chính xác số vở đã phát bằng phép nhân $12 \\times 2$.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Số vở cô giáo đã phát cho $12$&nbsp;bạn là:</div><div>$12 \\times 2 = 24$&nbsp;(quyển vở)</div><div>Lúc đầu cô giáo có số quyển vở là:</div><div>$24 + 8 = 32$&nbsp;(quyển vở)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $32$&nbsp;quyển vở.</span></div>" },
{ t_title: "Bài 3", t_content: "Trong một phép trừ, tổng của số bị trừ, số trừ và hiệu bằng $84$. Số trừ lớn hơn hiệu $12$&nbsp;đơn vị. Tìm số bị trừ và số trừ.", strategy: "WHAT: Tìm Số bị trừ và Số trừ khi biết tổng của ba thành phần và mối quan hệ giữa số trừ và hiệu.<br>HOW: Áp dụng tính chất: Số bị trừ = Số trừ + Hiệu. Thay vào tổng để tìm Số bị trừ. Sau đó dùng toán Tổng - Hiệu để tìm Số trừ.<br>WHY: Vì Số trừ + Hiệu = Số bị trừ, nên Tổng $3$&nbsp;số = $2$&nbsp;lần Số bị trừ.<br>WHERE/WHEN/WHAT NEXT: Nhận ra tính chất 'Tổng 3 thành phần bằng 2 lần Số bị trừ' là chìa khóa giải toán.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Ta có: Số bị trừ + Số trừ + Hiệu = $84$</div><div>Vì Số trừ + Hiệu = Số bị trừ, nên:</div><div>Số bị trừ + Số bị trừ = $84$</div><div>Số bị trừ = $84 : 2 = 42$</div><div>Ta lại có: Số trừ + Hiệu = $42$ và Số trừ - Hiệu = $12$</div><div>Số trừ là: $(42 + 12) : 2 = 27$</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: Số bị trừ: $42$, Số trừ: $27$.</span></div>" },
{ t_title: "Bài 4", t_content: "Có $3$&nbsp;can đựng nước mắm: can thứ nhất chứa $16$&nbsp;lít, can thứ hai chứa $20$&nbsp;lít. Can thứ ba chứa số nước mắm bằng một nửa tổng số lít nước mắm của hai can đầu. Hỏi cả ba can chứa tất cả bao nhiêu lít nước mắm?", strategy: "WHAT: Tính tổng số lít nước mắm của cả $3$&nbsp;can.<br>HOW: Tính tổng can 1 và can 2. Tính can 3. Cuối cùng tính tổng cả 3 can.<br>WHY: Dữ kiện cho theo chuỗi, cần tính tuần tự.<br>WHERE/WHEN/WHAT NEXT: Đọc kĩ: 'một nửa tổng' để thực hiện phép chia 2.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Tổng số lít nước mắm của can thứ nhất và can thứ hai là:</div><div>$16 + 20 = 36$&nbsp;(lít)</div><div>Can thứ ba chứa số lít nước mắm là:</div><div>$36 : 2 = 18$&nbsp;(lít)</div><div>Tổng số lít nước mắm cả ba can chứa là:</div><div>$36 + 18 = 54$&nbsp;(lít)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $54$&nbsp;lít nước mắm.</span></div>" },
{ t_title: "Bài 5", t_content: "Một hình vuông có cạnh dài $6\\text{ cm}$. Người ta cắt hình vuông đó thành hai hình chữ nhật bằng nhau. Tính tổng chu vi của hai hình chữ nhật vừa được cắt ra.<br><svg viewBox='0 0 100 100' class='w-32 h-auto mx-auto my-3'><rect x='10' y='10' width='80' height='80' fill='none' stroke='#3b82f6' stroke-width='2'/><line x1='10' y1='50' x2='90' y2='50' stroke='#ef4444' stroke-width='2' stroke-dasharray='4'/></svg>", strategy: "WHAT: Tính tổng chu vi $2$&nbsp;hình chữ nhật sau khi cắt từ $1$&nbsp;hình vuông.<br>HOW: Xác định chiều dài, chiều rộng của hình chữ nhật nhỏ. Tính chu vi $1$&nbsp;hình rồi nhân đôi.<br>WHY: Đường cắt chia đôi hình vuông nên chiều dài giữ nguyên, chiều rộng bằng một nửa cạnh hình vuông.<br>WHERE/WHEN/WHAT NEXT: Chú ý học sinh dễ nhầm lấy chu vi hình vuông chia đôi.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Khi cắt hình vuông cạnh $6\\text{ cm}$ thành hai hình chữ nhật bằng nhau, mỗi hình chữ nhật sẽ có:</div><div>Chiều dài bằng cạnh hình vuông = $6\\text{ cm}$.</div><div>Chiều rộng bằng nửa cạnh hình vuông:</div><div>$6 : 2 = 3\\text{ (cm)}$</div><div>Chu vi của một hình chữ nhật vừa được cắt ra là:</div><div>$(6 + 3) \\times 2 = 18\\text{ (cm)}$</div><div>Tổng chu vi của hai hình chữ nhật đó là:</div><div>$18 + 18 = 36\\text{ (cm)}$</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $36\\text{ cm}$.</span></div>" },
{ t_title: "Bài 6", t_content: "Một giải đấu cờ vua có $6$&nbsp;kỳ thủ tham gia. Mỗi kỳ thủ phải thi đấu với tất cả các kỳ thủ còn lại, mỗi người đúng một ván. Hỏi có tất cả bao nhiêu ván cờ được diễn ra trong giải đấu đó?", strategy: "WHAT: Đếm số ván cờ.<br>HOW: Dùng sơ đồ đoạn thẳng hoặc công thức tổ hợp. Hoặc đếm tay: Người 1 đấu 5 ván, người 2 đấu 4 ván (trừ người 1 đã tính), v.v.<br>WHY: Mỗi ván cờ có $2$&nbsp;người, đấu vòng tròn nên số ván giảm dần để tránh tính trùng.<br>WHERE/WHEN/WHAT NEXT: Tổng quát hóa thành bài toán 'đếm cái bắt tay'.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Cách 1 (Liệt kê):</div><div>- Kỳ thủ thứ 1 thi đấu $5$&nbsp;ván (với $5$&nbsp;người còn lại).</div><div>- Kỳ thủ thứ 2 thi đấu $4$&nbsp;ván (với $4$&nbsp;người còn lại, không tính ván đã đấu với người thứ 1).</div><div>- Kỳ thủ thứ 3 thi đấu $3$&nbsp;ván.</div><div>- Kỳ thủ thứ 4 thi đấu $2$&nbsp;ván.</div><div>- Kỳ thủ thứ 5 thi đấu $1$&nbsp;ván.</div><div>- Kỳ thủ thứ 6 đã thi đấu đủ với mọi người ở các lượt trên nên tính là $0$&nbsp;ván mới.</div><div>Tổng số ván cờ là: $5 + 4 + 3 + 2 + 1 = 15$&nbsp;(ván)</div><div>Cách 2 (Công thức nếu HS đã học):</div><div>Tổng số ván cờ diễn ra là: $6 \\times (6 - 1) : 2 = 15$&nbsp;(ván)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $15$&nbsp;ván cờ.</span></div>" }
]

{ q_title: "Câu 10", q_content: "Hai con lợn nặng bằng $4$ con chó. Một con chó nặng bằng $3$ con mèo. Hỏi một con lợn nặng bằng bao nhiêu con mèo?", options: ["A. $7$&nbsp;con mèo", "B. $5$&nbsp;con mèo", "C. $6$&nbsp;con mèo", "D. $12$&nbsp;con mèo"], correct_idx: 2, explain: "2 Lợn = 4 Chó => 1 Lợn = 2 Chó. Mà 1 Chó = 3 Mèo => 2 Chó = 6 Mèo. Vậy 1 Lợn = 6 Mèo." },

{ t_title: "Bài 1", t_content: "Tìm $X$, biết: <div class='text-center text-xl my-4'>$X - 18 = 45 - 20$</div>", strategy: "WHAT: Tìm ẩn $X$ trong biểu thức mà vế phải là một phép tính trừ.<br>HOW: Rút gọn vế phải trước bằng cách tính $45 - 20$. Sau đó giải bài toán 'Tìm số bị trừ'.<br>WHY: Cần đưa phương trình về dạng cơ bản $X - a = b$ để xử lý.<br>WHERE/WHEN/WHAT NEXT: Chú ý thực hiện chính xác các phép trừ, đặc biệt là phép toán chuyển vế đổi dấu thành phép cộng.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>$X - 18 = 45 - 20$</div><div>$X - 18 = 25$</div><div>$X = 25 + 18$</div><div>$X = 43$</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $X = 43$.</span></div>" },
{ t_title: "Bài 2", t_content: "Tìm quy luật và điền $2$&nbsp;số tiếp theo vào chỗ chấm trong dãy số sau: <div class='text-center text-xl my-4'>$2; 4; 8; 14; 22; \\dots; \\dots$</div>", strategy: "WHAT: Điền $2$&nbsp;số tiếp theo vào dãy số tăng dần.<br>HOW: Tìm sự chênh lệch (khoảng cách) giữa các số liền kề: $4-2=2$, $8-4=4$, $14-8=6$, $22-14=8$.<br>WHY: Khoảng cách giữa các số cũng tạo thành một dãy số mới có quy luật (các số chẵn liên tiếp).<br>WHERE/WHEN/WHAT NEXT: Cộng khoảng cách tiếp theo (là 10 và 12) vào số cuối cùng của dãy để ra kết quả.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Ta thấy khoảng cách giữa các số trong dãy là:</div><div>$4 - 2 = 2$</div><div>$8 - 4 = 4$</div><div>$14 - 8 = 6$</div><div>$22 - 14 = 8$</div><div>Quy luật: Khoảng cách giữa hai số liền nhau tăng dần theo dãy số chẵn liên tiếp ($2, 4, 6, 8, \\dots$). Vậy khoảng cách tiếp theo sẽ là $10$ và $12$.</div><div>Số thứ sáu trong dãy là: $22 + 10 = 32$.</div><div>Số thứ bảy trong dãy là: $32 + 12 = 44$.</div><div>Dãy số được điền đầy đủ là: $2; 4; 8; 14; 22; \\mathbf{32}; \\mathbf{44}$.</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $32$ và $44$.</span></div>" },
{ t_title: "Bài 3", t_content: "Năm nay chị $15$&nbsp;tuổi, em $8$&nbsp;tuổi. Hỏi khi em $12$&nbsp;tuổi thì chị bao nhiêu tuổi?", strategy: "WHAT: Tính tuổi chị trong tương lai dựa trên mốc tuổi của em.<br>HOW: Tính hiệu số tuổi của hai chị em. Sau đó lấy tuổi của em trong tương lai cộng với hiệu số tuổi đó.<br>WHY: 'Hiệu số tuổi của hai người không bao giờ thay đổi theo thời gian' (Bất biến).<br>WHERE/WHEN/WHAT NEXT: Có thể dùng cách khác: Xem em tăng bao nhiêu tuổi thì chị cũng tăng bấy nhiêu tuổi.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Cách 1: Chị luôn luôn hơn em số tuổi là:</div><div>$15 - 8 = 7$&nbsp;(tuổi)</div><div>Khi em $12$&nbsp;tuổi, tuổi của chị lúc đó là:</div><div>$12 + 7 = 19$&nbsp;(tuổi)</div><div>Cách 2: Từ nay đến khi em $12$&nbsp;tuổi cần số năm là:</div><div>$12 - 8 = 4$&nbsp;(năm)</div><div>Sau $4$&nbsp;năm nữa, tuổi của chị là:</div><div>$15 + 4 = 19$&nbsp;(tuổi)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $19$&nbsp;tuổi.</span></div>" },
{ t_title: "Bài 4", t_content: "Lan có một dải ruy băng dài $40\\text{ cm}$. Lan muốn cắt dải ruy băng đó thành các đoạn ngắn, mỗi đoạn dài $8\\text{ cm}$ để trang trí hộp quà. Hỏi Lan cần phải cắt bao nhiêu nhát kéo?", strategy: "WHAT: Tính số nhát cắt để chia một đoạn thẳng thành các phần bằng nhau.<br>HOW: Tính số đoạn ruy băng tạo thành bằng phép chia $40 : 8$. Sau đó tính số nhát cắt dựa trên quy tắc cắt đường thẳng.<br>WHY: Số nhát cắt thẳng luôn ít hơn số đoạn được chia ra là 1 (vì nhát cắt cuối cùng sẽ chia đoạn còn lại thành 2 phần).<br>WHERE/WHEN/WHAT NEXT: Tránh nhầm lẫn bẫy 'Lấy chiều dài chia chiều dài đoạn = số nhát cắt'.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Số đoạn ruy băng ngắn dài $8\\text{ cm}$ cắt được là:</div><div>$40 : 8 = 5$&nbsp;(đoạn)</div><div>Vì một nhát cắt sẽ chia dải ruy băng ra làm hai, nên số nhát cắt luôn ít hơn số đoạn tạo thành là $1$.</div><div>Lan cần số nhát kéo để cắt dải ruy băng là:</div><div>$5 - 1 = 4$&nbsp;(nhát cắt)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $4$&nbsp;nhát cắt.</span></div>" },
{ t_title: "Bài 5", t_content: "Có $3$&nbsp;cuốn sách: Toán, Tiếng Việt và Tiếng Anh được xếp vào một giá sách có $3$&nbsp;ngăn (ngăn trên cùng, ngăn giữa và ngăn dưới cùng). Biết rằng:<br>- Cuốn sách Toán không được xếp ở ngăn dưới cùng.<br>- Cuốn sách Tiếng Việt được xếp ở ngăn ngay phía dưới cuốn sách Toán.<br>Hỏi cuốn sách Tiếng Anh được xếp ở ngăn nào? Vì sao?", strategy: "WHAT: Suy luận vị trí của 3 cuốn sách trên 3 ngăn kệ dựa vào các điều kiện bị giới hạn.<br>HOW: Xếp theo cặp. Toán nằm trên Tiếng Việt, nghĩa là Toán và Tiếng Việt cần 2 ngăn liền kề. Thử các trường hợp cho cặp này trên kệ 3 ngăn.<br>WHY: Toán không nằm dưới cùng, nên Toán chỉ có thể ở Trên Cùng hoặc Giữa. Nếu Toán ở Giữa, Tiếng Việt ở Dưới Cùng. Nếu Toán ở Trên Cùng, Tiếng Việt ở Giữa.<br>WHERE/WHEN/WHAT NEXT: Kết luận chắc chắn vị trí của Tiếng Anh dựa vào chỗ trống duy nhất còn lại.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Vì cuốn Toán không nằm ở ngăn dưới cùng, và cuốn Tiếng Việt nằm ngay dưới cuốn Toán, nên ta có $2$&nbsp;trường hợp xảy ra:</div><div>- <strong>Trường hợp 1:</strong> Nếu cuốn Toán nằm ở ngăn <strong>trên cùng</strong>. Khi đó, cuốn Tiếng Việt nằm ở ngăn <strong>giữa</strong>. Chỗ trống duy nhất còn lại cho cuốn Tiếng Anh là ngăn <strong>dưới cùng</strong>.</div><div>- <strong>Trường hợp 2:</strong> Nếu cuốn Toán nằm ở ngăn <strong>giữa</strong>. Khi đó, cuốn Tiếng Việt phải nằm ở ngăn <strong>dưới cùng</strong>. Chỗ trống duy nhất còn lại cho cuốn Tiếng Anh là ngăn <strong>trên cùng</strong>.</div><div>Vậy cuốn Tiếng Anh có thể được xếp ở <strong>ngăn trên cùng</strong> hoặc <strong>ngăn dưới cùng</strong>.</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: Ngăn trên cùng hoặc Ngăn dưới cùng.</span></div>" },
{ t_title: "Bài 6", t_content: "Mẹ có một cái chảo nhỏ, mỗi lần chỉ rán được nhiều nhất là $2$&nbsp;chiếc bánh. Để rán chín một mặt của chiếc bánh cần $2$&nbsp;phút. Hỏi mẹ cần thời gian ít nhất là bao nhiêu phút để có thể rán chín cả hai mặt của $3$&nbsp;chiếc bánh?<br><svg viewBox='0 0 100 60' class='w-48 h-auto mx-auto my-3'><circle cx='40' cy='30' r='28' fill='none' stroke='#3b82f6' stroke-width='2'/><circle cx='25' cy='30' r='10' fill='#fef08a' stroke='#ca8a04' stroke-width='1'/><text x='25' y='34' font-size='10' text-anchor='middle'>1</text><circle cx='55' cy='30' r='10' fill='#fef08a' stroke='#ca8a04' stroke-width='1'/><text x='55' y='34' font-size='10' text-anchor='middle'>2</text><circle cx='90' cy='30' r='10' fill='#fef08a' stroke='#ca8a04' stroke-width='1'/><text x='90' y='34' font-size='10' text-anchor='middle'>3</text></svg>", strategy: "WHAT: Tìm thời gian ngắn nhất (tối ưu nhất) để rán 3 chiếc bánh với điều kiện chảo chỉ chứa 2 chiếc.<br>HOW: Đánh số bánh 1, 2, 3. Luân chuyển bánh linh hoạt. Rán (1,2) trước, sau đó nhấc (2) ra, lật (1) và cho (3) vào. Cuối cùng rán mặt còn lại của (2) và (3).<br>WHY: Học sinh thường nghĩ lấy $3 \\times 4 = 12$&nbsp;phút hoặc rán 2 bánh hết 4 phút, rán bánh còn lại hết 4 phút (tổng 8 phút). Nhưng nếu không để chảo trống lúc nào, thời gian sẽ rút ngắn nhất.<br>WHERE/WHEN/WHAT NEXT: Chia theo các lượt 2 phút. Mục tiêu là luôn giữ cho chảo có đủ 2 chiếc bánh.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Giả sử mẹ gọi 3 chiếc bánh là Bánh 1, Bánh 2 và Bánh 3. Mỗi chiếc bánh có mặt A và mặt B. Để thời gian rán ngắn nhất, mẹ không được để chảo trống lúc nào. Cách làm như sau:</div><div>- <strong>Lần 1 (2 phút đầu):</strong> Cho Bánh 1 và Bánh 2 vào rán mặt A. *(Hết 2 phút: Bánh 1 và Bánh 2 chín 1 mặt).*</div><div>- <strong>Lần 2 (Từ phút thứ 3 đến phút thứ 4):</strong> Mẹ gắp Bánh 2 ra đĩa. Mẹ lật mặt B của Bánh 1, đồng thời cho Bánh 3 vào rán mặt A. *(Hết 4 phút: Bánh 1 đã chín 2 mặt và được gắp ra, Bánh 3 chín 1 mặt, Bánh 2 ở ngoài vẫn đang chín 1 mặt).*</div><div>- <strong>Lần 3 (Từ phút thứ 5 đến phút thứ 6):</strong> Lật mặt B của Bánh 3, đồng thời cho lại Bánh 2 vào rán mặt B. *(Hết 6 phút: Bánh 2 và Bánh 3 đều đã chín 2 mặt).*</div><div>Như vậy, mẹ cần ít nhất $6$&nbsp;phút để rán chín cả $3$&nbsp;chiếc bánh.</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $6$&nbsp;phút.</span></div>" }
]
