<!DOCTYPE html>
<html lang="vi">
<!-- =============================================================================== -->
<!-- PHẦN 1: GIAO DIỆN & ĐỘNG CƠ HOẠT ĐỘNG (TÍCH HỢP VỞ Ô LY VECTOR & AUTO-FILL)   -->
<!-- =============================================================================== -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hệ Thống Đề Thi Học Sinh Giỏi Toán Lớp 2</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
<style>
body { font-family: 'Nunito', sans-serif; background-color: #f3f4f6; }
.answer-explanation { display: none; }
.show-answers .answer-explanation { display: block; }
.show-answers .correct-option {
background-color: #d1fae5 !important;
border-color: #10b981 !important;
color: #065f46 !important;
font-weight: bold;
}
.selected-option {
background-color: #eff6ff !important;
border-color: #3b82f6 !important;
color: #1d4ed8 !important;
font-weight: bold;
}
.show-answers .selected-option:not(.correct-option) {
background-color: #fef2f2 !important;
border-color: #ef4444 !important;
color: #b91c1c !important;
}
.hint-content { display: none; }
.show-hints .hint-content { display: block; }
.testing-mode .option-btn:hover {
background-color: #e0e7ff !important;
}
.option-btn { line-height: 1.6; }
/* KHU VỰC VỞ Ô LY CHO TỰ LUẬN */
.student-workspace { display: none; margin-top: 1.5rem; }
.testing-mode .student-workspace,
.show-answers .student-workspace,
.show-hints .student-workspace { display: block; }
/* Ẩn lưới ô ly khi xem đáp án hoặc hướng dẫn */
.show-answers .empty-workspace,
.show-hints .empty-workspace { display: none !important; }
.oly-bg {
background-color: #fff;
position: relative;
border: 1px solid #545557;
border-radius: 4px;
width: 100%;
overflow: hidden;
}
/* Các class định dạng cho nét vẽ Vector DOM (Chống vỡ hạt khi zoom/print) */
.stroke-small { stroke: #E8E9EA; stroke-width: 0.5px; }
.stroke-large { stroke: #545557; stroke-width: 1px; }
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button {
-webkit-appearance: none; margin: 0;
}
input[type=number] { -moz-appearance: textfield; }
@media print {
body { background-color: white; padding: 0; }
#menu-view { display: none !important; }
#exam-view { display: block !important; }
.max-w-4xl { box-shadow: none !important; border-radius: 0; padding: 0; width: 100%; max-width: 100%; }
.no-print { display: none !important; }
* { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.page-break-avoid { break-inside: avoid; page-break-inside: avoid; }
/* Khi in: Chỉnh nét vẽ mỏng nhưng sử dụng màu TỐI HƠN để máy in không bị mất nét (Tăng sắc lẹm) */
.oly-bg { border: 0.5pt solid #545557 !important; }
.stroke-small { stroke: #cbd5e1 !important; stroke-width: 0.5pt !important; }
.stroke-large { stroke: #64748b !important; stroke-width: 0.75pt !important; }
/* CSS đặc biệt: Ép 1 bài trải dài full 1 trang A4 và lấp đầy ô ly */
body.print-full-page .tu-luan-item {
min-height: 245mm; /* Tương đương 1 trang A4 trừ lề */
display: flex;
flex-direction: column;
page-break-inside: avoid;
page-break-after: always;
break-after: page;
}
body.print-full-page .student-workspace {
flex-grow: 1;
display: flex;
flex-direction: column;
margin-bottom: 0;
}
/* Đảm bảo khung bọc 1 cột được giãn ra theo chiều dọc */
body.print-full-page .student-workspace > div {
flex-grow: 1;
display: flex;
align-items: stretch;
}
/* Từng cột bung ra (Chỉ tác động vào ô ly, không ép hiện hướng dẫn/đáp án) */
body.print-full-page .student-workspace > div > .empty-workspace {
display: flex;
flex-direction: column;
flex-grow: 1;
}
/* Oly-bg xóa bỏ giới hạn chiều cao cũ để Flexbox kéo dài vô hạn */
body.print-full-page .oly-bg {
flex-grow: 1;
height: auto !important;
min-height: 0 !important;
}
}
.fade-in { animation: fadeIn 0.4s ease-in-out forwards; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col items-center relative">
<!-- MÀN HÌNH MENU KHỞI ĐỘNG -->
<div id="menu-view" class="max-w-2xl w-[92%] md:w-full bg-white rounded-3xl shadow-2xl overflow-hidden fade-in relative my-auto">
<div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-10 text-center text-white">
<h1 class="text-4xl font-extrabold mb-3 drop-shadow-lg">🌟 KHO ĐỀ THI TOÁN LỚP 2</h1>
<p class="text-lg font-semibold opacity-90">Bồi dưỡng Học Sinh Giỏi & Phát triển Tư Duy</p>
</div>
<div class="p-8 md:p-12 text-center">
<p class="text-gray-600 mb-8 text-lg">Bạn có thể chọn đề thi từ danh sách hoặc nhập trực tiếp số thứ tự đề.</p>
<div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start text-left max-w-2xl mx-auto mb-6">
<!-- Cách 1: Dropdown -->
<div class="bg-gray-50 p-5 rounded-2xl border border-gray-200 shadow-sm">
<label for="exam-select" class="block text-sm font-bold text-indigo-700 mb-3 uppercase tracking-wider">
Cách 1: Chọn từ danh sách
</label>
<div class="relative">
<select id="exam-select" onchange="syncInputs('select')" class="block appearance-none w-full bg-white border border-gray-300 text-gray-700 py-3 px-4 pr-8 rounded-xl leading-tight focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-colors cursor-pointer text-base font-medium">
<option value="" disabled selected>-- Đang tải danh sách... --</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
<svg class="fill-current h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
</div>
</div>
</div>
<!-- Cách 2: Input Number -->
<div class="bg-gray-50 p-5 rounded-2xl border border-gray-200 shadow-sm relative">
<label for="exam-input" class="block text-sm font-bold text-indigo-700 mb-3 uppercase tracking-wider">
Cách 2: Nhập số thứ tự
</label>
<input type="number" id="exam-input" oninput="syncInputs('input')" placeholder="Ví dụ: 24..."
class="block w-full bg-white border border-gray-300 text-gray-700 py-3 px-4 rounded-xl leading-tight focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-colors text-base font-medium placeholder-gray-400"
onkeypress="handleEnter(event)">
</div>
</div>
<p id="exam-error" class="text-red-500 font-bold mt-3 min-h-[24px] opacity-0 transition-opacity">Không tìm thấy đề này!</p>
<button onclick="submitExamNumber()" class="mt-4 mx-auto w-full md:w-auto bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white text-xl px-12 py-4 rounded-full font-bold shadow-lg transform hover:-translate-y-1 transition-all flex justify-center items-center gap-2">
🚀 BẮT ĐẦU LÀM BÀI
</button>
<p class="mt-10 text-gray-500 font-medium bg-gray-50 inline-block px-4 py-2 rounded-lg border border-gray-200" id="total-exams-info">
Hệ thống đang tải dữ liệu...
</p>
</div>
</div>
<!-- MÀN HÌNH HIỂN THỊ ĐỀ THI -->
<div id="exam-view" class="hidden w-full max-w-4xl mx-auto bg-white shadow-xl relative fade-in md:mb-8 md:rounded-b-2xl md:border-x md:border-b border-gray-200">
<!-- Thanh công cụ (Nút bấm) -->
<div class="sticky top-0 z-50 bg-gray-100/95 backdrop-blur-sm px-4 md:px-6 py-3 flex flex-wrap gap-3 justify-between items-center no-print border-b border-gray-300 shadow-sm">
<button onclick="backToMenu()" class="bg-white hover:bg-gray-50 text-gray-700 px-4 py-2 rounded-lg font-bold shadow transition-colors border border-gray-300">🔙 Menu</button>
<div class="flex flex-wrap items-center gap-3">
<!-- Nút Tùy chọn in Auto-Fill (Chỉ hiện khi Bật Làm Bài) -->
<label class="flex items-center space-x-2 text-sm font-bold text-gray-700 cursor-pointer select-none bg-white px-3 py-2 rounded-lg border border-gray-300 shadow-sm hover:bg-gray-50 transition hidden" id="printFullPageWrapper">
<input type="checkbox" id="fillPageToggle" class="w-4 h-4 text-indigo-600 rounded cursor-pointer" onchange="toggleFillPage()">
<span>📄 Lấp đầy trang in</span>
</label>
<button id="testingModeBtn" onclick="toggleTestingMode()" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg font-bold shadow transition-colors border border-purple-500">✍️ Làm Bài</button>
<button onclick="triggerPrint()" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg font-bold shadow transition-colors border border-gray-500">🖨️ In Đề</button>
<button id="toggleHintsBtn" onclick="toggleHints()" class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded-lg font-bold shadow transition-colors border border-yellow-400">💡 Hướng Dẫn</button>
<button id="toggleAnswersBtn" onclick="toggleAnswers()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-bold shadow transition-colors border border-blue-500">👁️ Xem Đáp Án</button>
</div>
</div>
<!-- Header Đề thi -->
<div class="bg-white text-gray-800 p-6 md:p-8 text-center border-b-2 border-gray-200">
<h1 class="text-3xl font-extrabold uppercase tracking-wide mb-2 text-indigo-800">Đề Thi Học Sinh Giỏi Toán Lớp 2</h1>
<h2 id="exam-title-number" class="text-2xl font-bold mb-4 text-gray-700">ĐỀ SỐ ...</h2>
<div class="flex justify-center space-x-8 text-sm font-medium text-gray-600">
<span class="bg-gray-50 border border-gray-200 px-3 py-1 rounded-full shadow-sm" id="exam-time">⏱️ Thời gian</span>
<span class="bg-gray-50 border border-gray-200 px-3 py-1 rounded-full shadow-sm" id="exam-level">⭐ Mức độ</span>
</div>
</div>
<!-- Nơi JS vẽ Nội dung Đề Thi -->
<div id="exam-dynamic-content" class="p-8 pb-12"></div>
</div>
<!-- NÚT LÊN ĐẦU TRANG -->
<button id="backToTopBtn" onclick="scrollToTop()" class="fixed bottom-6 right-4 md:right-8 w-10 h-10 bg-white/90 backdrop-blur-sm border border-gray-200 text-indigo-600 hover:bg-indigo-50 hover:text-indigo-800 rounded-full shadow-lg flex justify-center items-center transition-all duration-300 opacity-0 pointer-events-none z-50 no-print" title="Lên đầu trang">
<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
<path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" />
</svg>
</button>
<!-- TOAST THÔNG BÁO -->
<div id="toast" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-2xl opacity-0 transition-opacity duration-300 pointer-events-none z-50 text-center flex items-center gap-2 no-print">
<span class="text-xl">💡</span> <span id="toast-message">Nhấn Ctrl + P để in.</span>
</div>
<script id="app-engine">
window.EXAM_DATA = window.EXAM_DATA || [];
function initApp() {
const total = window.EXAM_DATA.length;
document.getElementById('total-exams-info').innerHTML = `📌 Hệ thống hiện đang tích hợp <strong>${total}</strong> đề thi.`;
document.getElementById('exam-input').value = '';
document.getElementById('exam-error').classList.add('opacity-0');
const selectEl = document.getElementById('exam-select');
selectEl.innerHTML = '<option value="" disabled selected>-- Chọn đề thi --</option>';
window.EXAM_DATA.forEach(exam => {
const opt = document.createElement('option');
opt.value = exam.id;
opt.textContent = `Đề số ${exam.id}: ${exam.title}`;
selectEl.appendChild(opt);
});
}
function syncInputs(source) {
const select = document.getElementById('exam-select');
const input = document.getElementById('exam-input');
const errorEl = document.getElementById('exam-error');
errorEl.classList.add('opacity-0');
if (source === 'select') {
input.value = select.value;
} else if (source === 'input') {
const val = parseInt(input.value);
const exists = window.EXAM_DATA.find(e => e.id === val);
if (exists) {
select.value = val;
} else {
select.value = "";
}
}
}
function handleEnter(e) {
if (e.key === 'Enter') submitExamNumber();
}
function submitExamNumber() {
const inputVal = document.getElementById('exam-input').value.trim();
const selectVal = document.getElementById('exam-select').value;
const errorEl = document.getElementById('exam-error');
let finalId = inputVal || selectVal;
if (!finalId) {
errorEl.innerText = "❌ Vui lòng chọn hoặc nhập số thứ tự đề!";
errorEl.classList.remove('opacity-0');
return;
}
const id = parseInt(finalId);
const exam = window.EXAM_DATA.find(e => e.id === id);
if (!exam) {
errorEl.innerText = `❌ Không tìm thấy Đề số ${id}. Vui lòng nhập lại!`;
errorEl.classList.remove('opacity-0');
} else {
errorEl.classList.add('opacity-0');
openExam(id);
}
}
// KÍCH HOẠT CHẾ ĐỘ AUTO-FILL DÒNG KẺ IN ẤN
function toggleFillPage() {
const isChecked = document.getElementById('fillPageToggle').checked;
if (isChecked) {
document.body.classList.add('print-full-page');
} else {
document.body.classList.remove('print-full-page');
}
}
// HÀM TẠO LƯỚI VECTOR THỦ CÔNG (CHỐNG RASTERIZE 100% VÀ TƯƠNG THÍCH LẤP ĐẦY TRANG)
function generateVectorGrid(baseHeight) {
let pathSmall = "";
let pathLarge = "";
const gridWidth = 1200;
const gridHeight = Math.max(baseHeight, 1500);
for (let y = 10; y <= gridHeight; y += 10) {
if (y % 40 === 0) pathLarge += `M 0 ${y} H ${gridWidth} `;
else pathSmall += `M 0 ${y} H ${gridWidth} `;
}
for (let x = 10; x <= gridWidth; x += 10) {
if (x % 40 === 0) pathLarge += `M ${x} 0 V ${gridHeight} `;
else pathSmall += `M ${x} 0 V ${gridHeight} `;
}
return `<svg width="100%" height="100%" class="pointer-events-none absolute inset-0" xmlns="http://www.w3.org/2000/svg">
<path d="${pathSmall}" fill="none" class="stroke-small" />
<path d="${pathLarge}" fill="none" class="stroke-large" />
</svg>`;
}
function openExam(id) {
const exam = window.EXAM_DATA.find(e => e.id === id);
if(!exam) return;
document.getElementById('exam-title-number').innerText = exam.title;
document.getElementById('exam-time').innerText = '⏱️ ' + exam.time;
document.getElementById('exam-level').innerText = '⭐ ' + exam.level;
let htmlStr = "";
const hasTracNghiem = exam.trac_nghiem && exam.trac_nghiem.length > 0;
const hasTuLuan = exam.tu_luan && exam.tu_luan.length > 0;
// ================= RENDER TRẮC NGHIỆM =================
if (hasTracNghiem) {
htmlStr += `<div class="mb-10"><h3 class="text-2xl font-bold text-indigo-700 border-b-2 border-indigo-100 pb-2 mb-6 uppercase">Phần 1: Trắc nghiệm khách quan</h3>`;
exam.trac_nghiem.forEach((q, index) => {
let maxOptLen = Math.max(...q.options.map(opt => opt.length));
let gridCols = "grid-cols-2 md:grid-cols-4";
if (maxOptLen > 60) {
gridCols = "grid-cols-1";
} else if (maxOptLen > 22) {
gridCols = "grid-cols-1 md:grid-cols-2";
}
htmlStr += `<div class="mb-8 page-break-avoid"><p class="font-bold text-lg mb-3">${q.q_title}: <span class="font-normal">${q.q_content}</span></p><div class="grid ${gridCols} gap-4">`;
q.options.forEach((opt, optIndex) => {
let isCorrect = (optIndex === q.correct_idx) ? "correct-option" : "";
let displayOpt = opt.replace(/^([A-D]\.)\s*/, '<span class="font-bold text-indigo-700 mr-2">$1</span>');
htmlStr += `<div class="${isCorrect} option-btn border-2 border-gray-200 bg-white rounded-xl p-3 min-h-[3.5rem] text-center cursor-pointer transition flex items-center justify-center hover:bg-indigo-50" onclick="selectOption(this)">${displayOpt}</div>`;
});
htmlStr += `</div>`;
if(q.explain) htmlStr += `<div class="answer-explanation mt-3 p-3 bg-yellow-50 border-l-4 border-yellow-400 text-sm text-yellow-800 rounded">${q.explain}</div>`;
htmlStr += `</div>`;
});
htmlStr += `</div>`;
}
// ================= RENDER TỰ LUẬN KÈM VỞ Ô LY VECTOR =================
if (hasTuLuan) {
exam.tu_luan.forEach((t, index) => {
let totalLines = 4;
if (t.solution) {
// BƯỚC 1: XÁC ĐỊNH VỊ TRÍ BẮT ĐẦU ĐẾM DÒNG
let countString = t.solution || "";
let startIndex = 0;
const ttIndex = countString.search(/Tóm tắt/i);
if (ttIndex !== -1) {
startIndex = ttIndex;
} else {
const bgIndex = countString.search(/Bài giải/i);
if (bgIndex !== -1) startIndex = bgIndex;
}
countString = countString.substring(startIndex);
// BƯỚC 2: ĐẾM SỐ DÒNG THỰC TẾ (CẬP NHẬT THUẬT TOÁN CHUẨN)
// Nhận diện toàn bộ các thẻ kết thúc block hoặc ngắt dòng
const lineBreaks = (countString.match(/<br[^>]*>|<\/div>|<\/li>|<\/p>/gi) || []).length;
// Bù thêm 3 dòng không gian nếu phát hiện có phép đặt tính dọc
const mathPadding = /\\begin\{array\}/i.test(countString) ? 3 : 0;
let actualLines = lineBreaks + mathPadding + 1; // +1 làm dòng đệm
if (actualLines < 4) actualLines = 4; // Tối thiểu 4 dòng
totalLines = actualLines;
}
if (t.lines_needed) {
totalLines = t.lines_needed;
}
if (index >= 1 && index <= 5) {
totalLines += 4;
}
// Tính chiều cao tối thiểu cho khung trắng (dành cho chế độ in/làm bài)
const lineSize = 40;
const workspaceHeight = totalLines * lineSize;
const vectorGridHTML = generateVectorGrid(workspaceHeight);
// Giao diện tự luận mới: Khôi phục vở ô ly khi Làm bài/In đề, ẩn đi khi Xem đáp án
let workspaceHTML = `
<div class="flex flex-col w-full gap-4 mt-2">
<!-- Vùng để học sinh làm bài: Có lưới ô ly (ẩn khi xem đáp án) -->
<div class="empty-workspace oly-bg shadow-sm relative overflow-hidden" style="min-height: ${workspaceHeight}px;">
<!-- Lề đỏ -->
<div class="absolute top-0 left-0 w-12 md:w-16 h-full border-r-2 border-red-300 bg-red-50/10 z-0"></div>
${vectorGridHTML}
</div>
<!-- Chiến thuật (Chỉ hiện khi bấm Hướng Dẫn) -->
<div class="hint-content bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded-r-lg shadow-sm">
<div class="font-bold text-yellow-800 mb-2 flex items-center gap-2">💡 CHIẾN THUẬT TƯ DUY:</div>
<div class="text-gray-700 text-sm md:text-base">${t.strategy}</div>
</div>
<!-- Nội dung giải (Hiện khi bấm Xem Đáp Án) -->
<div class="answer-explanation bg-green-50 border border-green-200 p-5 rounded-xl shadow-sm">
<div class="font-bold text-green-800 mb-3 flex items-center gap-2">📝 TRÌNH BÀY LỜI GIẢI:</div>
<div class="text-blue-900 text-lg md:text-xl font-medium leading-[2.2] tracking-wide w-full">
${t.solution}
</div>
</div>
</div>`;
// Gắn tiêu đề "Phần 2: Tự Luận" vào bài đầu tiên
let displayTitle = index === 0 ? `<span class="uppercase text-indigo-700 text-2xl font-bold block mb-4 border-b-2 border-indigo-100 pb-2">PHẦN 2: TỰ LUẬN</span>${t.t_title}` : t.t_title;
// GỠ BỎ LIST-DISC VÀ ML-5 ĐỂ LOẠI BỎ DẤU CHẤM TRÒN VÀ CĂN SÁT LỀ TRÁI
htmlStr += `
<div class="mb-12 page-break-avoid tu-luan-item">
<p class="font-bold text-lg mb-3">${displayTitle}:</p><div class="text-lg leading-relaxed">${t.t_content}</div>
<!-- Vùng vở ô ly 1 cột -->
<div class="student-workspace">
${workspaceHTML}
</div>
</div>`;
});
} else {
htmlStr += `<h3 class="text-2xl font-bold text-indigo-700 border-b-2 border-indigo-100 pb-2 mb-6 uppercase">Phần 2: Tự luận</h3><div class="text-gray-500 italic">Không có câu hỏi tự luận.</div>`;
}
document.getElementById('exam-dynamic-content').innerHTML = htmlStr;
// Khôi phục trạng thái
document.body.classList.remove('show-answers', 'show-hints', 'testing-mode', 'print-full-page');
const printToggleCb = document.getElementById('fillPageToggle');
if (printToggleCb) printToggleCb.checked = false;
resetAnswerBtn();
resetHintsBtn();
resetTestingBtn();
document.getElementById('menu-view').classList.add('hidden');
document.getElementById('exam-view').classList.remove('hidden');

{ t_title: "Bài 2", t_content: "Tìm $X$, biết:<br>a) $X + 145 = 320$<br>b) $X \\times 4 = 32$", strategy: "WHAT: Tìm thành phần chưa biết của phép tính.<br>HOW: a) Tìm số hạng chưa biết (Tổng trừ đi số hạng đã biết). b) Tìm thừa số chưa biết (Tích chia cho thừa số đã biết).", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>a) $X + 145 = 320$</div><div>$X = 320 - 145$</div><div>$X = 175$</div><div>b) $X \\times 4 = 32$</div><div>$X = 32 : 4$</div><div>$X = 8$</div>" },
{ t_title: "Bài 3", t_content: "Tìm các chữ số thích hợp thay thế cho dấu $(*)$ trong $4$&nbsp;phép tính sau:<div class='text-center text-xl my-4'>$\\begin{array}{cl} & 4 \\ * \\\\\\\\ + & 2 \\ 7 \\\\\\\\ \\hline & 7 \\ 2 \\end{array} \\qquad\\qquad \\begin{array}{cl} & 8 \\ 3 \\\\\\\\ - & * \\ 6 \\\\\\\\ \\hline & 4 \\ 7 \\end{array} \\qquad\\qquad \\begin{array}{cl} & * \\ 5 \\\\\\\\ + & 3 \\ * \\\\\\\\ \\hline & 8 \\ 4 \\end{array} \\qquad\\qquad \\begin{array}{cl} & 9 \\ * \\\\\\\\ - & * \\ 8 \\\\\\\\ \\hline & 3 \\ 4 \\end{array}$</div>*(Ghi chú: Lần lượt gọi các phép tính từ trái qua phải là phép tính a, b, c, d)*", strategy: "WHAT: Tìm các chữ số bị ẩn trong $4$&nbsp;phép tính cộng trừ đặt dọc có nhớ.<br>HOW: Phân tích từ hàng đơn vị sang hàng chục. Chú ý các phép tính mượn/nhớ.<br>  * Phép a: Hàng đơn vị $* + 7 = 12$&nbsp;(vì kết quả là $2$).<br>  * Phép b: Hàng đơn vị $13 - 6 = 7$&nbsp;(mượn $1$). Hàng chục $8 - * - 1\\text{ (mượn)} = 4$.<br>WHY: Sự kết nối giữa hàng đơn vị và hàng chục chính là \"chìa khóa\" khôi phục phép tính.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>a) Phép tính: $4* + 27 = 72$. Hàng đơn vị: $* + 7 = 12 \\rightarrow * = 5$&nbsp;(nhớ $1$&nbsp;sang hàng chục). Hàng chục: $4 + 2 + 1 = 7$&nbsp;(Đúng). $\\rightarrow$&nbsp;Phép tính là: $\\mathbf{45} + \\mathbf{27} = \\mathbf{72}$.</div><div>b) Phép tính: $83 - *6 = 47$. Hàng đơn vị: $13 - 6 = 7$&nbsp;(mượn $1$&nbsp;ở hàng chục). Hàng chục: $8 - * - 1\\text{ (mượn)} = 4 \\rightarrow 7 - * = 4 \\rightarrow * = 3$. $\\rightarrow$&nbsp;Phép tính là: $\\mathbf{83} - \\mathbf{36} = \\mathbf{47}$.</div><div>c) Phép tính: $*5 + 3* = 84$. Hàng đơn vị: $5 + * = 14 \\rightarrow * = 9$&nbsp;(nhớ $1$). Hàng chục: $* + 3 + 1\\text{ (nhớ)} = 8 \\rightarrow * + 4 = 8 \\rightarrow * = 4$. $\\rightarrow$&nbsp;Phép tính là: $\\mathbf{45} + \\mathbf{39} = \\mathbf{84}$.</div><div>d) Phép tính: $9* - *8 = 34$. Hàng đơn vị: $* - 8 = 4 \\rightarrow$&nbsp;phải là $12 - 8 = 4 \\rightarrow * = 2$&nbsp;(mượn $1$&nbsp;ở hàng chục). Hàng chục: $9 - * - 1\\text{ (mượn)} = 3 \\rightarrow 8 - * = 3 \\rightarrow * = 5$. $\\rightarrow$&nbsp;Phép tính là: $\\mathbf{92} - \\mathbf{58} = \\mathbf{34}$.</div>" },
{ t_title: "Bài 4", t_content: "Cô giáo có $50$&nbsp;quyển vở. Cô thưởng đều cho $5$&nbsp;bạn học sinh có thành tích xuất sắc, mỗi bạn nhận được $4$&nbsp;quyển vở. Hỏi sau khi thưởng xong, cô giáo còn lại bao nhiêu quyển vở?", strategy: "WHAT: Bài toán giải bằng $2$&nbsp;bước tính.<br>HOW: Bước $1$: Tìm tổng số vở cô đã thưởng cho $5$&nbsp;bạn (phép nhân). Bước $2$: Tìm số vở cô còn lại (phép trừ).<br>WHY: Phải biết cô đã phát đi bao nhiêu quyển thì mới tính được cô còn lại bao nhiêu từ tổng số ban đầu.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Cô giáo đã thưởng cho các bạn tất cả số quyển vở là:</div><div>$4 \\times 5 = 20$&nbsp;(quyển vở)</div><div>*(Hoặc $5 \\times 4$&nbsp;đều được chấp nhận)*</div><div>Sau khi thưởng xong, cô giáo còn lại số quyển vở là:</div><div>$50 - 20 = 30$&nbsp;(quyển vở)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $30$&nbsp;quyển vở.</span></div>" },

v><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $14$&nbsp;khối.</span></div>" },
{ t_title: "Bài 6", t_content: "Hai bạn An và Bình có tổng cộng $40$&nbsp;viên bi. An nói với Bình: \"Nếu tớ cho cậu $5$&nbsp;viên bi thì số bi của hai đứa mình sẽ bằng nhau\". Hỏi lúc đầu mỗi bạn có bao nhiêu viên bi?", strategy: "WHAT: Tìm số lượng ban đầu của hai bạn dựa trên tổng và điều kiện \"cho-nhận\".<br>HOW: Phương pháp \"San bằng\". Khi hai bạn bằng nhau, mỗi bạn có bao nhiêu? ($40 : 2 = 20$). Để có $20$&nbsp;viên, An đã phải cho đi $5$&nbsp;viên $\\rightarrow$&nbsp;Tính số bi ban đầu của An. Để có $20$&nbsp;viên, Bình đã nhận thêm $5$&nbsp;viên $\\rightarrow$&nbsp;Tính số bi ban đầu của Bình.<br>WHY: Khi có sự dịch chuyển nội bộ giữa hai bạn, TỔNG SỐ BI không bao giờ thay đổi (vẫn là $40$).", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Nếu An cho Bình $5$&nbsp;viên bi thì tổng số bi của hai bạn vẫn không thay đổi (là $40$&nbsp;viên).</div><div>Khi số bi của hai đứa bằng nhau, mỗi bạn sẽ có số viên bi là:</div><div>$40 : 2 = 20$&nbsp;(viên bi)</div><div>Lúc đầu, An có số viên bi là:</div><div>$20 + 5 = 25$&nbsp;(viên bi)</div><div>Lúc đầu, Bình có số viên bi là:</div><div>$20 - 5 = 15$&nbsp;(viên bi)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: An: $25$&nbsp;viên bi; Bình: $15$&nbsp;viên bi.</span></div>" }

{ q_title: "Câu 7", q_content: "Một phần ba của $27\\text{ kg}$&nbsp;là:", options: ["A. $8\\text{ kg}$", "B. $9\\text{ kg}$", "C. $7\\text{ kg}$", "D. $6\\text{ kg}$"], correct_idx: 1, explain: "Một phần ba nghĩa là lấy số đó chia cho $3$. $27 : 3 = 9$. Chọn B." },
{ q_title: "Câu 8", q_content: "Tìm $X$, biết $X \\times 3 = 24$. Giá trị của $X$&nbsp;là:", options: ["A. $7$", "B. $6$", "C. $8$", "D. $9$"], correct_idx: 2, explain: "Tìm thừa số chưa biết: $24 : 3 = 8$. Chọn C." },
{ q_title: "Câu 9", q_content: "Hình vuông có bao nhiêu góc vuông?", options: ["A. $2$&nbsp;góc vuông", "B. $3$&nbsp;góc vuông", "C. $4$&nbsp;góc vuông", "D. $5$&nbsp;góc vuông"], correct_idx: 2, explain: "Nhận biết hình học cơ bản. Hình vuông luôn có $4$&nbsp;góc vuông. Chọn C." },
{ q_title: "Câu 10", q_content: "Độ dài đường gấp khúc gồm $4$&nbsp;đoạn thẳng, mỗi đoạn dài $5\\text{ cm}$&nbsp;là:", options: ["A. $9\\text{ cm}$", "B. $15\\text{ cm}$", "C. $25\\text{ cm}$", "D. $20\\text{ cm}$"], correct_idx: 3, explain: "Độ dài đường gấp khúc bằng tổng các đoạn thẳng, vì các đoạn bằng nhau nên dùng phép nhân: $4 \\times 5 = 20\\text{ cm}$. Chọn D." },
{ q_title: "Câu 11", q_content: "Bạn Lan có $4$&nbsp;hộp bút, mỗi hộp có $6$&nbsp;chiếc bút. Lan tặng bạn $5$&nbsp;chiếc. Hỏi Lan còn lại bao nhiêu chiếc bút?", options: ["A. $19$&nbsp;chiếc", "B. $29$&nbsp;chiếc", "C. $24$&nbsp;chiếc", "D. $15$&nbsp;chiếc"], correct_idx: 0, explain: "Tính tổng số bút ban đầu: $4 \\times 6 = 24$. Sau đó trừ đi phần đã tặng: $24 - 5 = 19$. Chọn A." },
{ q_title: "Câu 12", q_content: "Tìm quy luật và điền số tiếp theo vào chỗ chấm: $2, 4, 8, 14, 22, \\dots$", options: ["A. $28$", "B. $30$", "C. $32$", "D. $34$"], correct_idx: 2, explain: "Tính khoảng cách giữa các số: $+2, +4, +6, +8$. Khoảng cách tiếp theo là $+10$. $22 + 10 = 32$. Chọn C." }

tu_luan: [
{ t_title: "Bài 1", t_content: "Đặt tính rồi tính:<br>a) $465 + 287$<br>b) $702 - 358$<br>c) $356 + 182$<br>d) $500 - 128$<br>e) $24 \\times 3$<br>f) $12 \\times 4$<br>g) $123 \\times 3$<br>h) $204 \\times 4$", strategy: "WHAT: Kiểm tra kỹ năng tính toán nền tảng, bao gồm cộng trừ có nhớ qua mốc $10$&nbsp;và đặt tính nhân số có $2, 3$&nbsp;chữ số.<br>HOW: Viết thẳng cột các chữ số cùng hàng. Khi nhân, lấy số có một chữ số nhân lần lượt từ phải sang trái (hàng đơn vị, hàng chục, hàng trăm).<br>WHY: Việc rèn luyện đặt tính giúp bé làm quen với sự cẩn thận, nắm vững cách \"nhớ\" số sang hàng tiếp theo.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Học sinh tự đặt tính thẳng cột (cột dọc):</div><div>a) $465 + 287 = 752$</div><div>b) $702 - 358 = 344$</div><div>c) $356 + 182 = 538$</div><div>d) $500 - 128 = 372$</div><div>e) $24 \\times 3 = 72$</div><div>f) $12 \\times 4 = 48$</div><div>g) $123 \\times 3 = 369$</div><div>h) $204 \\times 4 = 816$</div>" },
{ t_title: "Bài 2", t_content: "Tính giá trị biểu thức và tìm $X$, biết:<br>a) $100 - 36 : 4$<br>b) $X - 145 = 3 \\times 9$", strategy: "WHAT: Ưu tiên phép tính trong biểu thức và tìm thành phần chưa biết của phép trừ.<br>HOW: Biểu thức có trừ và chia, phải làm chia trước. Tìm $X$&nbsp;có vế phải là phép nhân, phải tính vế phải trước rồi áp dụng quy tắc \"Tìm số bị trừ\".<br>WHY: Rèn luyện học sinh không hấp tấp tính từ trái qua phải, phân biệt được cấu trúc của bài \"Tìm $X$\" nâng cao.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>a) $100 - 36 : 4$</div><div>$= 100 - 9$</div><div>$= 91$</div><div>b) $X - 145 = 3 \\times 9$</div><div>$X - 145 = 27$</div><div>$X = 27 + 145$</div><div>$X = 172$</div>" },
{ t_title: "Bài 3", t_content: "Hình vẽ bên dưới có tất cả bao nhiêu hình tam giác? Kể tên các hình tam giác đó.<br><svg viewBox='0 0 200 120' class='w-48 h-auto mx-auto my-3'><polygon points='100,20 20,100 180,100' fill='none' stroke='#3b82f6' stroke-width='2'/><line x1='100' y1='20' x2='60' y2='100' stroke='#3b82f6' stroke-width='2'/><line x1='100' y1='20' x2='100' y2='100' stroke='#3b82f6' stroke-width='2'/><line x1='100' y1='20' x2='140' y2='100' stroke='#3b82f6' stroke-width='2'/><text x='100' y='15' font-size='12' text-anchor='middle'>A</text><text x='15' y='105' font-size='12' text-anchor='middle'>B</text><text x='185' y='105' font-size='12' text-anchor='middle'>C</text><text x='60' y='115' font-size='12' text-anchor='middle'>D</text><text x='100' y='115' font-size='12' text-anchor='middle'>E</text><text x='140' y='115' font-size='12' text-anchor='middle'>F</text></svg>", strategy: "WHAT: Đếm số hình tam giác lồng ghép trong một tam giác lớn.<br>HOW: Đánh số thứ tự các hình tam giác đơn nhỏ nhất (từ $1$&nbsp;đến $4$). Liệt kê theo nhóm: Hình đơn ($4$&nbsp;hình), ghép $2$&nbsp;hình ($3$&nbsp;hình), ghép $3$&nbsp;hình ($2$&nbsp;hình), ghép $4$&nbsp;hình ($1$&nbsp;hình). Tổng: $4+3+2+1$.<br>WHY: Nếu chỉ đếm bằng mắt sẽ dễ bị sót. Phương pháp quy nạp (chia để trị) giúp kiểm soát $100\\%$.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Hình vẽ có tất cả <strong>$10$</strong> hình tam giác. Ghi chú tên các đỉnh trên đáy từ trái sang phải là $B, D, E, F, C$.</div><div>- Hình tam giác đơn (gồm $1$&nbsp;phần): $ABD, ADE, AEF, AFC$&nbsp;($4$&nbsp;hình).</div><div>- Hình tam giác ghép từ $2$&nbsp;phần: $ABE, ADF, AEC$&nbsp;($3$&nbsp;hình).</div><div>- Hình tam giác ghép từ $3$&nbsp;phần: $ABF, ADC$&nbsp;($2$&nbsp;hình).</div><div>- Hình tam giác lớn (ghép từ $4$&nbsp;phần): $ABC$&nbsp;($1$&nbsp;hình).</div><div>Tổng cộng: $4 + 3 + 2 + 1 = 10$&nbsp;(hình).</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $10$&nbsp;hình tam giác.</span></div>" },
{ t_title: "Bài 4", t_content: "Trong vườn trường, đội thứ nhất trồng được $4$&nbsp;luống hoa, mỗi luống có $8$&nbsp;cây hoa. Đội thứ hai trồng được nhiều hơn đội thứ nhất $15$&nbsp;cây hoa. Hỏi cả hai đội trồng được tất cả bao nhiêu cây hoa?", strategy: "WHAT: Bài toán giải bằng $3$&nbsp;bước tính nhỏ (tính tổng $2$&nbsp;nhóm).<br>HOW: Tính số cây đội $1$&nbsp;(nhân). Tính số cây đội $2$&nbsp;(cộng phần nhiều hơn). Tính tổng cả hai đội.<br>WHY: Bẫy thường gặp là học sinh chỉ tính số cây đội $2$&nbsp;rồi dừng lại, quên mất câu hỏi cuối cùng là tính \"cả hai đội\".", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Đội thứ nhất trồng được số cây hoa là: $4 \\times 8 = 32$&nbsp;(cây)</div><div>Đội thứ hai trồng được số cây hoa là: $32 + 15 = 47$&nbsp;(cây)</div><div>Cả hai đội trồng được tất cả số cây hoa là: $32 + 47 = 79$&nbsp;(cây)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $79$&nbsp;cây hoa.</span></div>" },
{ t_title: "Bài 5", t_content: "Điền các số $1, 2, 3, 4, 5, 6$&nbsp;vào các ô tròn trên $3$&nbsp;cạnh của một hình tam giác (như hình vẽ) sao cho tổng $3$&nbsp;số trên mỗi cạnh đều bằng $10$. (Mỗi số chỉ được sử dụng một lần).<br><svg viewBox='0 0 200 180' class='w-40 h-auto mx-auto my-3'><polygon points='100,30 30,150 170,150' fill='none' stroke='#3b82f6' stroke-width='2'/><circle cx='100' cy='30' r='14' fill='white' stroke='#2563eb' stroke-width='2'/><circle cx='30' cy='150' r='14' fill='white' stroke='#2563eb' stroke-width='2'/><circle cx='170' cy='150' r='14' fill='white' stroke='#2563eb' stroke-width='2'/><circle cx='65' cy='90' r='14' fill='white' stroke='#2563eb' stroke-width='2'/><circle cx='135' cy='90' r='14' fill='white' stroke='#2563eb' stroke-width='2'/><circle cx='100' cy='150' r='14' fill='white' stroke='#2563eb' stroke-width='2'/></svg>", strategy: "WHAT: Sắp xếp $6$&nbsp;số tự nhiên vào \"tam giác ma thuật\" sao cho tổng $3$&nbsp;số trên mỗi cạnh đều bằng $10$.<br>HOW: Tổng $3$&nbsp;cạnh là $10 \\times 3 = 30$. Khi cộng $3$&nbsp;cạnh, các số ở $3$&nbsp;góc (đỉnh) được cộng $2$&nbsp;lần. Tổng $6$&nbsp;số từ $1$&nbsp;đến $6$&nbsp;là $21$. Sự chênh lệch $30 - 21 = 9$&nbsp;chính là tổng của $3$&nbsp;số ở góc. Các số ($1, 2, 3, 4, 5, 6$) mà có $3$&nbsp;số cộng lại bằng $9$&nbsp;là: $1+2+6=9$; $1+3+5=9$; $2+3+4=9$. Chọn thử một bộ đặt vào $3$&nbsp;góc và tính các số ở giữa.<br>WHY: Nhận diện được \"số ở góc bị lặp lại\" là chìa khóa giải các bài toán ma phương hình đa giác.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Tổng của cả $6$&nbsp;số là: $1 + 2 + 3 + 4 + 5 + 6 = 21$.</div><div>Tổng của $3$&nbsp;cạnh tam giác là: $10 \\times 3 = 30$.</div><div>Vì $3$&nbsp;ô ở các góc được tính $2$&nbsp;lần (khi cộng các cạnh), nên tổng $3$&nbsp;số ở $3$&nbsp;góc là: $30 - 21 = 9$.</div><div>Ba số khác nhau trong nhóm ($1, 2, 3, 4, 5, 6$) có tổng bằng $9$&nbsp;là: $1 + 3 + 5 = 9$&nbsp;hoặc $1 + 2 + 6 = 9$&nbsp;hoặc $2 + 3 + 4 = 9$.</div><div>- Chọn nhóm $1, 3, 5$&nbsp;đặt ở $3$&nbsp;đỉnh (góc):<br>+ Cạnh chứa $1$&nbsp;và $3$, ô ở giữa là: $10 - (1+3) = 6$.<br>+ Cạnh chứa $1$&nbsp;và $5$, ô ở giữa là: $10 - (1+5) = 4$.<br>+ Cạnh chứa $3$&nbsp;và $5$, ô ở giữa là: $10 - (3+5) = 2$. (Thỏa mãn dùng đủ $6$&nbsp;số $1,2,3,4,5,6$).</div><div>*(Học sinh chỉ cần vẽ lại hình và điền đúng $1$&nbsp;trường hợp - $3$&nbsp;số đỉnh là $1,3,5$&nbsp;và $3$&nbsp;số giữa là $6,4,2$&nbsp;tương ứng - là đạt điểm tối đa).*</div>" },
{ t_title: "Bài 6", t_content: "Mẹ mua cho hai anh em một số đồ chơi. Biết rằng nếu mẹ mua thêm cho anh $4$&nbsp;chiếc đồ chơi, và em làm mất đi $2$&nbsp;chiếc đồ chơi thì lúc này số đồ chơi của hai anh em sẽ bằng nhau, đồng thời tổng số đồ chơi của cả hai anh em lúc này là $20$&nbsp;chiếc. Hỏi lúc đầu anh có bao nhiêu chiếc đồ chơi, em có bao nhiêu chiếc đồ chơi?", strategy: "WHAT: Tìm số đồ chơi ban đầu của hai anh em, dựa trên dữ kiện đã bị thay đổi (thêm/bớt) để \"bằng nhau\".<br>HOW: Phương pháp đi ngược từ cuối. Khi hai anh em bằng nhau và tổng là $20$, tính được số lượng của mỗi người lúc đó ($20 : 2 = 10$). Sau đó, tính ngược lại: Anh có thêm $4$&nbsp;mới được $10$&nbsp;(phép trừ). Em mất đi $2$&nbsp;mới còn $10$&nbsp;(phép cộng).<br>WHY: Phải bám vào cột mốc \"hiện tại\" (bằng nhau, tổng $20$) để suy ngược về \"quá khứ\" (lúc đầu).", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Lúc sau, số đồ chơi của hai anh em bằng nhau và tổng là $20$&nbsp;chiếc, nên lúc đó mỗi người có số chiếc đồ chơi là: $20 : 2 = 10$&nbsp;(chiếc)</div><div>Lúc đầu, anh có số chiếc đồ chơi là: $10 - 4 = 6$&nbsp;(chiếc)</div><div>Lúc đầu, em có số chiếc đồ chơi là: $10 + 2 = 12$&nbsp;(chiếc)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: Anh: $6$&nbsp;chiếc; Em: $12$&nbsp;chiếc.</span></div>" }
]
});

{ t_title: "Bài 1", t_content: "Đặt tính rồi tính:<br>*(Lưu ý: Học sinh phải đặt tính dọc, thẳng cột)*<br>a) $348 + 475$<br>b) $810 - 256$<br>c) $593 + 128$<br>d) $905 - 437$<br>e) $43 \\times 6$<br>f) $15 \\times 7$<br>g) $108 \\times 6$<br>h) $112 \\times 7$", strategy: "WHAT: Kiểm tra kỹ năng cộng trừ có nhớ nhiều lần trong phạm vi $1000$&nbsp;và kỹ năng đặt tính nhân số có $2, 3$&nbsp;chữ số với $6, 7$.<br>HOW: Viết các số thẳng cột theo hàng đơn vị, hàng chục, hàng trăm. Thực hiện tính từ phải sang trái.<br>WHY: Rèn tính cẩn thận, nắm vững cách nhớ khi phép cộng/nhân vượt qua mốc $10$.<br>WHERE/WHEN/WHAT NEXT: Chú ý các phép nhân có nhớ (Ví dụ $43 \\times 6$: $3 \\times 6 = 18$&nbsp;nhớ $1$, $4 \\times 6 = 24$&nbsp;thêm $1$&nbsp;là $25$).", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Học sinh tự đặt tính thẳng cột (cột dọc):</div><div>a) $348 + 475 = 823$</div><div>b) $810 - 256 = 554$</div><div>c) $593 + 128 = 721$</div><div>d) $905 - 437 = 468$</div><div>e) $43 \\times 6 = 258$</div><div>f) $15 \\times 7 = 105$</div><div>g) $108 \\times 6 = 648$</div><div>h) $112 \\times 7 = 784$</div>" },
{ t_title: "Bài 2", t_content: "Tính giá trị biểu thức và tìm $X$, biết:<br>a) $125 - 42 : 6 + 18$<br>b) $X \\times 7 = 100 - 37$", strategy: "WHAT: Tính toán biểu thức có chứa nhiều phép tính và Tìm $X$&nbsp;ở dạng mở rộng.<br>HOW: Với biểu thức a): Tính chia trước, cộng trừ từ trái sang phải. Với câu b): Tính kết quả vế phải trước, sau đó dùng quy tắc tìm thừa số chưa biết.<br>WHY: Phá bỏ thói quen tính từ trái qua phải của học sinh yếu, củng cố quy tắc ưu tiên.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>a) $125 - 42 : 6 + 18$</div><div>$= 125 - 7 + 18$</div><div>$= 118 + 18$</div><div>$= 136$</div><div>b) $X \\times 7 = 100 - 37$</div><div>$X \\times 7 = 63$</div><div>$X = 63 : 7$</div><div>$X = 9$</div>" },
{ t_title: "Bài 3", t_content: "Quan sát hình vẽ bên dưới. Em hãy đếm xem có tất cả bao nhiêu hình tứ giác?<br><svg viewBox='0 0 200 200' class='w-48 h-auto mx-auto my-3'><rect x='20' y='20' width='160' height='160' fill='none' stroke='#3b82f6' stroke-width='2'/><line x1='20' y1='100' x2='180' y2='100' stroke='#3b82f6' stroke-width='2'/><line x1='100' y1='20' x2='100' y2='180' stroke='#3b82f6' stroke-width='2'/><line x1='20' y1='20' x2='180' y2='180' stroke='#3b82f6' stroke-width='2'/><text x='10' y='15' font-size='12'>A</text><text x='185' y='15' font-size='12'>B</text><text x='185' y='195' font-size='12'>C</text><text x='10' y='195' font-size='12'>D</text><text x='105' y='95' font-size='12'>O</text></svg>", strategy: "WHAT: Đếm số hình tứ giác trong một hình vuông bị chia cắt phức tạp bởi các đường thẳng vuông góc và đường chéo.<br>HOW: Sử dụng phương pháp đánh số các mảnh ghép đơn (tam giác nhỏ, hình vuông nhỏ). Liệt kê các tứ giác ghép từ $2$&nbsp;mảnh, $3$&nbsp;mảnh, $4$&nbsp;mảnh. (Bao gồm cả hình vuông, hình chữ nhật và các hình thang/tứ giác bất kỳ).<br>WHY: Rèn luyện khả năng quan sát bao quát, tránh việc chỉ đếm hình vuông/hình chữ nhật mà bỏ quên các tứ giác chéo.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Đánh số các mảnh đơn giản nhất từ $1$&nbsp;đến $6$&nbsp;(có cả tam giác và hình vuông nhỏ). Liệt kê theo nhóm:</div><div>- Các tứ giác đơn (hình vuông nhỏ không bị chia cắt): $2$&nbsp;hình (ô vuông góc trên phải, ô vuông góc dưới trái).</div><div>- Các tứ giác ghép từ $2$&nbsp;mảnh: $4$&nbsp;hình ($2$&nbsp;hình chữ nhật ghép dọc/ngang nửa hình vuông lớn, và $2$&nbsp;tứ giác tạo bởi đường chéo và đường vuông góc).</div><div>- Các tứ giác ghép từ $3$&nbsp;mảnh: $0$&nbsp;hình.</div><div>- Các tứ giác ghép từ $4$&nbsp;mảnh: $2$&nbsp;hình ($2$&nbsp;nửa tam giác lớn của hình vuông).</div><div>- Tứ giác lớn nhất bao ngoài (hình vuông to): $1$&nbsp;hình.</div><div>*(Quá trình liệt kê có thể linh hoạt theo cách nhìn nhận của học sinh).*</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: Có tất cả $9$&nbsp;hình tứ giác.</span></div>" },
{ t_title: "Bài 4", t_content: "Năm nay bé Mai $6$&nbsp;tuổi. Tuổi của mẹ gấp $6$&nbsp;lần tuổi của bé Mai. Hỏi $4$&nbsp;năm nữa, mẹ hơn bé Mai bao nhiêu tuổi?", strategy: "WHAT: Bài toán tính tuổi lồng ghép bất biến \"Hiệu số tuổi không đổi\".<br>HOW: Bước 1: Tính tuổi mẹ hiện nay (bảng nhân $6$). Bước 2: Tính hiệu số tuổi hiện nay (phép trừ). Bước 3: Kết luận hiệu số tuổi $4$&nbsp;năm sau (vẫn giữ nguyên).<br>WHY: Đây là \"bẫy\" kinh điển. Học sinh không nắm chắc bản chất sẽ lấy tuổi mỗi người cộng thêm $4$&nbsp;rồi mới trừ, làm bài toán dài dòng và dễ sai. Hoặc lấy luôn hiệu cộng thêm $4$&nbsp;là sai hoàn toàn.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Năm nay tuổi của mẹ là:</div><div>$6 \\times 6 = 36$&nbsp;(tuổi)</div><div>Hiện nay, mẹ hơn bé Mai số tuổi là:</div><div>$36 - 6 = 30$&nbsp;(tuổi)</div><div>Vì mỗi năm mỗi người đều tăng thêm $1$&nbsp;tuổi nên hiệu số tuổi của hai người không bao giờ thay đổi theo thời gian. Vậy $4$&nbsp;năm nữa, mẹ vẫn hơn bé Mai $30$&nbsp;tuổi.</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $30$&nbsp;tuổi.</span></div>" },
{ t_title: "Bài 5", t_content: "Trong một chiếc hộp kín có $18$&nbsp;viên bi màu xanh, $14$&nbsp;viên bi màu đỏ và $9$&nbsp;viên bi màu vàng. Không nhìn vào hộp, em cần bốc ra ít nhất bao nhiêu viên bi để CHẮC CHẮN trong số các viên bi vừa bốc có ít nhất $1$&nbsp;viên bi màu vàng?", strategy: "WHAT: Nguyên lý Dirichlet (Bốc bi) - dạng toán tìm số lượng ít nhất để chắc chắn có $1$&nbsp;viên màu yêu cầu.<br>HOW: Giả sử trường hợp \"xui xẻo nhất\": bốc phải toàn bộ các màu KHÔNG PHẢI là màu vàng (tức là bốc hết bi xanh và bi đỏ). Sau đó cộng thêm đúng $1$&nbsp;viên nữa (viên này chắc chắn phải là màu vàng vì trong hộp hết màu khác rồi).<br>WHY: Rèn luyện tư duy lập luận logic về sự \"chắc chắn tuyệt đối\".<br>WHERE/WHEN/WHAT NEXT: Tính tổng (Xanh + Đỏ) rồi $+ 1$.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Trường hợp \"xui xẻo nhất\", ta bốc toàn bộ số bi màu xanh và bi màu đỏ trong hộp mà vẫn chưa có viên bi màu vàng nào. Số bi tối đa bốc ra trong trường hợp này là:</div><div>$18 + 14 = 32$&nbsp;(viên bi)</div><div>Lúc này, trong hộp chỉ còn lại toàn bộ là bi màu vàng. Để chắc chắn có ít nhất $1$&nbsp;viên bi màu vàng, ta chỉ cần bốc thêm $1$&nbsp;viên bi nữa. Số viên bi ít nhất cần bốc ra là:</div><div>$32 + 1 = 33$&nbsp;(viên bi)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $33$&nbsp;viên bi.</span></div>" },
{ t_title: "Bài 6", t_content: "Bác thợ mộc có một khúc gỗ dài $42\\text{ dm}$. Bác muốn cưa khúc gỗ đó thành các đoạn ngắn bằng nhau, mỗi đoạn dài $7\\text{ dm}$. Biết rằng mỗi nhát cưa bác mất $3$&nbsp;phút. Hỏi bác thợ mộc phải mất bao nhiêu phút để cưa xong khúc gỗ đó? (Biết bác cưa liên tục không nghỉ và không ghép các khúc gỗ lại với nhau).", strategy: "WHAT: Bài toán cưa gỗ (ứng dụng của toán trồng cây không khép kín) lồng ghép tính toán thời gian.<br>HOW: Bước 1: Tính số đoạn gỗ (Phép chia $7$). Bước 2: Tính số nhát cưa (Số đoạn - $1$). Bước 3: Tính tổng thời gian (Số nhát cưa $\\times 3$&nbsp;phút).<br>WHY: Sự liên hệ giữa \"Số khoảng cách\" (số đoạn) và \"Số điểm chia\" (số nhát cưa) là chìa khóa. Nếu không trừ $1$&nbsp;nhát cưa cuối cùng (vì nhát cuối cắt đôi phần còn lại thành $2$&nbsp;đoạn) sẽ tính sai thời gian.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Số đoạn gỗ ngắn bác thợ mộc cưa được là:</div><div>$42 : 7 = 6$&nbsp;(đoạn)</div><div>Vì nhát cưa cuối cùng sẽ chia khúc gỗ còn lại thành $2$&nbsp;đoạn, nên số nhát cưa bác thợ mộc cần thực hiện là:</div><div>$6 - 1 = 5$&nbsp;(nhát cưa)</div><div>Thời gian bác thợ mộc cưa xong khúc gỗ đó là:</div><div>$5 \\times 3 = 15$&nbsp;(phút)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $15$&nbsp;phút.</span></div>" }
]

tu_luan: [
{ t_title: "Bài 1", t_content: "Đặt tính rồi tính:<br>*(Lưu ý: Học sinh phải đặt tính dọc, thẳng cột)*<br>a) $345 + 568$<br>b) $702 - 346$<br>c) $829 + 171$<br>d) $650 - 284$<br>e) $45 \\times 6$<br>f) $87 \\times 5$<br>g) $106 \\times 7$<br>h) $128 \\times 4$", strategy: "WHAT: Kiểm tra năng lực \"đặt tính\" (cộng trừ có nhớ nhiều lần và nhân số $2, 3$&nbsp;chữ số với $1$&nbsp;chữ số).<br>HOW: Đặt thẳng cột theo hàng. Với phép nhân, nhân từ hàng đơn vị sang trái, nhớ cộng dồn vào hàng tiếp theo.<br>WHY: Rèn sự cẩn thận và thuộc lòng các bảng nhân $4, 5, 6, 7$.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Học sinh tự đặt tính thẳng cột (cột dọc):</div><div>a) $345 + 568 = 913$</div><div>b) $702 - 346 = 356$</div><div>c) $829 + 171 = 1000$</div><div>d) $650 - 284 = 366$</div><div>e) $45 \\times 6 = 270$</div><div>f) $87 \\times 5 = 435$</div><div>g) $106 \\times 7 = 742$</div><div>h) $128 \\times 4 = 512$</div>" },
{ t_title: "Bài 2", t_content: "Tính giá trị biểu thức và tìm $X$, biết:<br>a) $315 - 54 : 6 + 29$<br>b) $150 - X = 7 \\times 9$", strategy: "WHAT: Thứ tự thực hiện phép tính và tìm thành phần chưa biết.<br>HOW: a) Nhân/chia trước, cộng/trừ sau. b) Rút gọn vế phải thành một số cụ thể, sau đó tìm Số trừ.<br>WHERE/WHEN/WHAT NEXT: Chú ý b) Tìm số trừ ta lấy Số bị trừ trừ đi Hiệu ($150 - 63$). Học sinh yếu hay lấy Hiệu cộng Số bị trừ.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>a) $315 - 54 : 6 + 29$</div><div>$= 315 - 9 + 29$</div><div>$= 306 + 29$</div><div>$= 335$</div><div>b) $150 - X = 7 \\times 9$</div><div>$150 - X = 63$</div><div>$X = 150 - 63$</div><div>$X = 87$</div>" },
{ t_title: "Bài 3", t_content: "Quan sát hình vẽ bên dưới. Em hãy đếm xem có tất cả bao nhiêu hình tam giác?<br><svg viewBox='0 0 200 180' class='w-48 h-auto mx-auto my-3'><polygon points='100,20 20,160 180,160' fill='none' stroke='#3b82f6' stroke-width='2'/><line x1='60' y1='90' x2='140' y2='90' stroke='#3b82f6' stroke-width='2'/><line x1='100' y1='20' x2='73' y2='160' stroke='#3b82f6' stroke-width='2'/><line x1='100' y1='20' x2='127' y2='160' stroke='#3b82f6' stroke-width='2'/><text x='100' y='15' font-size='12' text-anchor='middle'>A</text><text x='15' y='165' font-size='12' text-anchor='middle'>B</text><text x='185' y='165' font-size='12' text-anchor='middle'>C</text><text x='50' y='85' font-size='12' text-anchor='middle'>M</text><text x='150' y='85' font-size='12' text-anchor='middle'>N</text></svg>", strategy: "WHAT: Đếm hình tam giác lồng ghép và phân tầng.<br>HOW: Đánh số hoặc đếm theo phương pháp cấu trúc. Đếm số tam giác ở \"tầng trên\" (do đường ngang MN tạo ra), sau đó đếm số tam giác lớn toàn hình (do đáy BC tạo ra).<br>WHY: Nếu chỉ đếm các mảnh ghép đơn sẽ bị sót các tam giác ghép đôi, ghép ba. Hình có tính đối xứng nên đếm theo quy luật sẽ nhanh hơn.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Đếm số hình tam giác ở tầng nhỏ phía trên (đỉnh A, đáy MN):</div><div>Có $3$&nbsp;tam giác đơn. Có $2$&nbsp;tam giác ghép đôi. Có $1$&nbsp;tam giác lớn bao ngoài. Tổng cộng tầng trên có: $3 + 2 + 1 = 6$&nbsp;(hình tam giác).</div><div>Đếm số hình tam giác lớn (đỉnh A, đáy BC):</div><div>Tương tự, đáy BC được chia làm $3$&nbsp;đoạn nhỏ nên sẽ tạo ra: Có $3$&nbsp;tam giác đơn. Có $2$&nbsp;tam giác ghép đôi. Có $1$&nbsp;tam giác to nhất (ABC). Tổng cộng hình lớn có: $3 + 2 + 1 = 6$&nbsp;(hình tam giác).</div><div>Tổng số hình tam giác có trong hình vẽ là:</div><div>$6 + 6 = 12$&nbsp;(hình tam giác).</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $12$&nbsp;hình tam giác.</span></div>" },
{ t_title: "Bài 4", t_content: "Nhà bạn Hoa có nuôi $42$&nbsp;con gà. Số con vịt nhà Hoa nuôi bằng một phần bảy số con gà. Hỏi nhà Hoa nuôi tất cả bao nhiêu con gà và vịt?", strategy: "WHAT: Bài toán giải bằng $2$&nbsp;bước tính (rút về một phần mấy).<br>HOW: Bước 1: Tính số vịt (chia $7$). Bước 2: Tính tổng số gà và vịt (phép cộng).<br>WHERE/WHEN/WHAT NEXT: Rất nhiều học sinh dừng lại ở Bước 1 và lấy đáp án đó làm kết quả cuối cùng. Chú ý từ khóa \"tất cả\".", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Nhà bạn Hoa nuôi số con vịt là:</div><div>$42 : 7 = 6$&nbsp;(con)</div><div>Nhà bạn Hoa nuôi tất cả số con gà và vịt là:</div><div>$42 + 6 = 48$&nbsp;(con)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $48$&nbsp;con gà và vịt.</span></div>" },
{ t_title: "Bài 5", t_content: "Điền các số $2, 4, 6, 8, 10, 12$&nbsp;vào $6$&nbsp;ô tròn được xếp trên $3$&nbsp;cạnh của một hình tam giác (mỗi cạnh có $3$&nbsp;ô tròn, trong đó $3$&nbsp;ô nằm ở $3$&nbsp;góc và $3$&nbsp;ô nằm ở giữa các cạnh) sao cho tổng $3$&nbsp;số trên mỗi cạnh đều bằng $20$.<br><svg viewBox='0 0 200 180' class='w-48 h-auto mx-auto my-3'><polygon points='100,30 30,150 170,150' fill='none' stroke='#3b82f6' stroke-width='2' stroke-dasharray='5,5'/><circle cx='100' cy='30' r='14' fill='white' stroke='#2563eb' stroke-width='2'/><circle cx='30' cy='150' r='14' fill='white' stroke='#2563eb' stroke-width='2'/><circle cx='170' cy='150' r='14' fill='white' stroke='#2563eb' stroke-width='2'/><circle cx='65' cy='90' r='14' fill='white' stroke='#2563eb' stroke-width='2'/><circle cx='135' cy='90' r='14' fill='white' stroke='#2563eb' stroke-width='2'/><circle cx='100' cy='150' r='14' fill='white' stroke='#2563eb' stroke-width='2'/></svg>", strategy: "WHAT: Bài toán điền số (Tư duy Tổ hợp) trên chu vi hình tam giác.<br>HOW: Tính tổng $6$&nbsp;số ($2+4+6+8+10+12 = 42$). Tính tổng $3$&nbsp;cạnh yêu cầu ($20 \\times 3 = 60$). Độ chênh lệch ($60 - 42 = 18$) chính là tổng của $3$&nbsp;số nằm ở $3$&nbsp;GÓC (vì chúng bị lặp lại $2$&nbsp;lần khi cộng các cạnh). Từ đó chọn ra $3$&nbsp;số ở góc có tổng bằng $18$&nbsp;(ví dụ $2, 6, 10$), rồi điền nốt các số còn lại vào giữa.<br>WHY: Nhận diện được tính chất \"giao điểm\" của các đỉnh tam giác là chìa khóa giải dạng bài ma thuật này.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Tổng của $6$&nbsp;số đã cho là: $2 + 4 + 6 + 8 + 10 + 12 = 42$.</div><div>Tổng của $3$&nbsp;cạnh tam giác là: $20 \\times 3 = 60$.</div><div>Vì $3$&nbsp;ô ở GÓC được tính hai lần (nằm trên cả $2$&nbsp;cạnh liền kề), nên tổng của $3$&nbsp;số ở góc là: $60 - 42 = 18$.</div><div>Ta xét $3$&nbsp;số có tổng bằng $18$&nbsp;trong các số trên: $2 + 6 + 10 = 18$. Vậy $3$&nbsp;ô ở ba góc sẽ điền các số: <strong>$2, 6, 10$</strong>.</div><div>Các số còn lại ($4, 8, 12$) sẽ được điền vào giữa các cạnh sao cho:</div><div>- Cạnh nối góc $2$&nbsp;và $6$: Cần số $20 - 2 - 6 = 12$. Điền số <strong>$12$</strong>.</div><div>- Cạnh nối góc $6$&nbsp;và $10$: Cần số $20 - 6 - 10 = 4$. Điền số <strong>$4$</strong>.</div><div>- Cạnh nối góc $10$&nbsp;và $2$: Cần số $20 - 10 - 2 = 8$. Điền số <strong>$8$</strong>.</div><div>*(Học sinh vẽ hình và điền đúng vị trí các số là đạt điểm tối đa).*</div>" },
{ t_title: "Bài 6", t_content: "Tại một công viên, người ta xây dựng một bồn hoa hình tam giác có $3$&nbsp;cạnh bằng nhau, mỗi cạnh dài $21\\text{ m}$. Dọc theo bờ bao xung quanh bồn hoa, người ta đặt các chậu cây cảnh, cứ cách $7\\text{ m}$&nbsp;lại đặt một chậu. Hỏi người ta cần dùng tất cả bao nhiêu chậu cây cảnh? (Biết tại $3$&nbsp;góc của bồn hoa đều có chậu cây).", strategy: "WHAT: Toán khoảng cách trên đường tròn khép kín (Trồng cây khép kín).<br>HOW: Bước 1: Tính chu vi bồn hoa ($21 + 21 + 21 = 63\\text{ m}$). Bước 2: Tính số chậu cây ($63 : 7$).<br>WHY: Do bồn hoa là một vòng khép kín, số khoảng cách luôn BẰNG số vật thể (chậu cây) được đặt. Điểm bắt đầu cũng chính là điểm kết thúc. Không cần phải $+1$&nbsp;như trồng cây trên đoạn thẳng.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Chu vi của bồn hoa hình tam giác là:</div><div>$21 + 21 + 21 = 63$&nbsp;(m)</div><div>Vì bồn hoa là một vòng khép kín nên số chậu cây cảnh bằng đúng số khoảng cách giữa các chậu. Số chậu cây cảnh người ta cần dùng là:</div><div>$63 : 7 = 9$&nbsp;(chậu)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $9$&nbsp;chậu cây cảnh.</span></div>" }
]
});
</script>

id: 5, title: "ĐỀ KHẢO SÁT HỌC SINH GIỎI - ĐỀ SỐ 05", icon: "🔥", color: "red", level: "Quận/Huyện (Vòng Thử thách)", time: "45 phút",
trac_nghiem: [
{ q_title: "Câu 1", q_content: "Số gồm $4$&nbsp;chục và $15$&nbsp;đơn vị là số nào?", options: ["A. $415$", "B. $55$", "C. $45$", "D. $19$"], correct_idx: 1, explain: "Ta có $4$&nbsp;chục bằng $40$. Cộng thêm $15$&nbsp;đơn vị: $40 + 15 = 55$." },
{ q_title: "Câu 2", q_content: "Trong phép chia $35 : 5 = 7$, số $35$ được gọi là gì?", options: ["A. Số chia", "B. Thương", "C. Số bị chia", "D. Tích"], correct_idx: 2, explain: "Trong phép chia, số đứng trước dấu chia gọi là Số bị chia. Vậy $35$ là Số bị chia." },
{ q_title: "Câu 3", q_content: "Thùng thứ nhất có $15$&nbsp;lít nước. Nếu rót thêm vào thùng thứ nhất $5$&nbsp;lít nước nữa thì số nước ở thùng thứ nhất vừa đúng bằng số nước ở thùng thứ hai. Hỏi thùng thứ hai có bao nhiêu lít nước?", options: ["A. $10$&nbsp;lít", "B. $20$&nbsp;lít", "C. $15$&nbsp;lít", "D. $5$&nbsp;lít"], correct_idx: 1, explain: "Lượng nước ở thùng thứ hai bằng đúng lượng nước thùng thứ nhất sau khi rót thêm: $15 + 5 = 20$&nbsp;(lít)." },
{ q_title: "Câu 4", q_content: "Điền số thích hợp vào chỗ chấm: $2, 4, 8, 16, \\dots$", options: ["A. $24$", "B. $20$", "C. $32$", "D. $18$"], correct_idx: 2, explain: "Quy luật dãy số là gấp đôi (nhân $2$) số liền trước: $2 \\times 2 = 4; 4 \\times 2 = 8; 8 \\times 2 = 16$. Số tiếp theo là: $16 \\times 2 = 32$ (hoặc $16 + 16 = 32$)." },
{ q_title: "Câu 5", q_content: "Một khóa học bơi kéo dài $1$&nbsp;tuần và $3$&nbsp;ngày. Hỏi khóa học đó kéo dài tất cả bao nhiêu ngày?", options: ["A. $13$&nbsp;ngày", "B. $10$&nbsp;ngày", "C. $8$&nbsp;ngày", "D. $4$&nbsp;ngày"], correct_idx: 1, explain: "Đổi $1$&nbsp;tuần = $7$&nbsp;ngày. Khóa học kéo dài: $7 + 3 = 10$&nbsp;(ngày)." },
{ q_title: "Câu 6", q_content: "Bạn Hà cao hơn bạn Lan $3\\text{ cm}$. Bạn Hoa lại thấp hơn bạn Lan $2\\text{ cm}$. Hỏi bạn Hà cao hơn bạn Hoa bao nhiêu xăng-ti-mét?", options: ["A. $5\\text{ cm}$", "B. $1\\text{ cm}$", "C. $2\\text{ cm}$", "D. $3\\text{ cm}$"], correct_idx: 0, explain: "Bạn Hà cao hơn bạn Lan, còn Hoa thấp hơn Lan (tức là Lan cao hơn Hoa). Vậy Hà là người cao nhất, Hoa là người thấp nhất. Khoảng cách chiều cao từ Hà xuống Hoa là: $3 + 2 = 5\\text{ (cm)}$." },
{ q_title: "Câu 7", q_content: "Từ ba chữ số $1, 0, 5$ em có thể lập được bao nhiêu số CHẴN có hai chữ số khác nhau?", options: ["A. $1$&nbsp;số", "B. $2$&nbsp;số", "C. $3$&nbsp;số", "D. $4$&nbsp;số"], correct_idx: 1, explain: "Để là số chẵn, chữ số hàng đơn vị phải là số chẵn (trong $3$&nbsp;số trên, chỉ có số $0$ là chẵn). Vậy hàng đơn vị bắt buộc là $0$. Có $2$&nbsp;cách chọn hàng chục là $1$ và $5$. Ta lập được $2$&nbsp;số: $10$ và $50$." },
{ q_title: "Câu 8", q_content: "Tìm một số, biết rằng lấy số đó trừ đi $14$ rồi cộng với $25$ thì được kết quả là $50$. Số đó là:", options: ["A. $61$", "B. $39$", "C. $89$", "D. $11$"], correct_idx: 1, explain: "Làm phép tính dịch ngược từ cuối lên: Trái ngược với cộng $25$ là trừ $25 \\Rightarrow 50 - 25 = 25$. Trái ngược với trừ $14$ là cộng $14 \\Rightarrow 25 + 14 = 39$." },
{ q_title: "Câu 9", q_content: "Một hình tam giác có $3$&nbsp;cạnh dài bằng nhau. Biết độ dài một cạnh là $8\\text{ cm}$. Chu vi của hình tam giác đó là:", options: ["A. $16\\text{ cm}$", "B. $24\\text{ cm}$", "C. $11\\text{ cm}$", "D. $32\\text{ cm}$"], correct_idx: 1, explain: "Chu vi hình tam giác bằng tổng $3$&nbsp;cạnh: $8 + 8 + 8 = 24\\text{ (cm)}$ (hoặc $8 \\times 3 = 24\\text{ cm}$)." },
{ q_title: "Câu 10", q_content: "Đồng hồ treo tường gõ chuông để báo giờ. Để gõ $3$&nbsp;tiếng chuông, đồng hồ mất $6$&nbsp;giây. Hỏi để gõ $5$&nbsp;tiếng chuông, đồng hồ sẽ mất bao nhiêu giây?", options: ["A. $10$&nbsp;giây", "B. $8$&nbsp;giây", "C. $15$&nbsp;giây", "D. $12$&nbsp;giây"], correct_idx: 3, explain: "Bẫy khoảng cách: $3$&nbsp;tiếng chuông chỉ tạo ra $2$&nbsp;khoảng nghỉ. Vậy $1$&nbsp;khoảng nghỉ tốn thời gian là $6 : 2 = 3$&nbsp;(giây). Nếu gõ $5$&nbsp;tiếng chuông sẽ có $4$&nbsp;khoảng nghỉ. Thời gian đồng hồ mất là: $3 \\times 4 = 12$&nbsp;(giây)." },
{ q_title: "Câu 11", q_content: "Trên đĩa cân, $1$&nbsp;quả bí ngô nặng bằng $2$&nbsp;bắp cải; $1$&nbsp;bắp cải lại nặng bằng $5$&nbsp;quả cam. Hỏi $2$&nbsp;quả bí ngô nặng bằng bao nhiêu quả cam?", options: ["A. $10$&nbsp;quả", "B. $20$&nbsp;quả", "C. $15$&nbsp;quả", "D. $7$&nbsp;quả"], correct_idx: 1, explain: "Bắc cầu: $1$&nbsp;bí ngô = $2$&nbsp;bắp cải. Mà $1$&nbsp;bắp cải = $5$&nbsp;cam $\\Rightarrow 2$&nbsp;bắp cải = $10$&nbsp;cam. Suy ra $1$&nbsp;bí ngô = $10$&nbsp;cam. Vậy $2$&nbsp;bí ngô sẽ nặng bằng $10 \\times 2 = 20$&nbsp;quả cam." },
{ q_title: "Câu 12", q_content: "Cho một hình tròn tâm O. Bạn Nam kẻ $3$&nbsp;đường thẳng cắt nhau đi qua đúng tâm O của hình tròn đó. Hỏi hình tròn bị chia thành bao nhiêu phần?<br><svg width='120' height='120' viewBox='0 0 100 100' class='mx-auto my-4'><circle cx='50' cy='50' r='45' fill='none' stroke='#1e40af' stroke-width='3'/><line x1='50' y1='5' x2='50' y2='95' stroke='#ef4444' stroke-width='2'/><line x1='11' y1='27.5' x2='89' y2='72.5' stroke='#ef4444' stroke-width='2'/><line x1='11' y1='72.5' x2='89' y2='27.5' stroke='#ef4444' stroke-width='2'/><circle cx='50' cy='50' r='3' fill='black'/><text x='55' y='55' font-weight='bold'>O</text></svg>", options: ["A. $3$&nbsp;phần", "B. $4$&nbsp;phần", "C. $6$&nbsp;phần", "D. $8$&nbsp;phần"], correct_idx: 2, explain: "Mỗi một đường thẳng đi qua tâm sẽ chia hình tròn thành $2$&nbsp;nửa. $3$&nbsp;đường thẳng cùng đi qua tâm sẽ tạo thành $3 \\times 2 = 6$&nbsp;phần bằng nhau (như cắt bánh pizza)." }

{ t_title: "Bài 1", t_content: "Tính nhanh:<br><div class='text-xl text-center my-4'>$21 + 22 + 23 + 24 - 11 - 12 - 13 - 14$</div>", strategy: "WHAT (Quan sát các con số): Dãy tính gồm $4$&nbsp;số lớn (hai mươi mấy) và $4$&nbsp;số nhỏ (mười mấy) đang bị trừ đi.<br>HOW (Góp nhặt như thế nào?): Thay vì cộng hết một cụm rồi mới trừ, tại sao ta không bắt cặp 'một số lớn trừ đi một số nhỏ' có cùng chữ số hàng đơn vị?<br>WHY (Sự kì diệu của các cặp): $21 - 11$ bằng mấy? $22 - 12$ bằng mấy? Hãy biến một biểu thức dài ngoằng thành các con số tròn chục giống hệt nhau.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>$21 + 22 + 23 + 24 - 11 - 12 - 13 - 14$</div><div>$= (21 - 11) + (22 - 12) + (23 - 13) + (24 - 14)$</div><div>$= 10 + 10 + 10 + 10$</div><div>$= 40$</div>" },
{ t_title: "Bài 2", t_content: "Tìm một số có hai chữ số. Biết rằng tổng hai chữ số của số đó bằng số bé nhất có hai chữ số, và tích của hai chữ số đó bằng $24$.", strategy: "WHAT (Dịch câu chữ thành số liệu): 'Số bé nhất có hai chữ số' là số mấy? (Chính là số $10$). Vậy ta có điều kiện thứ nhất: Tổng hai chữ số bằng $10$.<br>HOW (Tìm các cặp số nhân với nhau): Điều kiện thứ hai là tích bằng $24$. Hãy nhớ lại bảng nhân đã học, hai số nào nhân với nhau bằng $24$? (Ví dụ: $3 \\times 8 = 24$; $4 \\times 6 = 24$).<br>WHAT NEXT (Khớp điều kiện): Trong các cặp số vừa tìm được, cặp nào cộng lại với nhau đúng bằng $10$? Hãy dùng cặp đó để ghép thành số có hai chữ số.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Số bé nhất có hai chữ số là $10$. Do đó, tổng hai chữ số của số cần tìm là $10$.</div><div>Ta tìm các cặp hai chữ số nhân với nhau bằng $24$ trong bảng nhân:</div><div>$3 \\times 8 = 24$ (Nhưng tổng $3 + 8 = 11$, không thỏa mãn).</div><div>$4 \\times 6 = 24$ (Tổng $4 + 6 = 10$, thỏa mãn điều kiện đề bài).</div><div>Vậy hai chữ số tạo nên số cần tìm là $4$ và $6$.</div><div>Vì đề bài không yêu cầu thứ tự lớn bé của chữ số hàng chục và hàng đơn vị, nên ta lập được hai số thỏa mãn là $46$ và $64$.</div><div class='font-bold mt-2 text-indigo-700'>Đáp số: $46$ hoặc $64$.</div>" },
{ t_title: "Bài 3", t_content: "Hai lớp 2A và 2B cùng đi tham quan. Để chia thành hai đoàn có số người bằng nhau, cô giáo chuyển $4$&nbsp;bạn từ lớp 2A sang lớp 2B. Lúc này mỗi lớp đều có đúng $30$&nbsp;bạn. Hỏi lúc đầu mỗi lớp có bao nhiêu học sinh?", strategy: "WHEN (Con số 30 là của lúc nào?): $30$&nbsp;bạn là số lượng LÚC SAU (khi đã chuyển đổi xong).<br>HOW (Khôi phục số lượng lớp 2A): Lớp 2A ĐÃ CHO ĐI $4$&nbsp;bạn thì mới tụt xuống còn $30$&nbsp;bạn. Vậy lúc đầu để tìm lại số bạn của lớp 2A, ta phải cộng trả lại hay trừ đi?<br>HOW (Khôi phục số lượng lớp 2B): Lớp 2B ĐƯỢC NHẬN THÊM $4$&nbsp;bạn thì mới tăng lên thành $30$&nbsp;bạn. Vậy lúc đầu lớp 2B có nhiều hơn hay ít hơn $30$? Phải làm phép tính gì?", solution: "<div><span class='font-bold text-blue-700'>Tóm tắt:</span></div><div>Lớp 2A chuyển $4$&nbsp;bạn sang lớp 2B $\\Rightarrow$ Mỗi lớp: $30$&nbsp;bạn.</div><div>Lúc đầu mỗi lớp: $\\dots$&nbsp;bạn?</div><br><div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Lớp 2A sau khi chuyển đi $4$&nbsp;bạn thì còn lại $30$&nbsp;bạn. Số học sinh của lớp 2A lúc đầu là:</div><div>$30 + 4 = 34$&nbsp;(học sinh)</div><div>Lớp 2B sau khi được nhận thêm $4$&nbsp;bạn thì có $30$&nbsp;bạn. Số học sinh của lớp 2B lúc đầu là:</div><div>$30 - 4 = 26$&nbsp;(học sinh)</div><div class='font-bold mt-2 text-indigo-700'>Đáp số: Lớp 2A có $34$&nbsp;học sinh; Lớp 2B có $26$&nbsp;học sinh.</div>" },
{ t_title: "Bài 4", t_content: "Trên bãi cỏ có tất cả $10$&nbsp;con gồm cả gà và vịt. Bạn Mai đếm số gà thì thấy có nhiều hơn $5$&nbsp;con. Bạn Lan đếm số vịt thì thấy có nhiều hơn $3$&nbsp;con. Hỏi trên bãi cỏ có chính xác bao nhiêu con gà và bao nhiêu con vịt?", strategy: "WHAT (Các giới hạn của bài toán):<br>- Gà + Vịt = $10$&nbsp;con.<br>- Gà > $5$&nbsp;con (nghĩa là gà có thể là $6, 7, 8\\dots$).<br>- Vịt > $3$&nbsp;con (nghĩa là vịt có thể là $4, 5, 6\\dots$).<br>WHAT IF (Thử nghiệm các trường hợp):<br>- Nếu Gà là $7$&nbsp;con, thì Vịt là mấy con? ($10 - 7 = 3$). Nhưng đề bài bắt buộc Vịt phải > $3$&nbsp;con. Vậy trường hợp Gà = $7$ có được chấp nhận không?<br>- Nếu Gà là $5$&nbsp;con thì sao? Đề bài bắt buộc Gà > $5$. Nên không được.<br>HOW (Chốt đáp án): Số lượng Gà bị kẹp giữa lớn hơn $5$ và phải nhỏ hơn $7$. Vậy Gà bắt buộc phải là số mấy?", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Tổng số gà và vịt là $10$&nbsp;con. Vì số gà nhiều hơn $5$&nbsp;con nên số gà có thể là: $6, 7, 8, 9$&nbsp;con.</div><div>Ta xét các trường hợp:</div><div>- Nếu có $7$&nbsp;con gà, thì số vịt là: $10 - 7 = 3$&nbsp;(con). Điều này KHÔNG ĐÚNG vì theo đề bài số vịt phải nhiều hơn $3$&nbsp;con.</div><div>- Nếu có $6$&nbsp;con gà, thì số vịt là: $10 - 6 = 4$&nbsp;(con). Điều này ĐÚNG vì $4$&nbsp;con vịt thỏa mãn điều kiện 'nhiều hơn $3$&nbsp;con'.</div><div>Vậy trường hợp duy nhất đúng với yêu cầu của cả Mai và Lan là trên bãi cỏ có $6$&nbsp;con gà và $4$&nbsp;con vịt.</div><div class='font-bold mt-2 text-indigo-700'>Đáp số: $6$&nbsp;con gà, $4$&nbsp;con vịt.</div>" },
{ t_title: "Bài 5", t_content: "Trong câu lạc bộ thể thao, đội Xanh có $3$&nbsp;vận động viên bóng bàn, đội Đỏ cũng có $3$&nbsp;vận động viên. Theo luật, mỗi người của đội Xanh đều phải thi đấu đúng $1$&nbsp;ván với mỗi người của đội Đỏ (những người cùng đội không đấu với nhau). Hỏi có tất cả bao nhiêu ván đấu được diễn ra?", strategy: "WHO (Góc nhìn từ 1 người): Hãy chọn ra 1 bạn bất kỳ bên đội Xanh. Bạn này phải đấu với TẤT CẢ các bạn bên đội Đỏ. Đội Đỏ có mấy người? Vậy bạn Xanh đó phải chơi bao nhiêu ván?<br>HOW (Tính cho toàn đội): 1 bạn đội Xanh chơi $3$&nbsp;ván. Mà đội Xanh có tất cả $3$&nbsp;bạn. Vậy ta có mấy số $3$ cộng lại với nhau?<br>WHY (Có bị lặp không?): Đề bài quy định người cùng đội không đấu với nhau, và ta chỉ tính chiều từ Xanh sang Đỏ là đã bao trùm toàn bộ các cặp đấu rồi, không cần tính ngược từ Đỏ về Xanh nữa.", solution: "<div><span class='font-bold text-blue-700'>Tóm tắt:</span></div><div>Đội Xanh: $3$&nbsp;người. Đội Đỏ: $3$&nbsp;người.</div><div>Mỗi người đội Xanh đấu $1$&nbsp;ván với mỗi người đội Đỏ.</div><div>Tổng cộng: $\\dots$&nbsp;ván đấu?</div><br><div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Đội Đỏ có $3$&nbsp;người. Cứ $1$&nbsp;vận động viên của đội Xanh sẽ phải đấu với cả $3$&nbsp;người của đội Đỏ, tức là $1$&nbsp;người đội Xanh tham gia $3$&nbsp;ván đấu.</div><div>Vì đội Xanh có $3$&nbsp;vận động viên như thế, nên tổng số ván đấu được diễn ra là:</div><div>$3 + 3 + 3 = 9$&nbsp;(ván đấu) (Hoặc lấy $3 \\times 3 = 9$ ván)</div><div class='font-bold mt-2 text-indigo-700'>Đáp số: $9$&nbsp;ván đấu.</div>" },
{ t_title: "Bài 6", t_content: "Cô giáo có $3$&nbsp;tấm thẻ mang các chữ số: $0, 1, 2$. Cô yêu cầu các bạn học sinh ghép $3$&nbsp;tấm thẻ này lại để tạo thành các số có ba chữ số KHÁC NHAU. Em hãy tính tổng của số lớn nhất và số bé nhất có thể ghép được.", strategy: "WHAT (Quy tắc ghép số): Khi ghép số có ba chữ số, chữ số hàng trăm có đặc điểm gì tuyệt đối phải nhớ? (Chữ số $0$ KHÔNG THỂ đứng đầu tiên).<br>HOW (Tìm số lớn nhất): Để được số lớn nhất, hàng trăm phải lớn nhất (chọn 2). Hàng chục phải lớn thứ nhì (chọn 1).<br>HOW (Tìm số bé nhất): Để được số bé nhất, hàng trăm phải bé nhất nhưng không được là $0$ (buộc phải chọn $1$). Sau khi đã chốt hàng trăm là $1$, hàng chục ưu tiên số bé nhất có thể (chọn $0$).<br>WHAT NEXT: Tìm được 2 số rồi thì cộng chúng lại với nhau.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Với $3$&nbsp;chữ số $0, 1, 2$, để lập số có ba chữ số, chữ số hàng trăm không được phép là số $0$.</div><div>Số <strong>lớn nhất</strong> lập được là số đưa chữ số lớn nhất lên hàng cao nhất: <strong>$210$</strong>.</div><div>Số <strong>bé nhất</strong> lập được là số đưa chữ số bé nhất (khác $0$) lên hàng cao nhất: <strong>$102$</strong>.</div><div>Tổng của số lớn nhất và số bé nhất vừa ghép được là:</div><div>$210 + 102 = 312$</div><div class='font-bold mt-2 text-indigo-700'>Đáp số: $312$.</div>" }
]

{ t_title: "Bài 1", t_content: "Tính nhanh:<br><div class='text-xl text-center my-4'>$12 + 14 + 16 + 18$</div>", strategy: "WHAT (Đặc điểm các con số): Đây là dãy $4$&nbsp;số chẵn liên tiếp. Chữ số tận cùng là $2, 4, 6, 8$.<br>HOW (Ghép cặp tròn chục): Chữ số $2$ ghép với chữ số nào để tạo thành $10$? (Số $8$). Chữ số $4$ ghép với chữ số nào? (Số $6$).<br>WHY (Cách nhóm): Đảo vị trí và mở ngoặc để cộng các cặp tương ứng, biến bài toán thành phép cộng các số tròn chục.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>$12 + 14 + 16 + 18$</div><div>$= (12 + 18) + (14 + 16)$</div><div>$= 30 + 30$</div><div>$= 60$</div>" },
{ t_title: "Bài 2", t_content: "Tìm một số có hai chữ số. Biết rằng chữ số hàng chục gấp $3$&nbsp;lần chữ số hàng đơn vị và tổng của hai chữ số đó bằng $8$.", strategy: "WHAT (Dữ kiện thứ nhất): 'Chữ số hàng chục gấp 3 lần chữ số hàng đơn vị'. Hãy liệt kê các cặp số thoả mãn. (Ví dụ: Đơn vị là $1$ thì chục là $3$. Đơn vị là $2$ thì chục là $6\\dots$).<br>HOW (Kiểm tra dữ kiện thứ hai): Trong các cặp số vừa liệt kê, cộng chúng lại xem cặp nào có tổng bằng $8$?<br>WHAT NEXT (Chốt số): Khi đã tìm được cặp chữ số đúng, nhớ đặt đúng vị trí hàng chục và hàng đơn vị.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Vì chữ số hàng chục gấp $3$&nbsp;lần chữ số hàng đơn vị, nên ta thử các trường hợp:</div><div>- Nếu chữ số hàng đơn vị là $1$ thì chữ số hàng chục là $1 \\times 3 = 3$. Tổng: $3 + 1 = 4$ (Loại vì không bằng $8$).</div><div>- Nếu chữ số hàng đơn vị là $2$ thì chữ số hàng chục là $2 \\times 3 = 6$. Tổng: $6 + 2 = 8$ (Thoả mãn).</div><div>- Nếu chữ số hàng đơn vị là $3$ thì chữ số hàng chục là $3 \\times 3 = 9$. Tổng: $9 + 3 = 12$ (Loại).</div><div>Vậy chữ số hàng chục là $6$, chữ số hàng đơn vị là $2$.</div><div class='font-bold mt-2 text-indigo-700'>Đáp số: Số cần tìm là $62$.</div>" },
{ t_title: "Bài 3", t_content: "Dọc theo một đoạn đường dài $20\\text{ m}$, người ta trồng các cây bóng mát cách đều nhau. Cứ $5\\text{ m}$ lại có một cây. Hỏi người ta đã trồng tất cả bao nhiêu cây, biết rằng ở cả hai đầu của đoạn đường đều có cây?", strategy: "WHAT (Đoạn đường bị chia làm mấy khúc?): Đường dài $20\\text{m}$, mỗi khúc (khoảng cách) dài $5\\text{m}$. Hãy làm phép chia để tìm số khúc cây.<br>WHY (Tại sao số cây không bằng số khúc?): Hãy xoè bàn tay ra. Giữa 5 ngón tay có mấy khoảng trống? (4 khoảng). Vậy nếu trồng cây ở cả 2 đầu, số lượng cây bao giờ cũng phải nhiều hơn số khoảng trống là mấy?<br>HOW (Quy tắc): Lấy số khoảng trống cộng thêm $1$ sẽ ra số cây.", solution: "<div><span class='font-bold text-blue-700'>Tóm tắt:</span></div><div>Đoạn đường dài: $20\\text{ m}$</div><div>Cách nhau: $5\\text{ m}$</div><div>Hai đầu đường: Đều có cây</div><div>Trồng tất cả: $\\dots$&nbsp;cây?</div><br><div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Đoạn đường được chia thành số khoảng cách là:</div><div>$20 : 5 = 4$&nbsp;(khoảng)</div><div>Vì trồng cây ở cả hai đầu đoạn đường, nên số cây luôn nhiều hơn số khoảng là $1$. Số cây đã được trồng là:</div><div>$4 + 1 = 5$&nbsp;(cây)</div><div class='font-bold mt-2 text-indigo-700'>Đáp số: $5$&nbsp;cây.</div>" },
{ t_title: "Bài 4", t_content: "An có nhiều hơn Bình $8$&nbsp;viên bi. Nếu An lấy $3$&nbsp;viên bi của mình cho Bình thì bây giờ An còn nhiều hơn Bình bao nhiêu viên bi?", strategy: "WHAT (Bài toán thiếu gì?): Đề không cho An có bao nhiêu bi, Bình có bao nhiêu bi. Đề chỉ cho mức chênh lệch là $8$&nbsp;viên.<br>HOW (Sự thay đổi của người cho): Khi An cho đi $3$&nbsp;viên, khoảng cách chênh lệch ban đầu sẽ bị hụt mất $3$&nbsp;viên.<br>HOW (Sự thay đổi của người nhận): Khi Bình nhận thêm $3$&nbsp;viên, Bình lại tiến lên thu hẹp khoảng cách thêm $3$&nbsp;viên nữa.<br>WHY (Gộp biến động): Một lần chuyển bi làm ảnh hưởng đến TẢI TRỌNG CỦA CẢ HAI BÊN. Khoảng cách thực tế bị thu hẹp bằng hai lần số bi đem cho. (Lấy Hiệu ban đầu trừ đi số bi An mất, trừ tiếp số bi Bình được nhận).", solution: "<div><span class='font-bold text-blue-700'>Tóm tắt:</span></div><div>An hơn Bình: $8$&nbsp;viên bi.</div><div>An cho Bình: $3$&nbsp;viên bi.</div><div>Bây giờ An hơn Bình: $\\dots$&nbsp;viên bi?</div><br><div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Ban đầu An có nhiều hơn Bình $8$&nbsp;viên bi.</div><div>Khi An lấy $3$&nbsp;viên bi của mình cho Bình, thì số bi của An giảm đi $3$&nbsp;viên, đồng thời số bi của Bình tăng thêm $3$&nbsp;viên.</div><div>Lúc này, khoảng cách chênh lệch giữa hai bạn bị rút ngắn lại là:</div><div>$3 + 3 = 6$&nbsp;(viên bi)</div><div>Hiện tại, An còn nhiều hơn Bình số viên bi là:</div><div>$8 - 6 = 2$&nbsp;(viên bi)</div><div class='font-bold mt-2 text-indigo-700'>Đáp số: $2$&nbsp;viên bi.</div>" },
{ t_title: "Bài 5", t_content: "Một mảnh giấy hình chữ nhật có chiều dài $8\\text{ cm}$, chiều rộng $4\\text{ cm}$. Bạn Mai kẻ một đường thẳng cắt mảnh giấy đó thành hai mảnh hình vuông bằng nhau. Em hãy tính tổng chu vi của cả hai mảnh giấy hình vuông đó.", strategy: "WHAT (Cắt hình như thế nào?): Một hình chữ nhật $8 \\times 4$ cắt thành 2 hình vuông. Chiều dài $8\\text{cm}$ bị chia đôi thành $8 : 2 = 4\\text{ cm}$. Vậy ta có 2 hình vuông cạnh $4\\text{cm}$.<br>HOW (Tính chu vi 1 hình vuông): Hình vuông cạnh $4\\text{cm}$ có chu vi là bao nhiêu? (Lấy 4 cạnh cộng lại với nhau).<br>WHAT NEXT (Tính tổng chu vi 2 hình): Lấy chu vi 1 hình nhân đôi (hoặc cộng với chính nó).", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Mảnh giấy hình chữ nhật có chiều dài $8\\text{ cm}$, khi cắt thành hai hình vuông bằng nhau thì chiều dài bị chia làm $2$&nbsp;phần. Độ dài cạnh của mỗi hình vuông là:</div><div>$8 : 2 = 4$&nbsp;(cm)</div><div>(Hình vuông tạo ra có cạnh $4\\text{ cm}$ bằng đúng với chiều rộng của hình chữ nhật, thoả mãn).</div><div>Chu vi của một mảnh giấy hình vuông là:</div><div>$4 + 4 + 4 + 4 = 16$&nbsp;(cm)</div><div>Tổng chu vi của cả hai mảnh giấy hình vuông là:</div><div>$16 + 16 = 32$&nbsp;(cm)</div><div class='font-bold mt-2 text-indigo-700'>Đáp số: $32\\text{ cm}$.</div>" },
{ t_title: "Bài 6", t_content: "Nam có $6$&nbsp;tờ tiền gồm hai loại: loại $1$&nbsp;nghìn đồng và loại $2$&nbsp;nghìn đồng. Tổng số tiền Nam có là $9$&nbsp;nghìn đồng. Hỏi Nam có mấy tờ tiền $1$&nbsp;nghìn đồng, mấy tờ tiền $2$&nbsp;nghìn đồng?", strategy: "WHAT (Nếu tất cả là tờ tiền mệnh giá lớn nhất thì sao?): Hãy giả sử cả $6$&nbsp;tờ tiền Nam có ĐỀU LÀ loại $2$&nbsp;nghìn đồng. Khi đó Nam sẽ có tất cả bao nhiêu tiền?<br>WHY (Xuất hiện sự chênh lệch): Tính xem số tiền giả sử đó bị dôi ra (thừa ra) bao nhiêu so với con số $9$&nbsp;nghìn thực tế?<br>HOW (Đổi tiền để cân bằng): Tại sao lại bị thừa tiền? Vì ta đã biến những tờ $1$&nbsp;nghìn thành $2$&nbsp;nghìn. Mỗi lần biến 1 tờ như vậy, ta làm đội lên mấy nghìn? Lấy tổng số tiền dôi ra chia cho độ chênh của từng tờ, ta sẽ tìm được số tờ $1$&nbsp;nghìn.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Giả sử cả $6$&nbsp;tờ tiền Nam có đều là loại $2$&nbsp;nghìn đồng. Lúc đó tổng số tiền là:</div><div>$2 \\times 6 = 12$&nbsp;(nghìn đồng)</div><div>Số tiền bị thừa ra so với thực tế là:</div><div>$12 - 9 = 3$&nbsp;(nghìn đồng)</div><div>Sở dĩ bị thừa $3$&nbsp;nghìn đồng là vì ta đã coi những tờ $1$&nbsp;nghìn đồng thành loại $2$&nbsp;nghìn đồng. Mỗi tờ $1$&nbsp;nghìn đồng bị tính đội lên số tiền là:</div><div>$2 - 1 = 1$&nbsp;(nghìn đồng)</div><div>Số tờ tiền loại $1$&nbsp;nghìn đồng là:</div><div>$3 : 1 = 3$&nbsp;(tờ)</div><div>Số tờ tiền loại $2$&nbsp;nghìn đồng là:</div><div>$6 - 3 = 3$&nbsp;(tờ)</div><div class='font-bold mt-2 text-indigo-700'>Đáp số: $3$&nbsp;tờ loại $1$&nbsp;nghìn đồng; $3$&nbsp;tờ loại $2$&nbsp;nghìn đồng.</div>" }
]
});
</script>

{ q_title: "Câu 4", q_content: "Một hình tam giác lớn được kẻ $2$&nbsp;đường thẳng từ một đỉnh xuống cạnh đáy. Hỏi hình đó được chia thành tất cả bao nhiêu hình tam giác?<br><svg width='150' height='120' viewBox='0 0 100 86' class='mx-auto my-4'><polygon points='50,10 10,79 90,79' fill='none' stroke='#1d4ed8' stroke-width='2.5' stroke-linejoin='round'/><line x1='50' y1='10' x2='35' y2='79' stroke='#1d4ed8' stroke-width='2.5'/><line x1='50' y1='10' x2='65' y2='79' stroke='#1d4ed8' stroke-width='2.5'/></svg>", options: ["A. $3$&nbsp;hình", "B. $5$&nbsp;hình", "C. $6$&nbsp;hình", "D. $4$&nbsp;hình"], correct_idx: 2, explain: "Một tam giác bị cắt bởi 2 đường thẳng từ 1 đỉnh xuống đáy sẽ tạo ra 3 tam giác nhỏ đơn lẻ. Kéo theo 2 tam giác ghép đôi và 1 tam giác to nhất. Tổng: $3+2+1 = 6$&nbsp;hình." },

{ q_title: "Câu 6", q_content: "Lớp 2A có $30$&nbsp;học sinh. Lớp 2A có ÍT HƠN lớp 2B là $5$&nbsp;học sinh. Hỏi lớp 2B có bao nhiêu học sinh?", options: ["A. $25$&nbsp;học sinh", "B. $30$&nbsp;học sinh", "C. $35$&nbsp;học sinh", "D. $20$&nbsp;học sinh"], correct_idx: 2, explain: "Lớp 2A ít hơn lớp 2B, tức là lớp 2B nhiều hơn lớp 2A. Số học sinh lớp 2B là: $30 + 5 = 35$&nbsp;(học sinh)." },
{ q_title: "Câu 7", q_content: "Tìm số có hai chữ số, biết chữ số hàng chục là $7$ và chữ số hàng đơn vị kém chữ số hàng chục $3$&nbsp;đơn vị.", options: ["A. $73$", "B. $47$", "C. $74$", "D. $37$"], correct_idx: 2, explain: "Chữ số hàng chục là 7. Chữ số hàng đơn vị kém chữ số hàng chục 3 đơn vị nên là: $7 - 3 = 4$. Vậy số đó là 74." },
{ q_title: "Câu 8", q_content: "Trong một phép trừ, nếu ta giữ nguyên số trừ và TĂNG số bị trừ thêm $10$&nbsp;đơn vị thì hiệu mới sẽ thay đổi như thế nào?", options: ["A. Giảm đi $10$&nbsp;đơn vị", "B. Tăng thêm $10$&nbsp;đơn vị", "C. Không thay đổi", "D. Tăng thêm $5$&nbsp;đơn vị"], correct_idx: 1, explain: "Số bị trừ đóng vai trò như 'số vốn ban đầu'. Khi số bị trừ tăng thì kết quả (hiệu) cũng sẽ tăng lên một lượng tương ứng. Vậy hiệu mới tăng thêm 10 đơn vị." },
{ q_title: "Câu 9", q_content: "Một ngày có $24$&nbsp;giờ. Hỏi $\\frac{1}{3}$ ngày là bao nhiêu giờ?", options: ["A. $3$&nbsp;giờ", "B. $6$&nbsp;giờ", "C. $12$&nbsp;giờ", "D. $8$&nbsp;giờ"], correct_idx: 3, explain: "Lấy tổng số giờ của 1 ngày chia cho 3: $24 : 3 = 8$&nbsp;(giờ)." },
