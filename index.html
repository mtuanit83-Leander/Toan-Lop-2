trac_nghiem: [
{ q_title: "Câu 1", q_content: "Tìm số chẵn lớn nhất có hai chữ số khác nhau, biết chữ số hàng chục gấp đôi chữ số hàng đơn vị.", options: ["A. $84$", "B. $63$", "C. $42$", "D. $88$"], correct_idx: 0, explain: "Các số hàng chục gấp đôi đơn vị: $21, 42, 63, 84$. Số chẵn lớn nhất là $84$ (loại $88$ vì $2$&nbsp;chữ số giống nhau, loại $63$ vì là số lẻ)." },
{ q_title: "Câu 2", q_content: "Nếu hôm nay là Thứ Hai, ngày $10$, thì Thứ Sáu tuần sau là ngày bao nhiêu?", options: ["A. Ngày $14$", "B. Ngày $21$", "C. Ngày $24$", "D. Ngày $28$"], correct_idx: 1, explain: "Thứ $6$ tuần này là ngày $10 + 4 = 14$. Thứ $6$ tuần sau là ngày $14 + 7 = 21$." },
{ q_title: "Câu 3", q_content: "Hình bên dưới có tất cả bao nhiêu hình tam giác?<br><svg viewBox='0 0 100 100' class='w-32 h-auto mx-auto my-3'><polygon points='50,10 10,90 90,90' fill='none' stroke='#3b82f6' stroke-width='2'/><line x1='50' y1='10' x2='50' y2='90' stroke='#3b82f6' stroke-width='2'/><line x1='30' y1='50' x2='70' y2='50' stroke='#3b82f6' stroke-width='2'/><line x1='20' y1='70' x2='80' y2='70' stroke='#3b82f6' stroke-width='2'/></svg>", options: ["A. $7$&nbsp;hình", "B. $8$&nbsp;hình", "C. $9$&nbsp;hình", "D. $10$&nbsp;hình"], correct_idx: 2, explain: "Việc chia tam giác làm $3$&nbsp;tầng ngang và $1$&nbsp;trục dọc giữa sẽ tạo ra rất nhiều tam giác ở mỗi tầng. Tầng đỉnh có $3$&nbsp;tam giác ($1$&nbsp;trái, $1$&nbsp;phải, $1$&nbsp;ghép). Việc hạ đường kẻ xuống tầng $2$&nbsp;tạo thêm $3$&nbsp;tam giác lớn hơn (chứa tầng $1$). Hạ xuống tầng $3$&nbsp;tạo thêm $3$&nbsp;tam giác to nhất. Tổng cộng là $3 + 3 + 3 = 9$&nbsp;hình." },
{ q_title: "Câu 4", q_content: "Tính nhanh biểu thức sau: $45 + 28 + 55 + 12 = ?$", options: ["A. $120$", "B. $130$", "C. $140$", "D. $150$"], correct_idx: 2, explain: "Gom nhóm các số có đuôi cộng lại bằng tròn chục: $(45 + 55) + (28 + 12) = 100 + 40 = 140$." },
{ q_title: "Câu 5", q_content: "Số chẵn liền sau của số bé nhất có ba chữ số là số nào?", options: ["A. $98$", "B. $100$", "C. $101$", "D. $102$"], correct_idx: 3, explain: "Số bé nhất có $3$&nbsp;chữ số là $100$. Số chẵn liền sau (cộng $2$&nbsp;đơn vị) là $102$. Bẫy học sinh vội khoanh $101$ là số lẻ." },
{ q_title: "Câu 6", q_content: "Trong một chiếc hộp kín có $5$&nbsp;viên bi màu Đỏ và $4$&nbsp;viên bi màu Xanh. Không nhìn vào hộp, cần rút ra ít nhất bao nhiêu viên bi để chắc chắn chắn trong tay có cả bi Đỏ và bi Xanh (chắc chắn có $2$&nbsp;viên khác màu nhau)?", options: ["A. $2$&nbsp;viên", "B. $5$&nbsp;viên", "C. $6$&nbsp;viên", "D. $9$&nbsp;viên"], correct_idx: 2, explain: "Bốc rủi ro nhất (xui nhất) là bốc ra toàn màu có số lượng nhiều hơn ($5$&nbsp;Đỏ). Lúc này trong tay vẫn chỉ có $1$&nbsp;màu. Phải bốc thêm $1$&nbsp;viên nữa (chắc chắn rơi vào viên Xanh) để đạt điều kiện. Tổng: $5 + 1 = 6$&nbsp;viên." },
{ q_title: "Câu 7", q_content: "Dọc theo một bờ tường dài $40\\text{ m}$, người ta trồng các chậu hoa. Khoảng cách giữa $2$&nbsp;chậu hoa liền nhau là $10\\text{ m}$. Hỏi người ta trồng được tất cả bao nhiêu chậu hoa, biết rằng ở cả hai đầu của bờ tường đều có trồng hoa?", options: ["A. $3$&nbsp;chậu", "B. $4$&nbsp;chậu", "C. $5$&nbsp;chậu", "D. $6$&nbsp;chậu"], correct_idx: 2, explain: "Toán khoảng cách cắm cờ $2$&nbsp;đầu đường. Số chậu hoa = Số khoảng cách + $1$. Số khoảng cách = $40 : 10 = 4$. Số chậu = $4 + 1 = 5$." },
{ q_title: "Câu 8", q_content: "Cần đúng $5$&nbsp;phút để luộc chín $1$&nbsp;quả trứng gà. Hỏi nếu thả cùng lúc $3$&nbsp;quả trứng gà vào một cái nồi nước sôi thì cần bao nhiêu phút để cả $3$&nbsp;quả trứng đều chín?", options: ["A. $15$&nbsp;phút", "B. $5$&nbsp;phút", "C. $8$&nbsp;phút", "D. $3$&nbsp;phút"], correct_idx: 1, explain: "Các sự kiện diễn ra \"cùng lúc\" trong một không gian (cùng $1$&nbsp;nồi). Thời gian chín không bị cộng dồn như nấu từng quả riêng lẻ. Vẫn là $5$&nbsp;phút." },
{ q_title: "Câu 9", q_content: "Hiện nay anh $12$&nbsp;tuổi, em $8$&nbsp;tuổi. Hỏi khi em bằng tuổi anh hiện nay thì lúc đó anh bao nhiêu tuổi?", options: ["A. $14$&nbsp;tuổi", "B. $15$&nbsp;tuổi", "C. $16$&nbsp;tuổi", "D. $20$&nbsp;tuổi"], correct_idx: 2, explain: "Hiệu số tuổi của $2$&nbsp;anh em không bao giờ thay đổi. Anh hơn em $12 - 8 = 4$&nbsp;tuổi. Khi em lớn bằng tuổi anh (em $12$&nbsp;tuổi) thì anh cũng tăng thêm từng đó tuổi: $12 + 4 = 16$." },
{ q_title: "Câu 10", q_content: "Trên bàn cân đĩa, $1$&nbsp;quả dứa nặng bằng $3$&nbsp;quả táo. Lại có $2$&nbsp;quả táo nặng bằng $6$&nbsp;quả dâu tây. Hỏi $1$&nbsp;quả dứa nặng bằng bao nhiêu quả dâu tây?", options: ["A. $6$&nbsp;quả", "B. $9$&nbsp;quả", "C. $12$&nbsp;quả", "D. $15$&nbsp;quả"], correct_idx: 1, explain: "$2$&nbsp;Táo = $6$&nbsp;Dâu $\\rightarrow$ $1$&nbsp;Táo = $3$&nbsp;Dâu. Mà $1$&nbsp;Dứa = $3$&nbsp;Táo. Thay táo bằng dâu $\\rightarrow$ $1$&nbsp;Dứa = $3 \\times 3 = 9$&nbsp;Dâu." },
{ q_title: "Câu 11", q_content: "Điền số thích hợp vào chỗ chấm để hoàn thiện dãy số có quy luật: $2; 3; 5; 8; 12; \\dots$", options: ["A. $15$", "B. $16$", "C. $17$", "D. $18$"], correct_idx: 2, explain: "Khoảng cách tăng dần: $+1, +2, +3, +4, +5$. Nên $12 + 5 = 17$." },
{ q_title: "Câu 12", q_content: "Một phần ba số bi của Nam là $8$&nbsp;viên bi. Nam cho Việt $5$&nbsp;viên bi. Hỏi Nam còn lại bao nhiêu viên bi?", options: ["A. $3$&nbsp;viên", "B. $21$&nbsp;viên", "C. $19$&nbsp;viên", "D. $24$&nbsp;viên"], correct_idx: 2, explain: "Tính tổng số bi ban đầu của Nam: $8 \\times 3 = 24$. Sau khi cho trừ đi $5$ còn lại $19$." }

{ t_title: "Bài 1", t_content: "Tìm $X$, biết: <div class='text-center text-xl my-4'>$X - 25 = 100 - 48$</div>", strategy: "WHAT: Tìm $X$ đóng vai trò là Số bị trừ trong biểu thức.<br>HOW: Thu gọn vế phải (thực hiện phép trừ $100 - 48$). Sau đó tìm $X$ theo quy tắc \"Tìm số bị trừ\".<br>WHY: Đưa bài toán phức tạp về dạng cơ bản $X - a = b$.<br>WHERE/WHEN/WHAT NEXT: Chú ý thực hiện phép trừ có nhớ với số tròn trăm thật cẩn thận.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>$X - 25 = 100 - 48$</div><div>$X - 25 = 52$</div><div>$X = 52 + 25$</div><div>$X = 77$</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $X = 77$.</span></div>" },
{ t_title: "Bài 2", t_content: "Có $2$&nbsp;mảnh giấy màu. Mảnh thứ nhất dài $25\\text{ cm}$. Mảnh thứ hai dài hơn mảnh thứ nhất $15\\text{ cm}$. Bạn Lan dùng keo dán nối hai mảnh giấy đó lại với nhau để tạo thành một băng giấy dài. Biết phần giấy bị dán đè lên nhau (chồng mép) dài $5\\text{ cm}$. Hỏi băng giấy mới tạo thành dài bao nhiêu xăng-ti-mét?", strategy: "WHAT: Tính tổng chiều dài của băng giấy sau khi dán nối có đoạn bị chồng đè.<br>HOW: Bước 1: Tính chiều dài mảnh giấy thứ hai. Bước 2: Cộng chiều dài hai mảnh lại. Bước 3: Trừ đi phần bị dán đè chồng lên nhau vì phần này bị tính lặp $2$&nbsp;lần.<br>WHY: Khi dán nối $2$&nbsp;đoạn, phần dán đè khiến tổng chiều dài bị hao hụt đi đúng bằng khoảng cách đoạn dán đó.<br>WHERE/WHEN/WHAT NEXT: Bẫy thường gặp là học sinh chỉ cộng chiều dài $2$&nbsp;mảnh giấy mà quên mất phần trừ đi $5\\text{ cm}$.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Chiều dài của mảnh giấy màu thứ hai là:</div><div>$25 + 15 = 40\\text{ (cm)}$</div><div>Nếu đặt hai mảnh giấy nối tiếp nhau (không dán đè), tổng chiều dài là:</div><div>$25 + 40 = 65\\text{ (cm)}$</div><div>Vì phần dán chồng đè lên nhau dài $5\\text{ cm}$ nên băng giấy mới dài là:</div><div>$65 - 5 = 60\\text{ (cm)}$</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $60\\text{ cm}$.</span></div>" },
{ t_title: "Bài 3", t_content: "Bạn Huy đi cầu thang bộ trong một tòa nhà. Huy để ý thấy từ tầng $1$ đi lên đến tầng $3$ thì phải bước qua tất cả $36$&nbsp;bậc thang. Hỏi nếu Huy muốn đi bộ từ tầng $1$ lên đến tận tầng $6$ của tòa nhà đó thì phải bước qua tổng cộng bao nhiêu bậc thang? (Biết số bậc thang giữa các tầng là như nhau).", strategy: "WHAT: Tính số bậc thang từ tầng $1$ lên tầng $6$.<br>HOW: Tính số \"khoảng tầng\" từ $1$ đến $3$. Sau đó tính số bậc thang trong $1$&nbsp;khoảng tầng. Cuối cùng nhân số bậc của $1$&nbsp;khoảng tầng với số \"khoảng tầng\" từ $1$ đến $6$.<br>WHY: Quãng đường đi không dựa trên \"số tầng\" mà dựa trên \"khoảng cách giữa các tầng\". Từ $1$ lên $3$ chỉ có $2$&nbsp;khoảng.<br>WHERE/WHEN/WHAT NEXT: Đây là bẫy toán học cực hay. Nhiều học sinh sẽ lấy $36$ chia cho $3$ (sai) thay vì chia cho $2$. Lên tầng $6$ tức là đi $5$&nbsp;khoảng, không phải $6$&nbsp;khoảng.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Từ tầng $1$ lên tầng $3$ có số \"khoảng tầng\" là:</div><div>$3 - 1 = 2\\text{ (khoảng)}$</div><div>Số bậc thang giữa một khoảng tầng (từ tầng này lên tầng ngay sát trên) là:</div><div>$36 : 2 = 18\\text{ (bậc)}$</div><div>Từ tầng $1$ lên tầng $6$ có số \"khoảng tầng\" là:</div><div>$6 - 1 = 5\\text{ (khoảng)}$</div><div>Để lên đến tầng $6$, bạn Huy phải bước qua số bậc thang là:</div><div>$18 \\times 5 = 90\\text{ (bậc)}$</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $90$&nbsp;bậc thang.</span></div>" },
{ t_title: "Bài 4", t_content: "Tìm một số có hai chữ số, biết chữ số hàng chục lớn hơn chữ số hàng đơn vị là $4$, và tổng của hai chữ số đó bằng $10$.", strategy: "WHAT: Tìm số có $2$&nbsp;chữ số thỏa mãn $2$&nbsp;điều kiện: Tổng các chữ số bằng $10$, Hiệu bằng $4$.<br>HOW: Liệt kê các cặp chữ số có tổng bằng $10$ ra nháp. Kiểm tra từng cặp xem cặp nào có chữ số hàng chục trừ chữ số hàng đơn vị bằng $4$ thì chọn.<br>WHY: Lớp $2$ chưa học công thức Tổng - Hiệu, nên phương pháp liệt kê loại trừ là tối ưu và logic nhất.<br>WHERE/WHEN/WHAT NEXT: Nhớ đọc kĩ \"chữ số hàng chục lớn hơn\", nên kết quả phải là $73$, nếu ghi $37$ là sai.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Ta có các cặp chữ số có tổng bằng $10$ là:</div><div>$(1\\text{ và }9); (2\\text{ và }8); (3\\text{ và }7); (4\\text{ và }6); (5\\text{ và }5)$.</div><div>Trong các cặp số trên, chỉ có cặp $(3\\text{ và }7)$ có hiệu bằng $4$ (vì $7 - 3 = 4$).</div><div>Vì chữ số hàng chục lớn hơn chữ số hàng đơn vị nên chữ số hàng chục phải là $7$, chữ số hàng đơn vị là $3$.</div><div>Số cần tìm là $73$.</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $73$.</span></div>" },
{ t_title: "Bài 5", t_content: "Người ta xếp các khối lập phương nhỏ bằng nhau thành một khối tháp $3$&nbsp;tầng (như hình vẽ bên dưới).<br><ul><li>Tầng dưới cùng xếp thành một hình vuông gồm $9$&nbsp;khối nhỏ.</li><li>Tầng thứ hai xếp thành một hình vuông gồm $4$&nbsp;khối nhỏ đặt chính giữa tầng đáy.</li><li>Tầng trên cùng là $1$&nbsp;khối nhỏ đặt ở đỉnh tháp.</li></ul>Hỏi để xếp được khối tháp đó, người ta đã dùng tất cả bao nhiêu khối lập phương nhỏ?<br><svg viewBox='0 0 100 80' class='w-32 h-auto mx-auto my-3'><rect x='20' y='50' width='60' height='20' fill='#93c5fd' stroke='#2563eb' stroke-width='2'/><rect x='35' y='30' width='30' height='20' fill='#60a5fa' stroke='#1d4ed8' stroke-width='2'/><rect x='42.5' y='10' width='15' height='20' fill='#3b82f6' stroke='#1e40af' stroke-width='2'/></svg>", strategy: "WHAT: Đếm tổng số khối lập phương kể cả các khối bị che khuất không nhìn thấy.<br>HOW: Tính số khối của từng tầng dựa trên gợi ý bằng chữ của đề bài thay vì chỉ nhìn hình đếm bằng mắt. Sau đó cộng dồn cả $3$&nbsp;tầng.<br>WHY: Hình học 3D có nhiều góc khuất. Nếu chỉ đếm các khối nhìn thấy được, học sinh sẽ bị thiếu số lượng.<br>WHERE/WHEN/WHAT NEXT: Thực hiện phép cộng $9 + 4 + 1$ là ra đáp án. Bài toán luyện tính cẩn thận và liên kết dữ kiện văn bản với hình ảnh.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Số khối lập phương nhỏ ở tầng dưới cùng là: $9$ (khối).</div><div>Số khối lập phương nhỏ ở tầng thứ hai là: $4$ (khối).</div><div>Số khối lập phương nhỏ ở đỉnh tháp là: $1$ (khối).</div><div>Để xếp được khối tháp đó, người ta đã dùng tất cả số khối lập phương nhỏ là:</div><div>$9 + 4 + 1 = 14\\text{ (khối)}$</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $14$&nbsp;khối lập phương nhỏ.</span></div>" },
{ t_title: "Bài 6", t_content: "Tại một nông trại, người ta tính được rằng cứ $3$&nbsp;con mèo thì sẽ bắt được $3$&nbsp;con chuột trong thời gian đúng $3$&nbsp;phút. Theo tốc độ đó, nếu có $5$&nbsp;con mèo thì chúng sẽ bắt được $5$&nbsp;con chuột trong thời gian là bao nhiêu phút? Giải thích vì sao?", strategy: "WHAT: Tính thời gian bắt chuột khi số lượng mèo và chuột cùng tăng lên một tỷ lệ bằng nhau.<br>HOW: Suy luận tốc độ của MỘT con mèo. Từ dữ kiện $3$&nbsp;mèo bắt $3$&nbsp;chuột trong $3$&nbsp;phút, ta suy ra mỗi con mèo sẽ nhận nhiệm vụ bắt riêng $1$&nbsp;con chuột, và nó mất đúng $3$&nbsp;phút để hoàn thành việc đó.<br>WHY: Hành động bắt chuột của các con mèo là hành động diễn ra ĐỒNG THỜI (cùng lúc), không phải con này bắt xong mới tới con kia.<br>WHERE/WHEN/WHAT NEXT: Vậy với $5$&nbsp;con mèo, mỗi con cũng nhận mục tiêu là $1$&nbsp;con chuột. Chúng cùng làm việc đồng thời, nên sau đúng $3$&nbsp;phút thì cả $5$&nbsp;con chuột đều bị bắt. Bẫy đồng dạng hay nhầm thành $5$&nbsp;phút.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Có $3$&nbsp;con mèo bắt $3$&nbsp;con chuột trong $3$&nbsp;phút, tức là mỗi con mèo tự bắt $1$&nbsp;con chuột cho riêng mình và nó cần thời gian là $3$&nbsp;phút để bắt được chuột.</div><div>Vì các con mèo làm việc cùng lúc với nhau (đồng thời), nên nếu có $5$&nbsp;con mèo bắt $5$&nbsp;con chuột, thì mỗi con mèo cũng chỉ cần bắt $1$&nbsp;con chuột.</div><div>Do đó, thời gian để $5$&nbsp;con mèo bắt xong $5$&nbsp;con chuột vẫn bằng thời gian $1$&nbsp;con mèo bắt $1$&nbsp;con chuột.</div><div>Vậy $5$&nbsp;con mèo bắt $5$&nbsp;con chuột trong $3$&nbsp;phút.</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $3$&nbsp;phút.</span></div>" }
]

trac_nghiem: [
{ q_title: "Câu 1", q_content: "Số chẵn bé nhất có hai chữ số mà tổng các chữ số của nó bằng 8 là số nào?", options: ["A. $17$", "B. $26$", "C. $80$", "D. $44$"], correct_idx: 1, explain: "Các số có $2$&nbsp;chữ số tổng bằng $8$: $17, 71, 26, 62, 35, 53, 44, 80$. Các số chẵn: $26, 62, 44, 80$. Số chẵn bé nhất là $26$." },
{ q_title: "Câu 2", q_content: "Ngày mai là thứ Bảy. Hỏi 10 ngày nữa kể từ hôm nay là thứ mấy?", options: ["A. Thứ Hai", "B. Thứ Ba", "C. Thứ Tư", "D. Thứ Năm"], correct_idx: 0, explain: "Ngày mai thứ Bảy $\\rightarrow$ Hôm nay thứ Sáu. $7$&nbsp;ngày sau là thứ Sáu. $10$&nbsp;ngày sau là: thứ Sáu + $3$&nbsp;ngày = thứ Hai." },
{ q_title: "Câu 3", q_content: "Hình bên dưới có tất cả bao nhiêu hình tứ giác?<br><svg viewBox='0 0 100 80' class='w-40 h-auto mx-auto my-3'><polygon points='30,10 70,10 90,70 10,70' fill='none' stroke='#3b82f6' stroke-width='2'/><line x1='30' y1='10' x2='90' y2='70' stroke='#3b82f6' stroke-width='2'/><line x1='70' y1='10' x2='70' y2='70' stroke='#3b82f6' stroke-width='2'/></svg>", options: ["A. $4$&nbsp;hình", "B. $5$&nbsp;hình", "C. $6$&nbsp;hình", "D. $7$&nbsp;hình"], correct_idx: 2, explain: "Việc tạo các đường chéo và đường cao trong hình thang sẽ tạo ra các hình tứ giác là: bản thân hình thang lớn (1), 2 tứ giác bên trái (trên, dưới) và 2 tứ giác bên phải (trên, dưới) được chia bởi đường thẳng đứng, 1 tứ giác lệch được tạo bởi đường chéo. Tổng cộng $6$&nbsp;hình." },
{ q_title: "Câu 4", q_content: "Tìm quy luật và điền số tiếp theo vào chỗ chấm: $1; 2; 4; 7; 11; \\dots$", options: ["A. $15$", "B. $16$", "C. $17$", "D. $18$"], correct_idx: 1, explain: "Khoảng cách tăng dần: $+1, +2, +3, +4$. Số tiếp theo: $11 + 5 = 16$." },
{ q_title: "Câu 5", q_content: "Tổng của hai số là 45. Nếu giữ nguyên số thứ nhất và tăng số thứ hai thêm 12 đơn vị thì tổng mới là bao nhiêu?", options: ["A. $33$", "B. $57$", "C. $45$", "D. $69$"], correct_idx: 1, explain: "Khi một số hạng tăng, tổng sẽ tăng lên một lượng tương ứng. $45 + 12 = 57$." },
{ q_title: "Câu 6", q_content: "Trong một hộp có 7 viên bi vàng và 4 viên bi trắng. Không nhìn vào hộp, phải lấy ra ít nhất bao nhiêu viên bi để chắc chắn có 1 viên bi màu trắng?", options: ["A. $2$&nbsp;viên", "B. $5$&nbsp;viên", "C. $8$&nbsp;viên", "D. $11$&nbsp;viên"], correct_idx: 2, explain: "Bốc rủi ro nhất là toàn bi vàng ($7$&nbsp;viên). Bốc thêm $1$&nbsp;viên nữa chắc chắn là trắng. Vậy cần: $7 + 1 = 8$&nbsp;viên." },
{ q_title: "Câu 7", q_content: "Một khúc gỗ dài $12\\text{ m}$. Bác thợ mộc cưa khúc gỗ đó thành các đoạn ngắn, mỗi đoạn dài $2\\text{ m}$. Hỏi bác thợ mộc phải cưa bao nhiêu nhát? (Biết bác không ghép các khúc gỗ lại để cưa chung)", options: ["A. $6$&nbsp;nhát", "B. $5$&nbsp;nhát", "C. $7$&nbsp;nhát", "D. $4$&nbsp;nhát"], correct_idx: 1, explain: "Số đoạn gỗ: $12 : 2 = 6$&nbsp;(đoạn). Số nhát cưa = Số đoạn - $1$. Vậy cần: $6 - 1 = 5$&nbsp;nhát cưa." },
{ q_title: "Câu 8", q_content: "Bạn Hà có 3 tờ tiền loại 5 nghìn đồng, 1 tờ tiền loại 2 nghìn đồng và 2 tờ tiền loại 1 nghìn đồng. Hà muốn mua một cuốn truyện giá 18 nghìn đồng. Hỏi Hà có đủ tiền mua không? Nếu thừa hoặc thiếu thì bao nhiêu?", options: ["A. Vừa đủ tiền", "B. Thiếu $1$&nbsp;nghìn đồng", "C. Thừa $1$&nbsp;nghìn đồng", "D. Thừa $2$&nbsp;nghìn đồng"], correct_idx: 2, explain: "Tổng tiền Hà có: $3 \\times 5 + 1 \\times 2 + 2 \\times 1 = 15 + 2 + 2 = 19$&nbsp;(nghìn đồng). Hà thừa: $19 - 18 = 1$&nbsp;(nghìn đồng)." },
{ q_title: "Câu 9", q_content: "Hiện nay An 10 tuổi. Mẹ An 36 tuổi. Hỏi hiệu số tuổi của mẹ và An cách đây 3 năm là bao nhiêu?", options: ["A. $23$&nbsp;tuổi", "B. $26$&nbsp;tuổi", "C. $29$&nbsp;tuổi", "D. $33$&nbsp;tuổi"], correct_idx: 1, explain: "Hiệu số tuổi của hai người KHÔNG BAO GIỜ thay đổi theo thời gian. Hiệu số tuổi hiện nay là $36 - 10 = 26$. Cách đây $3$&nbsp;năm hiệu vẫn là $26$. Bẫy trừ đi $3$&nbsp;tuổi ở mỗi người." },
{ q_title: "Câu 10", q_content: "Trên một bàn cân đĩa thăng bằng, đĩa bên trái có 1 túi đường và 1 quả cân 2kg. Đĩa bên phải có 1 quả cân 5kg. Hỏi túi đường nặng bao nhiêu ki-lô-gam?", options: ["A. $7\\text{ kg}$", "B. $2\\text{ kg}$", "C. $5\\text{ kg}$", "D. $3\\text{ kg}$"], correct_idx: 3, explain: "Hai bên cân bằng nên: Đường + $2$ = $5$ $\\rightarrow$ Đường = $5 - 2 = 3$&nbsp;(kg)." },
{ q_title: "Câu 11", q_content: "Trong vườn thú có một số con đà điểu và một số con hươu cao cổ. Bạn Tí đếm được tất cả 6 cái đầu và 16 cái chân. Hỏi trong vườn thú có bao nhiêu con đà điểu?", options: ["A. $2$&nbsp;con", "B. $3$&nbsp;con", "C. $4$&nbsp;con", "D. $5$&nbsp;con"], correct_idx: 2, explain: "Giả sử tất cả $6$&nbsp;con đều là đà điểu ($2$&nbsp;chân), tổng số chân là: $6 \\times 2 = 12$&nbsp;chân. Hụt $16 - 12 = 4$&nbsp;chân. Mỗi con hươu ($4$&nbsp;chân) hơn đà điểu $2$&nbsp;chân. Số hươu: $4 : 2 = 2$&nbsp;con. Số đà điểu: $6 - 2 = 4$&nbsp;con." },
{ q_title: "Câu 12", q_content: "Lớp 2A xếp thành một hàng dọc. Bạn Hùng đứng thứ 7 tính từ trên xuống và đứng thứ 9 tính từ dưới lên. Hỏi lớp 2A có bao nhiêu học sinh?", options: ["A. $16$&nbsp;bạn", "B. $15$&nbsp;bạn", "C. $14$&nbsp;bạn", "D. $17$&nbsp;bạn"], correct_idx: 1, explain: "Hùng được đếm $2$&nbsp;lần (từ trên xuống và từ dưới lên). Tổng số bạn: $7 + 9 - 1 = 15$&nbsp;(bạn)." }
],

{ t_title: "Bài 1", t_content: "Tìm $X$, biết: <div class='text-center text-xl my-4'>$100 - X = 36 + 25$</div>", strategy: "WHAT: Tìm $X$ trong vai trò là Số trừ.<br>HOW: Thu gọn vế phải. Sau đó áp dụng quy tắc \"Số bị trừ - Hiệu\".<br>WHY: Đưa bài toán về dạng cơ bản $a - X = b$.<br>WHERE/WHEN/WHAT NEXT: Chú ý thực hiện phép tính vế phải trước.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>$100 - X = 36 + 25$</div><div>$100 - X = 61$</div><div>$X = 100 - 61$</div><div>$X = 39$</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $X = 39$.</span></div>" },
{ t_title: "Bài 2", t_content: "Bạn Hoa đánh số trang một cuốn vở từ trang 1 đến trang 20. Hỏi bạn Hoa đã phải viết tất cả bao nhiêu chữ số?", strategy: "WHAT: Đếm số lượng chữ số dùng để đánh số trang từ $1$ đến $20$.<br>HOW: Chia làm $2$&nbsp;nhóm: Nhóm trang có $1$&nbsp;chữ số ($1-9$) và nhóm trang có $2$&nbsp;chữ số ($10-20$). Tính số chữ số của từng nhóm rồi cộng lại.<br>WHY: Phân loại theo số lượng chữ số để đếm không bị sót.<br>WHERE/WHEN/WHAT NEXT: Chú ý từ $10$ đến $20$ có $20 - 10 + 1 = 11$&nbsp;số, không phải $10$&nbsp;số.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Từ trang $1$ đến trang $9$ có số trang là:</div><div>$9 - 1 + 1 = 9$&nbsp;(trang)</div><div>Số chữ số cần dùng cho nhóm trang này là:</div><div>$9 \\times 1 = 9$&nbsp;(chữ số)</div><div>Từ trang $10$ đến trang $20$ có số trang là:</div><div>$20 - 10 + 1 = 11$&nbsp;(trang)</div><div>Số chữ số cần dùng cho nhóm trang này là:</div><div>$11 \\times 2 = 22$&nbsp;(chữ số)</div><div>Tổng số chữ số bạn Hoa đã phải viết là:</div><div>$9 + 22 = 31$&nbsp;(chữ số)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $31$&nbsp;chữ số.</span></div>" },
{ t_title: "Bài 3", t_content: "Một người nông dân mang cam ra chợ bán. Lần thứ nhất người đó bán được một nửa số cam. Lần thứ hai người đó bán được 10 quả cam thì trong rổ còn lại đúng 5 quả cam. Hỏi lúc đầu người nông dân mang ra chợ bao nhiêu quả cam?", strategy: "WHAT: Tìm số cam ban đầu bằng phương pháp tính ngược từ cuối.<br>HOW: Khôi phục dần: Trước khi bán lần hai, số cam là bao nhiêu? Số cam này tương ứng với \"một nửa\" sau lần bán thứ nhất. Từ đó tính số ban đầu.<br>WHY: Khi biết kết quả cuối cùng và các bước biến đổi, đi ngược lại các bước là cách tư duy mạch lạc nhất.<br>WHERE/WHEN/WHAT NEXT: Bẫy \"một nửa\". Khi còn lại $1$&nbsp;nửa, ta nhân $2$ để ra tổng.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Sau khi bán lần thứ nhất, số cam còn lại trong rổ trước khi bán lần thứ hai là:</div><div>$10 + 5 = 15$&nbsp;(quả)</div><div>Vì lần thứ nhất người đó bán được một nửa số cam, nên $15$&nbsp;quả cam chính là một nửa số cam ban đầu.</div><div>Lúc đầu người nông dân mang ra chợ số quả cam là:</div><div>$15 \\times 2 = 30$&nbsp;(quả)</div><div>Hoặc: $15 + 15 = 30$&nbsp;(quả)</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: $30$&nbsp;quả cam.</span></div>" },
{ t_title: "Bài 4", t_content: "Điền các số 1, 2, 3, 4, 5 vào 5 ô trống hình tròn sao cho tổng 3 số trên cùng một hàng ngang bằng tổng 3 số trên cùng một cột dọc. (Mỗi số chỉ được dùng một lần).<br><svg viewBox='0 0 100 100' class='w-32 h-auto mx-auto my-3'><circle cx='50' cy='50' r='12' fill='none' stroke='#3b82f6' stroke-width='2'/><circle cx='20' cy='50' r='12' fill='none' stroke='#3b82f6' stroke-width='2'/><circle cx='80' cy='50' r='12' fill='none' stroke='#3b82f6' stroke-width='2'/><circle cx='50' cy='20' r='12' fill='none' stroke='#3b82f6' stroke-width='2'/><circle cx='50' cy='80' r='12' fill='none' stroke='#3b82f6' stroke-width='2'/><line x1='32' y1='50' x2='38' y2='50' stroke='#3b82f6' stroke-width='2'/><line x1='62' y1='50' x2='68' y2='50' stroke='#3b82f6' stroke-width='2'/><line x1='50' y1='32' x2='50' y2='38' stroke='#3b82f6' stroke-width='2'/><line x1='50' y1='62' x2='50' y2='68' stroke='#3b82f6' stroke-width='2'/></svg>", strategy: "WHAT: Sắp xếp $5$&nbsp;số vào hình chữ thập sao cho tổng $3$&nbsp;số ngang bằng tổng $3$&nbsp;số dọc.<br>HOW: Tính tổng $5$&nbsp;số. Nhận thấy ô tâm được tính $2$&nbsp;lần (vào cả tổng ngang và tổng dọc). Đặt giả thiết ô tâm là số chẵn/lẻ để thử. Cách khác: Tổng (ngang) = Tổng (dọc). Tổng $5$&nbsp;số = $1+2+3+4+5=15$. (Tổng ngang + Tổng dọc) - Ô tâm = $15$ $\\rightarrow$ $2 \\times$ Tổng - Ô tâm = $15$. Ô tâm phải là số lẻ ($1, 3, 5$).<br>WHY: Ô tâm là giao điểm, là \"chìa khóa\" cân bằng hai hàng.<br>WHERE/WHEN/WHAT NEXT: Thử chọn ô tâm. Ví dụ ô tâm là $3$. Hàng ngang cần tổng $2$&nbsp;số còn lại = Hàng dọc cần tổng $2$&nbsp;số còn lại. $(1+5)$ và $(2+4)$ đều bằng $6$. Thỏa mãn.", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Tổng của $5$&nbsp;số là: $1 + 2 + 3 + 4 + 5 = 15$.</div><div>Vì ô ở giữa (ô tâm) được tính vào cả tổng hàng ngang và tổng cột dọc nên:</div><div>Tổng hàng ngang + Tổng cột dọc = Tổng $5$&nbsp;số + Số ở ô giữa.</div><div>Mà Tổng hàng ngang = Tổng cột dọc. Suy ra:</div><div>$2 \\times$ Tổng hàng ngang = $15 +$ Số ở ô giữa.</div><div>Vì ($2 \\times$ Tổng hàng ngang) là số chẵn, nên ($15 +$ Số ở ô giữa) cũng phải là số chẵn. Do $15$ là số lẻ nên Số ở ô giữa phải là số lẻ ($1, 3$ hoặc $5$).</div><div>- Trường hợp 1: Số ở ô giữa là $3$. Ta có các cặp số còn lại có tổng bằng nhau là: $1 + 5 = 6$ và $2 + 4 = 6$. Sắp xếp: Đặt số $3$ vào ô giữa. Đặt $1$ và $5$ vào $2$&nbsp;ô hàng ngang. Đặt $2$ và $4$ vào $2$&nbsp;ô cột dọc. (Tổng hàng ngang = Tổng cột dọc = $1+5+3 = 2+4+3 = 9$).</div><div>*(Học sinh chỉ cần trình bày 1 cách đúng hoặc vẽ hình điền số hợp lý là đạt điểm tối đa).*</div>" },
{ t_title: "Bài 5", t_content: "Có 3 can nhựa với sức chứa lần lượt là: can 7 lít, can 5 lít và can 2 lít. Ban đầu, can 7 lít đựng đầy nước mắm, còn hai can kia không có gì. Làm thế nào để chỉ bằng các thao tác rót nước mắm qua lại giữa các can, người ta lấy ra được đúng 1 lít nước mắm?", strategy: "WHAT: Dùng $3$&nbsp;can ($7\\text{L}, 5\\text{L}, 2\\text{L}$) để rót qua lại lấy đúng $1$&nbsp;lít nước mắm.<br>HOW: Rót đầy can $5\\text{L}$ từ can $7\\text{L}$. Can $7\\text{L}$ còn $2\\text{L}$. Từ can $5\\text{L}$, rót đầy can $2\\text{L}$ $2$&nbsp;lần (lần $1$ rót đầy can $2\\text{L}$, đổ can $2\\text{L}$ vào lại can $7\\text{L}$; lần $2$ rót tiếp từ can $5\\text{L}$ đầy can $2\\text{L}$).<br>WHY: Tạo ra sự hao hụt. $5 - 2 - 2 = 1$.<br>WHERE/WHEN/WHAT NEXT: Phải viết rõ từng bước rót (từ can nào sang can nào, mỗi can còn bao nhiêu).", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Ta thực hiện các bước rót như sau:</div><div><strong>Bước 1:</strong> Rót đầy can $5$&nbsp;lít từ can $7$&nbsp;lít. Lúc này, can $7$&nbsp;lít còn $2$&nbsp;lít, can $5$&nbsp;lít có $5$&nbsp;lít, can $2$&nbsp;lít trống. ($2\\text{L} - 5\\text{L} - 0\\text{L}$)</div><div><strong>Bước 2:</strong> Rót đầy can $2$&nbsp;lít từ can $5$&nbsp;lít. Lúc này, can $5$&nbsp;lít còn $3$&nbsp;lít, can $2$&nbsp;lít có $2$&nbsp;lít. ($2\\text{L} - 3\\text{L} - 2\\text{L}$)</div><div><strong>Bước 3:</strong> Đổ hết nước mắm từ can $2$&nbsp;lít vào lại can $7$&nbsp;lít. Lúc này, can $7$&nbsp;lít có $4$&nbsp;lít, can $2$&nbsp;lít trống. ($4\\text{L} - 3\\text{L} - 0\\text{L}$)</div><div><strong>Bước 4:</strong> Lại rót đầy can $2$&nbsp;lít từ can $5$&nbsp;lít (can $5$&nbsp;lít đang có $3$&nbsp;lít). Lúc này, lượng nước mắm còn lại trong can $5$&nbsp;lít là: $3 - 2 = 1$&nbsp;(lít).</div><div>Vậy ta đã lấy được đúng $1$&nbsp;lít nước mắm ở can $5$&nbsp;lít.</div><div><span class='font-bold mt-2 text-indigo-700 block'>Đáp số: Đã lấy được $1$&nbsp;lít nước mắm.</span></div>" },
{ t_title: "Bài 6", t_content: "Bốn bạn An, Bình, Cúc, Dung thi chạy. Khi được hỏi về kết quả, các bạn nói như sau:<br><ul><li>An: \"Mình không về đầu cũng không về cuối.\"</li><li>Bình: \"Mình về đích sau Cúc nhưng trước An.\"</li><li>Cúc: \"Mình về đích thứ hai.\"</li></ul>Biết rằng mỗi bạn nói đúng một phần và sai một phần, và Cúc không về nhất. Dựa vào suy luận logic, em hãy xác định thứ tự về đích của 4 bạn từ hạng 1 đến hạng 4.", strategy: "WHAT: Sắp xếp thứ tự về đích của $4$&nbsp;bạn dựa trên các lời khai \"một nửa đúng, một nửa sai\".<br>HOW: Lập bảng hoặc sơ đồ. Bắt đầu từ dữ kiện chắc chắn: Cúc không về nhất. Nếu lời của Cúc \"Mình về đích thứ hai\" là ĐÚNG, ta suy luận tiếp. Nếu lời Cúc SAI, ta tìm mâu thuẫn.<br>WHY: Phương pháp giả thiết - phản chứng là công cụ mạnh nhất cho toán logic.<br>WHERE/WHEN/WHAT NEXT: Bài này đòi hỏi khả năng bóc tách mệnh đề. Phân tích lời của Bình: \"Mình về sau Cúc (1) nhưng trước An (2)\".", solution: "<div><span class='font-bold text-blue-700'>Bài giải:</span></div><div>Giả sử Cúc nói thật: \"Mình về đích thứ hai\". Vì Bình nói \"Mình về đích sau Cúc nhưng trước An\" nên thứ tự phải là: Cúc $\\rightarrow$ Bình $\\rightarrow$ An. Lúc này Cúc hạng $2$, Bình hạng $3$, An hạng $4$.</div><div>Nhưng An nói: \"Mình không về đầu cũng không về cuối.\" (Tức là không về $1$ cũng không về $4$). Nếu An về hạng $4$ thì cả $2$&nbsp;vế câu nói của An đều sai (mâu thuẫn với đề bài: mỗi bạn nói đúng một phần, sai một phần). $\\rightarrow$ Vậy Cúc phải nói dối.</div><div>Vì Cúc không về thứ hai và cũng không về nhất (theo đề bài) $\\rightarrow$ Cúc về thứ $3$ hoặc thứ $4$.</div><div>Giả sử Cúc về thứ $4$. Lời của Bình: \"Mình về sau Cúc\" (sẽ sai, vì không ai sau Cúc nữa). Vậy lời \"Mình về trước An\" của Bình phải đúng. Thứ tự: Bình $\\rightarrow$ An $\\rightarrow$ Cúc. Cúc hạng $4$, Bình và An chiếm hạng $1, 2$ hoặc $2, 3$.</div><div>Nhưng An nói không về đầu, không về cuối. Vậy An hạng $2$ hoặc $3$. Nếu An hạng $3$, Bình hạng $2$ (thỏa mãn Bình trước An). Lúc này Dung sẽ về $1$. Kiểm tra lại lời của An: \"Không về đầu\" (Đúng - hạng $3$), \"không về cuối\" (Sai - An hạng $3$ là không cuối, vậy phải có $1$&nbsp;vế sai. Ồ, câu của An là $1$&nbsp;mệnh đề liên kết \"A và B\". An hạng $3$ thì \"không về đầu\" là ĐÚNG, \"không về cuối\" là ĐÚNG. Mâu thuẫn!). Vậy An phải nói sai $1$&nbsp;vế. Tức là An hoặc về đầu, hoặc về cuối.</div><div>Nhưng An không thể về đầu (vì Bình về trước An). Vậy An về cuối (Hạng $4$).</div><div>Nếu An hạng $4$: Bình về trước An (Bình hạng $1, 2$, hoặc $3$). Cúc không về nhất, không về $2$ (đã chứng minh Cúc nói dối). Vậy Cúc hạng $3$. Bình về sau Cúc (sai, vì Bình phải hạng $1$ hoặc $2$ thì câu này mới sai, câu \"Bình trước An\" mới đúng). Vậy Bình hạng $2$. Suy ra Dung hạng $1$.</div><div>Thứ tự: <strong>1. Dung, 2. Bình, 3. Cúc, 4. An.</strong></div><div>*(Học sinh có thể lập luận theo cách khác, miễn logic và ra kết quả).*</div>" }
]
